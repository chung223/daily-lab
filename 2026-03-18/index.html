<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>竹林風禪 | Bamboo Sway</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #0a1a0a;
      --bg-mid: #0f240f;
      --jade-dark: #1a3a1a;
      --jade-mid: #2d5a2d;
      --jade-light: #4a7c4a;
      --jade-soft: #8fbc8f;
      --amber: #d4a574;
      --amber-light: #e8c9a0;
      --gold: #ffd700;
      --gold-dim: #b8960a;
      --text-light: #e8f5e8;
      --text-muted: #5a7a5a;
      --glass-bg: rgba(15, 36, 15, 0.6);
      --glass-border: rgba(143, 188, 143, 0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Noto Serif TC', serif;
      background: var(--bg-deep);
      color: var(--text-light);
    }

    /* Layered Background */
    .bg-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .bg-deep {
      background: radial-gradient(ellipse at 50% 0%, #0f2a0f 0%, var(--bg-deep) 70%);
    }

    /* Light Rays */
    .light-rays {
      background: 
        linear-gradient(160deg, 
          rgba(255, 215, 0, 0.08) 0%, 
          transparent 35%,
          transparent 65%,
          rgba(212, 165, 116, 0.06) 100%
        ),
        linear-gradient(200deg,
          rgba(255, 215, 0, 0.05) 0%,
          transparent 40%
        ),
        linear-gradient(140deg,
          rgba(212, 165, 116, 0.04) 0%,
          transparent 30%
        );
      animation: raysPulse 12s ease-in-out infinite;
    }

    @keyframes raysPulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* Dust Particles */
    .dust-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Bamboo Forest Container */
    .forest-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 120px;
    }

    .bamboo-group {
      display: flex;
      gap: 20px;
      align-items: flex-end;
      height: 70vh;
    }

    .bamboo-stalk {
      position: relative;
      width: 12px;
      background: linear-gradient(to top, 
        var(--jade-dark) 0%, 
        var(--jade-mid) 40%, 
        var(--jade-light) 80%, 
        var(--jade-soft) 100%
      );
      border-radius: 6px;
      transform-origin: bottom center;
      animation: sway var(--sway-duration, 4s) ease-in-out infinite;
      animation-delay: var(--sway-delay, 0s);
      box-shadow: 
        -2px 0 8px rgba(45, 90, 45, 0.5),
        2px 0 8px rgba(45, 90, 45, 0.3);
    }

    .bamboo-stalk::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 100%;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 25px,
        rgba(74, 124, 74, 0.4) 25px,
        rgba(74, 124, 74, 0.4) 27px
      );
      border-radius: 6px;
    }

    .bamboo-stalk::after {
      content: '';
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 8px;
      background: var(--jade-dark);
      border-radius: 8px 8px 0 0;
    }

    @keyframes sway {
      0%, 100% { transform: rotate(var(--sway-start, -3deg)); }
      50% { transform: rotate(var(--sway-end, 3deg)); }
    }

    /* Leaf Particles */
    .leaf {
      position: absolute;
      width: 8px;
      height: 4px;
      background: var(--jade-soft);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      opacity: 0;
      pointer-events: none;
      animation: leafFall linear forwards;
    }

    @keyframes leafFall {
      0% {
        opacity: 0.8;
        transform: translate(0, 0) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(var(--dx, 50px), var(--dy, 200px)) rotate(var(--rot, 360deg));
      }
    }

    /* Control Panel */
    .control-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px;
      background: linear-gradient(to top, 
        rgba(10, 26, 10, 0.95) 0%, 
        rgba(10, 26, 10, 0.8) 70%, 
        transparent 100%
      );
      backdrop-filter: blur(10px);
    }

    .panel-inner {
      max-width: 600px;
      margin: 0 auto;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 16px;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--text-muted);
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-value {
      color: var(--amber);
      font-weight: 400;
    }

    .wind-bar {
      width: 80px;
      height: 6px;
      background: var(--jade-dark);
      border-radius: 3px;
      overflow: hidden;
    }

    .wind-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--jade-soft), var(--amber));
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .buttons-row {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .btn {
      padding: 12px 24px;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      color: var(--text-light);
      font-family: 'Noto Serif TC', serif;
      font-size: 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
    }

    .btn:hover {
      background: rgba(45, 90, 45, 0.5);
      border-color: var(--jade-soft);
    }

    .btn.active {
      background: rgba(212, 165, 116, 0.2);
      border-color: var(--amber);
      color: var(--amber);
    }

    /* Wind Interaction */
    .wind-indicator {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 8px 16px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--text-muted);
      backdrop-filter: blur(5px);
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .wind-indicator.visible {
      opacity: 1;
    }

    /* Instructions */
    .instructions {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      opacity: 0.7;
      transition: opacity 1s ease;
      pointer-events: none;
    }

    .instructions.hidden {
      opacity: 0;
    }

    .instructions h2 {
      font-size: 24px;
      font-weight: 300;
      color: var(--amber-light);
      margin-bottom: 8px;
    }

    /* Sound Toggle */
    .sound-waves {
      display: inline-block;
      margin-left: 8px;
    }

    .sound-waves span {
      display: inline-block;
      width: 3px;
      height: 12px;
      background: var(--amber);
      margin: 0 1px;
      border-radius: 2px;
      animation: soundWave 1s ease-in-out infinite;
    }

    .sound-waves span:nth-child(2) { animation-delay: 0.1s; }
    .sound-waves span:nth-child(3) { animation-delay: 0.2s; }

    @keyframes soundWave {
      0%, 100% { transform: scaleY(0.5); }
      50% { transform: scaleY(1); }
    }

    .btn.muted .sound-waves span {
      animation: none;
      transform: scaleY(0.3);
      opacity: 0.5;
    }

    /* Mobile Responsive */
    @media (max-width: 600px) {
      .bamboo-group {
        gap: 12px;
      }
      
      .bamboo-stalk {
        width: 8px;
      }
      
      .btn {
        padding: 10px 16px;
        font-size: 13px;
      }
      
      .stats-row {
        font-size: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-layer bg-deep"></div>
  <div class="bg-layer light-rays"></div>
  <canvas id="dustCanvas" class="dust-layer"></canvas>

  <div class="forest-container">
    <div class="bamboo-group" id="bambooGroup"></div>
  </div>

  <div class="wind-indicator" id="windIndicator">
    🌬️ 風: <span id="windValue">0</span>%
  </div>

  <div class="instructions" id="instructions">
    <h2>🎋 竹林風禪</h2>
    <p>滑動螢幕或長按產生微風</p>
  </div>

  <div class="control-panel">
    <div class="panel-inner">
      <div class="stats-row">
        <div class="stat-item">
          <span>🌬️ 風力</span>
          <div class="wind-bar">
            <div class="wind-fill" id="windFill" style="width: 0%"></div>
          </div>
        </div>
        <div class="stat-item">
          <span>⏱️ 禪坐</span>
          <span class="stat-value" id="sessionTime">00:00</span>
        </div>
        <div class="stat-item">
          <span>🍃 落葉</span>
          <span class="stat-value" id="leafCount">0</span>
        </div>
      </div>
      <div class="buttons-row">
        <button class="btn" id="btnWind">🌬️ 產生微風</button>
        <button class="btn" id="btnSound">🔊 自然音效</button>
        <button class="btn" id="btnTimer">⏱️ 5分鐘禪坐</button>
      </div>
    </div>
  </div>

  <script>
    // ===== Configuration =====
    const CONFIG = {
      bambooCount: 15,
      minHeight: 200,
      maxHeight: 450,
      swayRange: 4,
      baseSwayDuration: 4,
      dustParticles: 30,
      leafSpawnChance: 0.3
    };

    // ===== State =====
    let state = {
      windIntensity: 0,
      sessionStart: null,
      sessionSeconds: 0,
      leafCount: parseInt(localStorage.getItem('bambooSway_leaves') || '0'),
      soundEnabled: false,
      timerRunning: false,
      timerMinutes: 0,
      audioContext: null,
      isInteracting: false
    };

    // ===== DOM Elements =====
    const bambooGroup = document.getElementById('bambooGroup');
    const windIndicator = document.getElementById('windIndicator');
    const windValue = document.getElementById('windValue');
    const windFill = document.getElementById('windFill');
    const sessionTime = document.getElementById('sessionTime');
    const leafCountEl = document.getElementById('leafCount');
    const instructions = document.getElementById('instructions');
    const btnWind = document.getElementById('btnWind');
    const btnSound = document.getElementById('btnSound');
    const btnTimer = document.getElementById('btnTimer');
    const dustCanvas = document.getElementById('dustCanvas');
    const dustCtx = dustCanvas.getContext('2d');

    // ===== Initialize =====
    function init() {
      createBamboo();
      initDustParticles();
      startSession();
      updateLeafCount();
      
      // Event listeners
      setupInteractions();
      
      // Hide instructions after first interaction
      setTimeout(() => {
        if (!state.isInteracting) {
          instructions.classList.add('hidden');
        }
      }, 8000);
    }

    // ===== Create Bamboo Stalks =====
    function createBamboo() {
      bambooGroup.innerHTML = '';
      
      for (let i = 0; i < CONFIG.bambooCount; i++) {
        const stalk = document.createElement('div');
        stalk.className = 'bamboo-stalk';
        
        const height = CONFIG.minHeight + Math.random() * (CONFIG.maxHeight - CONFIG.minHeight);
        const swayStart = -CONFIG.swayRange + Math.random() * 2;
        const swayEnd = CONFIG.swayRange + Math.random() * 2;
        const swayDuration = CONFIG.baseSwayDuration + Math.random() * 2;
        const swayDelay = Math.random() * -4;
        
        stalk.style.height = height + 'px';
        stalk.style.setProperty('--sway-start', swayStart + 'deg');
        stalk.style.setProperty('--sway-end', swayEnd + 'deg');
        stalk.style.setProperty('--sway-duration', swayDuration + 's');
        stalk.style.setProperty('--sway-delay', swayDelay + 's');
        
        bambooGroup.appendChild(stalk);
      }
    }

    // ===== Dust Particles =====
    let dustParticles = [];

    function initDustParticles() {
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      
      for (let i = 0; i < CONFIG.dustParticles; i++) {
        dustParticles.push(createDustParticle());
      }
      
      animateDust();
    }

    function resizeCanvas() {
      dustCanvas.width = window.innerWidth;
      dustCanvas.height = window.innerHeight;
    }

    function createDustParticle() {
      return {
        x: Math.random() * dustCanvas.width,
        y: Math.random() * dustCanvas.height,
        size: 1 + Math.random() * 2,
        speedX: 0.2 + Math.random() * 0.5,
        speedY: 0.1 + Math.random() * 0.3,
        opacity: 0.1 + Math.random() * 0.3,
        wobble: Math.random() * Math.PI * 2
      };
    }

    function animateDust() {
      dustCtx.clearRect(0, 0, dustCanvas.width, dustCanvas.height);
      
      dustParticles.forEach(p => {
        p.wobble += 0.02;
        p.x += p.speedX + Math.sin(p.wobble) * 0.3 + state.windIntensity * 0.5;
        p.y += p.speedY;
        
        if (p.x > dustCanvas.width) p.x = 0;
        if (p.y > dustCanvas.height) p.y = 0;
        
        dustCtx.beginPath();
        dustCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        dustCtx.fillStyle = `rgba(212, 165, 116, ${p.opacity})`;
        dustCtx.fill();
      });
      
      requestAnimationFrame(animateDust);
    }

    // ===== Interactions =====
    function setupInteractions() {
      // Mouse/Touch drag for wind
      let lastX = 0;
      let isDragging = false;
      
      const handleStart = (x) => {
        lastX = x;
        isDragging = true;
        state.isInteracting = true;
        instructions.classList.add('hidden');
        startWind();
      };
      
      const handleMove = (x) => {
        if (!isDragging) return;
        const delta = Math.abs(x - lastX);
        if (delta > 10) {
          increaseWind(Math.min(delta / 10, 20));
          lastX = x;
        }
      };
      
      const handleEnd = () => {
        isDragging = false;
        setTimeout(() => {
          if (!isDragging) decreaseWind();
        }, 500);
      };
      
      document.addEventListener('mousedown', (e) => handleStart(e.clientX));
      document.addEventListener('mousemove', (e) => handleMove(e.clientX));
      document.addEventListener('mouseup', handleEnd);
      
      document.addEventListener('touchstart', (e) => handleStart(e.touches[0].clientX));
      document.addEventListener('touchmove', (e) => handleMove(e.touches[0].clientX));
      document.addEventListener('touchend', handleEnd);
      
      // Button clicks
      btnWind.addEventListener('click', () => {
        createGust();
        playWindChime();
      });
      
      btnSound.addEventListener('click', toggleSound);
      btnTimer.addEventListener('click', startTimer);
    }

    function startWind() {
      state.windIntensity = Math.max(state.windIntensity, 10);
      updateWindDisplay();
      showWindIndicator();
    }

    function increaseWind(amount) {
      state.windIntensity = Math.min(100, state.windIntensity + amount);
      updateWindDisplay();
      
      if (Math.random() < CONFIG.leafSpawnChance * (state.windIntensity / 50)) {
        spawnLeaf();
      }
    }

    function decreaseWind() {
      const interval = setInterval(() => {
        state.windIntensity = Math.max(0, state.windIntensity - 5);
        updateWindDisplay();
        
        if (state.windIntensity === 0) {
          clearInterval(interval);
          hideWindIndicator();
        }
      }, 100);
    }

    function createGust() {
      state.windIntensity = 80;
      updateWindDisplay();
      
      // Animate bamboo sway
      document.querySelectorAll('.bamboo-stalk').forEach((stalk, i) => {
        const intensity = 0.5 + Math.random() * 0.5;
        stalk.style.setProperty('--sway-start', (-CONFIG.swayRange * intensity) + 'deg');
        stalk.style.setProperty('--sway-end', (CONFIG.swayRange * intensity) + 'deg');
        stalk.style.setProperty('--sway-duration', (1 + Math.random()) + 's');
      });
      
      // Spawn leaves
      for (let i = 0; i < 5; i++) {
        setTimeout(() => spawnLeaf(), i * 100);
      }
      
      setTimeout(() => {
        decreaseWind();
        resetBambooSway();
      }, 1500);
    }

    function resetBambooSway() {
      document.querySelectorAll('.bamboo-stalk').forEach((stalk, i) => {
        const originalDuration = CONFIG.baseSwayDuration + (i * 0.2) % 2;
        stalk.style.setProperty('--sway-duration', originalDuration + 's');
      });
    }

    function spawnLeaf() {
      const leaf = document.createElement('div');
      leaf.className = 'leaf';
      
      const bambooStalks = document.querySelectorAll('.bamboo-stalk');
      const randomStalk = bambooStalks[Math.floor(Math.random() * bambooStalks.length)];
      const rect = randomStalk.getBoundingClientRect();
      
      leaf.style.left = rect.left + rect.width / 2 + 'px';
      leaf.style.top = rect.top + 50 + 'px';
      leaf.style.setProperty('--dx', (Math.random() - 0.5) * 100 + 'px');
      leaf.style.setProperty('--dy', 150 + Math.random() * 100 + 'px');
      leaf.style.setProperty('--rot', (Math.random() - 0.5) * 720 + 'deg');
      leaf.style.animationDuration = (2 + Math.random() * 2) + 's';
      
      const colors = ['var(--jade-soft)', 'var(--amber)', 'var(--jade-light)'];
      leaf.style.background = colors[Math.floor(Math.random() * colors.length)];
      
      document.body.appendChild(leaf);
      
      state.leafCount++;
      updateLeafCount();
      
      setTimeout(() => leaf.remove(), 4000);
    }

    // ===== Wind Display =====
    function updateWindDisplay() {
      const percent = Math.round(state.windIntensity);
      windValue.textContent = percent;
      windFill.style.width = percent + '%';
      
      // Update bamboo sway intensity
      const swayMultiplier = state.windIntensity / 100;
      document.querySelectorAll('.bamboo-stalk').forEach((stalk, i) => {
        const baseRange = CONFIG.swayRange;
        const newRange = baseRange * (1 + swayMultiplier * 2);
        stalk.style.setProperty('--sway-start', -newRange + 'deg');
        stalk.style.setProperty('--sway-end', newRange + 'deg');
      });
    }

    function showWindIndicator() {
      windIndicator.classList.add('visible');
    }

    function hideWindIndicator() {
      windIndicator.classList.remove('visible');
    }

    // ===== Session Timer =====
    function startSession() {
      state.sessionStart = Date.now();
      setInterval(updateSessionTime, 1000);
    }

    function updateSessionTime() {
      if (!state.sessionStart) return;
      const elapsed = Math.floor((Date.now() - state.sessionStart) / 1000);
      const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
      const seconds = (elapsed % 60).toString().padStart(2, '0');
      sessionTime.textContent = `${minutes}:${seconds}`;
    }

    function startTimer() {
      if (state.timerRunning) return;
      
      state.timerRunning = true;
      btnTimer.classList.add('active');
      btnTimer.textContent = '⏱️ 禪坐中...';
      
      let remaining = 5 * 60;
      
      const timer = setInterval(() => {
        remaining--;
        const minutes = Math.floor(remaining / 60).toString().padStart(2, '0');
        const seconds = (remaining % 60).toString().padStart(2, '0');
        sessionTime.textContent = `${minutes}:${seconds}`;
        
        if (remaining <= 0) {
          clearInterval(timer);
          state.timerRunning = false;
          btnTimer.classList.remove('active');
          btnTimer.textContent = '⏱️ 5分鐘禪坐';
          playCompletionSound();
        }
      }, 1000);
    }

    // ===== Sound =====
    function initAudio() {
      if (state.audioContext) return;
      state.audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }

    function toggleSound() {
      initAudio();
      state.soundEnabled = !state.soundEnabled;
      
      btnSound.classList.toggle('muted', !state.soundEnabled);
      btnSound.classList.toggle('active', state.soundEnabled);
      
      if (state.soundEnabled) {
        startAmbientSound();
      } else {
        stopAmbientSound();
      }
    }

    let ambientOsc = null;
    let ambientGain = null;

    function startAmbientSound() {
      if (!state.audioContext || ambientOsc) return;
      
      // Create ambient wind sound using filtered noise
      const bufferSize = 2 * state.audioContext.sampleRate;
      const noiseBuffer = state.audioContext.createBuffer(1, bufferSize, state.audioContext.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }
      
      const whiteNoise = state.audioContext.createBufferSource();
      whiteNoise.buffer = noiseBuffer;
      whiteNoise.loop = true;
      
      const filter = state.audioContext.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 400;
      
      ambientGain = state.audioContext.createGain();
      ambientGain.gain.value = 0.05;
      
      whiteNoise.connect(filter);
      filter.connect(ambientGain);
      ambientGain.connect(state.audioContext.destination);
      
      whiteNoise.start();
      ambientOsc = whiteNoise;
    }

    function stopAmbientSound() {
      if (ambientOsc) {
        ambientOsc.stop();
        ambientOsc = null;
      }
    }

    function playWindChime() {
      if (!state.soundEnabled) return;
      initAudio();
      
      const notes = [261.63, 329.63, 392.00, 523.25]; // C4, E4, G4, C5
      
      notes.forEach((freq, i) => {
        setTimeout(() => {
          const osc = state.audioContext.createOscillator();
          const gain = state.audioContext.createGain();
          
          osc.type = 'sine';
          osc.frequency.value = freq;
          
          gain.gain.setValueAtTime(0, state.audioContext.currentTime);
          gain.gain.linearRampToValueAtTime(0.1, state.audioContext.currentTime + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, state.audioContext.currentTime + 2);
          
          osc.connect(gain);
          gain.connect(state.audioContext.destination);
          
          osc.start();
          osc.stop(state.audioContext.currentTime + 2);
        }, i * 150);
      });
    }

    function playCompletionSound() {
      initAudio();
      
      const freq = 432; // 432Hz
      const osc = state.audioContext.createOscillator();
      const gain = state.audioContext.createGain();
      
      osc.type = 'sine';
      osc.frequency.value = freq;
      
      gain.gain.setValueAtTime(0, state.audioContext.currentTime);
      gain.gain.linearRampToValueAtTime(0.2, state.audioContext.currentTime + 0.5);
      gain.gain.exponentialRampToValueAtTime(0.001, state.audioContext.currentTime + 4);
      
      osc.connect(gain);
      gain.connect(state.audioContext.destination);
      
      osc.start();
      osc.stop(state.audioContext.currentTime + 4);
    }

    // ===== Leaf Count =====
    function updateLeafCount() {
      leafCountEl.textContent = state.leafCount;
      localStorage.setItem('bambooSway_leaves', state.leafCount.toString());
    }

    // Start
    init();
  </script>
</body>
