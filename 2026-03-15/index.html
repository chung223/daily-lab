<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>數位流星雨 ✨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #000000;
      --matrix-green: #00ff41;
      --matrix-bright: #0f0;
      --matrix-dark: #003300;
      --cyber-cyan: #00fff5;
      --glow-green: rgba(0, 255, 65, 0.8);
      --glow-cyan: rgba(0, 255, 245, 0.6);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'JetBrains Mono', 'Noto Sans TC', monospace;
      background: var(--bg-deep);
      min-height: 100vh;
      color: var(--matrix-green);
      overflow: hidden;
      position: relative;
    }

    /* Matrix rain canvas */
    #matrixCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Scanlines overlay */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.15) 0px,
        rgba(0, 0, 0, 0.15) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 100;
    }

    /* CRT flicker */
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.3) 100%);
      pointer-events: none;
      z-index: 101;
    }

    .container {
      position: relative;
      z-index: 10;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      text-align: center;
      padding: 20px 0;
    }

    h1 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--matrix-green);
      text-shadow: 
        0 0 10px var(--glow-green),
        0 0 20px var(--glow-green),
        0 0 40px var(--matrix-dark);
      letter-spacing: 4px;
      animation: flicker 3s infinite;
    }

    @keyframes flicker {
      0%, 100% { opacity: 1; }
      92% { opacity: 1; }
      93% { opacity: 0.8; }
      94% { opacity: 1; }
      96% { opacity: 0.9; }
      97% { opacity: 1; }
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--cyber-cyan);
      margin-top: 8px;
      text-shadow: 0 0 10px var(--glow-cyan);
      opacity: 0.8;
    }

    /* Stats display */
    .stats {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 15px;
      font-size: 0.8rem;
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .stat-icon {
      font-size: 1rem;
    }

    .stat-value {
      color: #fff;
      text-shadow: 0 0 5px var(--matrix-green);
    }

    /* Input area */
    .input-area {
      margin-top: auto;
      padding-bottom: 30px;
    }

    .input-wrapper {
      position: relative;
      background: rgba(0, 20, 0, 0.7);
      border: 2px solid var(--matrix-green);
      border-radius: 8px;
      padding: 5px;
      box-shadow: 
        0 0 15px rgba(0, 255, 65, 0.3),
        inset 0 0 20px rgba(0, 255, 65, 0.1);
    }

    .input-prefix {
      color: var(--cyber-cyan);
      padding: 10px 5px 10px 15px;
      font-size: 1rem;
      text-shadow: 0 0 8px var(--glow-cyan);
    }

    #textInput {
      width: calc(100% - 50px);
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: 'JetBrains Mono', 'Noto Sans TC', monospace;
      font-size: 1.1rem;
      padding: 10px 10px 10px 5px;
      caret-color: var(--cyber-cyan);
    }

    #textInput::placeholder {
      color: var(--matrix-dark);
    }

    /* Action buttons */
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .btn {
      flex: 1;
      padding: 12px 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      font-weight: 700;
      border: 2px solid var(--matrix-green);
      border-radius: 6px;
      background: rgba(0, 255, 65, 0.1);
      color: var(--matrix-green);
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .btn:hover {
      background: var(--matrix-green);
      color: var(--bg-deep);
      box-shadow: 0 0 20px var(--glow-green);
    }

    .btn.secondary {
      border-color: var(--cyber-cyan);
      color: var(--cyber-cyan);
      background: rgba(0, 255, 245, 0.1);
    }

    .btn.secondary:hover {
      background: var(--cyber-cyan);
      color: var(--bg-deep);
      box-shadow: 0 0 20px var(--glow-cyan);
    }

    /* Instruction hint */
    .hint {
      text-align: center;
      margin-top: 20px;
      font-size: 0.75rem;
      color: var(--matrix-dark);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* Floating particles container */
    #particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    /* Mobile adjustments */
    @media (max-width: 480px) {
      h1 {
        font-size: 1.4rem;
        letter-spacing: 2px;
      }

      .subtitle {
        font-size: 0.75rem;
      }

      #textInput {
        font-size: 1rem;
      }

      .btn {
        padding: 10px 15px;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <canvas id="matrixCanvas"></canvas>
  
  <div class="container">
    <header>
      <h1>數位流星雨</h1>
      <p class="subtitle">DIGITAL METEOR SHOWER</p>
      <div class="stats">
        <div class="stat">
          <span class="stat-icon">✨</span>
          <span class="stat-value" id="charCount">0</span>
          <span>字</span>
        </div>
        <div class="stat">
          <span class="stat-icon">💾</span>
          <span class="stat-value" id="savedCount">0</span>
          <span>已轉化</span>
        </div>
      </div>
    </header>

    <div class="input-area">
      <div class="input-wrapper">
        <span class="input-prefix">›</span>
        <input type="text" id="textInput" placeholder="輸入文字..." maxlength="50" autocomplete="off">
      </div>
      <div class="actions">
        <button class="btn" id="transformBtn">轉化</button>
        <button class="btn secondary" id="clearBtn">清除</button>
      </div>
      <p class="hint">← 輸入文字後按下轉化，或按 Enter</p>
    </div>
  </div>

  <div id="particles"></div>

  <script>
    // Matrix Rain Effect
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');

    let width = window.innerWidth;
    let height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    // Characters for matrix rain - mix of symbols
    const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz@#$%^&*(){}[]<>?/\\|~`';
    const chineseChars = '天地玄黃宇宙洪荒日月盈仄寒來暑往秋收冬藏雲騰致雨露結為霜金生麗水玉出昆岡劍號巨闕珠稱夜光';
    
    // User input characters pool
    let userChars = [];
    
    // Matrix columns
    const fontSize = 14;
    const columns = Math.floor(width / fontSize);
    const drops = [];
    
    // Initialize drops
    for (let i = 0; i < columns; i++) {
      drops[i] = Math.random() * -100;
    }

    // Glow effect
    function drawGlow() {
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#00ff41';
    }

    // Matrix rain animation
    function drawMatrix() {
      // Semi-transparent black to create trail effect
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, width, height);
      
      ctx.font = fontSize + 'px JetBrains Mono';
      drawGlow();
      
      for (let i = 0; i < drops.length; i++) {
        // Mix of random chars and user chars
        let char;
        if (userChars.length > 0 && Math.random() < 0.3) {
          char = userChars[Math.floor(Math.random() * userChars.length)];
        } else if (Math.random() < 0.1) {
          char = chineseChars[Math.floor(Math.random() * chineseChars.length)];
        } else {
          char = chars[Math.floor(Math.random() * chars.length)];
        }
        
        // Color gradient based on position
        const x = i * fontSize;
        const y = drops[i] * fontSize;
        
        // Bright green for leading character
        if (drops[i] < 10) {
          ctx.fillStyle = '#fff';
          ctx.shadowColor = '#00fff5';
        } else if (drops[i] < 15) {
          ctx.fillStyle = '#00ff41';
        } else {
          // Fade to darker green
          const alpha = Math.max(0.2, 1 - (drops[i] - 15) / 30);
          ctx.fillStyle = `rgba(0, 255, 65, ${alpha})`;
        }
        
        ctx.fillText(char, x, y);
        
        // Move drop down
        if (y > height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
      
      requestAnimationFrame(drawMatrix);
    }

    // Start matrix rain
    drawMatrix();

    // Handle window resize
    window.addEventListener('resize', () => {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
      
      const newColumns = Math.floor(width / fontSize);
      if (newColumns > drops.length) {
        for (let i = drops.length; i < newColumns; i++) {
          drops[i] = Math.random() * -100;
        }
      }
    });

    // User input handling
    const textInput = document.getElementById('textInput');
    const transformBtn = document.getElementById('transformBtn');
    const clearBtn = document.getElementById('clearBtn');
    const charCountEl = document.getElementById('charCount');
    const savedCountEl = document.getElementById('savedCount');

    // Load stats from localStorage
    let totalChars = parseInt(localStorage.getItem('digitalMeteor_totalChars') || '0');
    let savedCount = parseInt(localStorage.getItem('digitalMeteor_savedCount') || '0');
    charCountEl.textContent = totalChars;
    savedCountEl.textContent = savedCount;

    // Add user characters to the pool
    function addUserChars(text) {
      if (!text.trim()) return;
      
      const newChars = text.split('').filter(c => c.trim());
      userChars = [...userChars, ...newChars];
      
      // Keep pool manageable
      if (userChars.length > 100) {
        userChars = userChars.slice(-100);
      }
      
      // Update stats
      totalChars += newChars.length;
      savedCount++;
      charCountEl.textContent = totalChars;
      savedCountEl.textContent = savedCount;
      
      // Save to localStorage
      localStorage.setItem('digitalMeteor_totalChars', totalChars.toString());
      localStorage.setItem('digitalMeteor_savedCount', savedCount.toString());
      
      // Flash effect on canvas
      flashScreen();
    }

    // Flash effect when user submits
    function flashScreen() {
      const flash = document.createElement('div');
      flash.style.cssText = `
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 255, 65, 0.3);
        z-index: 50;
        pointer-events: none;
        animation: flashFade 0.5s ease-out forwards;
      `;
      document.body.appendChild(flash);
      
      setTimeout(() => flash.remove(), 500);
    }

    // Add CSS for flash animation
    const style = document.createElement('style');
    style.textContent = `
      @keyframes flashFade {
        from { opacity: 1; }
        to { opacity: 0; }
      }
    `;
    document.head.appendChild(style);

    // Event listeners
    transformBtn.addEventListener('click', () => {
      addUserChars(textInput.value);
      textInput.value = '';
      textInput.focus();
    });

    textInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        addUserChars(textInput.value);
        textInput.value = '';
      }
    });

    clearBtn.addEventListener('click', () => {
      userChars = [];
      textInput.value = '';
      textInput.focus();
    });

    // Click anywhere to create particle burst
    document.addEventListener('click', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
      createParticleBurst(e.clientX, e.clientY);
    });

    function createParticleBurst(x, y) {
      const particleCount = 15;
      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.style.cssText = `
          position: fixed;
          left: ${x}px;
          top: ${y}px;
          width: 4px;
          height: 4px;
          background: #00ff41;
          border-radius: 50%;
          pointer-events: none;
          z-index: 50;
          box-shadow: 0 0 6px #00ff41;
        `;
        document.body.appendChild(particle);
        
        const angle = (Math.PI * 2 * i) / particleCount;
        const velocity = 2 + Math.random() * 3;
        const vx = Math.cos(angle) * velocity;
        const vy = Math.sin(angle) * velocity;
        
        let px = x, py = y;
        let opacity = 1;
        
        const animate = () => {
          px += vx;
          py += vy + 1; // gravity
          opacity -= 0.03;
          
          particle.style.left = px + 'px';
          particle.style.top = py + 'px';
          particle.style.opacity = opacity;
          
          if (opacity > 0) {
            requestAnimationFrame(animate);
          } else {
            particle.remove();
          }
        };
        
        requestAnimationFrame(animate);
      }
    }
  </script>
</body>
</html>
