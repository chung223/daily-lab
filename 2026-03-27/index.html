<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>命運之弦 | String of Fate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #050508;
      font-family: 'DM Mono', monospace;
      overflow: hidden;
      position: relative;
    }

    /* Multi-layer cosmic background */
    .cosmic-bg {
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse at 20% 80%, rgba(120, 80, 180, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(80, 120, 200, 0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(60, 40, 100, 0.08) 0%, transparent 70%),
        #050508;
    }

    /* Star field */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #fff;
      border-radius: 50%;
      animation: twinkle var(--duration) ease-in-out infinite;
      opacity: 0;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.5); }
    }

    /* Nebula drift */
    .nebula {
      position: fixed;
      inset: 0;
      opacity: 0.4;
      pointer-events: none;
      animation: nebulaDrift 60s ease-in-out infinite;
    }

    .nebula::before,
    .nebula::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
    }

    .nebula::before {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(138, 43, 226, 0.3) 0%, transparent 70%);
      top: 10%;
      left: 20%;
      animation: float1 20s ease-in-out infinite;
    }

    .nebula::after {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(0, 191, 255, 0.25) 0%, transparent 70%);
      bottom: 20%;
      right: 15%;
      animation: float2 25s ease-in-out infinite;
    }

    @keyframes nebulaDrift {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(30px, -20px) rotate(5deg); }
    }

    @keyframes float1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(50px, 30px) scale(1.2); }
    }

    @keyframes float2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-40px, -20px) scale(1.1); }
    }

    /* Noise overlay */
    .noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    }

    /* Canvas for strings */
    #stringCanvas {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    /* Input panel */
    .input-panel {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .input-wrapper {
      position: relative;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      backdrop-filter: blur(20px);
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .input-wrapper:focus-within {
      border-color: rgba(138, 43, 226, 0.5);
      box-shadow: 0 0 30px rgba(138, 43, 226, 0.2);
    }

    .input-wrapper input {
      background: transparent;
      border: none;
      padding: 16px 24px;
      font-family: 'Noto Serif TC', serif;
      font-size: 16px;
      color: #e0e0e0;
      width: 320px;
      outline: none;
    }

    .input-wrapper input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    .add-btn {
      background: linear-gradient(135deg, #8a2be2 0%, #4169e1 100%);
      border: none;
      width: 52px;
      height: 52px;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(138, 43, 226, 0.4);
    }

    .add-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 30px rgba(138, 43, 226, 0.6);
    }

    .add-btn:active {
      transform: scale(0.95);
    }

    .add-btn svg {
      width: 24px;
      height: 24px;
      fill: white;
    }

    /* Stats panel */
    .stats-panel {
      position: fixed;
      top: 30px;
      right: 30px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      backdrop-filter: blur(20px);
      padding: 20px 24px;
      min-width: 180px;
    }

    .stat {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat:last-child {
      border-bottom: none;
    }

    .stat-label {
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stat-value {
      font-family: 'Noto Serif TC', serif;
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, #8a2be2 0%, #00bfff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Title */
    .title {
      position: fixed;
      top: 30px;
      left: 30px;
      z-index: 10;
    }

    .title h1 {
      font-family: 'Noto Serif TC', serif;
      font-size: 24px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.9);
      letter-spacing: 4px;
      margin-bottom: 4px;
    }

    .title p {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 2px;
    }

    /* Instructions */
    .instructions {
      position: fixed;
      bottom: 110px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: rgba(255, 255, 255, 0.3);
      font-size: 12px;
      text-align: center;
      letter-spacing: 1px;
    }

    /* Ripple effect */
    .ripple {
      position: fixed;
      pointer-events: none;
      border-radius: 50%;
      animation: rippleExpand 1s ease-out forwards;
      z-index: 5;
    }

    @keyframes rippleExpand {
      0% {
        width: 0;
        height: 0;
        opacity: 0.8;
        border: 2px solid rgba(138, 43, 226, 0.8);
      }
      100% {
        width: 300px;
        height: 300px;
        opacity: 0;
        border: 2px solid rgba(138, 43, 226, 0);
      }
    }

    /* String info popup */
    .string-info {
      position: fixed;
      z-index: 20;
      background: rgba(10, 10, 20, 0.95);
      border: 1px solid rgba(138, 43, 226, 0.3);
      border-radius: 12px;
      padding: 16px 20px;
      backdrop-filter: blur(20px);
      pointer-events: none;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
      max-width: 280px;
    }

    .string-info.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .string-info h3 {
      font-family: 'Noto Serif TC', serif;
      font-size: 16px;
      color: #fff;
      margin-bottom: 8px;
    }

    .string-info p {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
      line-height: 1.5;
    }

    .string-info .frequency {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 10px;
      background: rgba(138, 43, 226, 0.2);
      border-radius: 20px;
      font-size: 11px;
      color: #8a2be2;
    }

    /* Mobile responsive */
    @media (max-width: 768px) {
      .input-panel {
        flex-direction: column;
        bottom: 20px;
        width: 90%;
      }

      .input-wrapper input {
        width: 100%;
        text-align: center;
      }

      .stats-panel {
        top: auto;
        bottom: 160px;
        right: 50%;
        transform: translateX(50%);
      }

      .title {
        top: 20px;
        left: 20px;
      }

      .title h1 {
        font-size: 18px;
      }

      .instructions {
        bottom: 280px;
      }
    }
  </style>
</head>
<body>
  <div class="cosmic-bg"></div>
  <div class="stars" id="stars"></div>
  <div class="nebula"></div>
  <div class="noise"></div>
  
  <canvas id="stringCanvas"></canvas>

  <div class="title">
    <h1>命運之弦</h1>
    <p>STRING OF FATE</p>
  </div>

  <div class="stats-panel">
    <div class="stat">
      <span class="stat-label">命弦總數</span>
      <span class="stat-value" id="stringCount">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">共鳴次數</span>
      <span class="stat-value" id="pluckCount">0</span>
    </div>
  </div>

  <p class="instructions">輸入思緒創建命運之弦 · 點擊畫面或弦線觸發共鳴</p>

  <div class="input-panel">
    <div class="input-wrapper">
      <input type="text" id="thoughtInput" placeholder="輸入你的思緒..." maxlength="30">
    </div>
    <button class="add-btn" id="addBtn">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
    </button>
  </div>

  <div class="string-info" id="stringInfo">
    <h3 id="infoTitle">命運之弦</h3>
    <p id="infoText">思緒的波動在宇宙中迴響</p>
    <span class="frequency" id="infoFreq">頻率: 432 Hz</span>
  </div>

  <script>
    // === Configuration ===
    const CONFIG = {
      colors: ['#8a2be2', '#00bfff', '#ff6b9d', '#ffd700', '#34d399', '#a855f7', '#f472b6', '#60a5fa'],
      maxStrings: 12,
      stringWidth: 2,
      waveSpeed: 0.02,
      waveAmplitude: 20,
      decayRate: 0.98
    };

    // === State ===
    let strings = [];
    let pluckedStrings = [];
    let stats = loadStats();

    // === Canvas setup ===
    const canvas = document.getElementById('stringCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // === Generate stars ===
    function generateStars() {
      const container = document.getElementById('stars');
      for (let i = 0; i < 100; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.setProperty('--duration', (2 + Math.random() * 3) + 's');
        star.style.animationDelay = Math.random() * 3 + 's';
        container.appendChild(star);
      }
    }
    generateStars();

    // === String class ===
    class String {
      constructor(text, index, total) {
        this.text = text;
        this.id = Date.now() + Math.random();
        
        // Distribute strings evenly across the canvas
        const spacing = height / (total + 1);
        this.y = spacing * (index + 1);
        
        // Horizontal span with some randomness
        const margin = width * 0.1;
        this.x1 = margin + Math.random() * (width * 0.2);
        this.x2 = width - margin - Math.random() * (width * 0.2);
        
        // Visual properties
        this.color = CONFIG.colors[Math.floor(Math.random() * CONFIG.colors.length)];
        this.phase = Math.random() * Math.PI * 2;
        this.time = 0;
        this.frequency = 200 + Math.random() * 400;
        
        // Pluck animation state
        this.amplitude = 0;
        this.isPlucked = false;
        
        // Collision detection bounds
        this.thickness = 8;
      }

      draw(ctx) {
        ctx.beginPath();
        ctx.moveTo(this.x1, this.y);
        
        // Draw wave with amplitude based on pluck state
        const segments = 50;
        for (let i = 0; i <= segments; i++) {
          const t = i / segments;
          const x = this.x1 + (this.x2 - this.x1) * t;
          
          // Wave calculation
          let waveY = 0;
          if (this.isPlucked) {
            const wave1 = Math.sin(t * Math.PI + this.time * 3) * this.amplitude;
            const wave2 = Math.sin(t * Math.PI * 3 + this.time * 2) * this.amplitude * 0.3;
            const wave3 = Math.sin(t * Math.PI * 5 + this.time * 1.5) * this.amplitude * 0.2;
            waveY = wave1 + wave2 + wave3;
            
            // Decay amplitude
            this.amplitude *= CONFIG.decayRate;
            if (this.amplitude < 0.5) {
              this.isPlucked = false;
              this.amplitude = 0;
            }
          } else {
            // Ambient wave
            waveY = Math.sin(t * Math.PI * 2 + this.time + this.phase) * CONFIG.waveAmplitude * 0.3;
          }
          
          ctx.lineTo(x, this.y + waveY);
        }
        
        ctx.strokeStyle = this.color;
        ctx.lineWidth = CONFIG.stringWidth;
        ctx.lineCap = 'round';
        ctx.stroke();
        
        // Glow effect
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 15;
        ctx.stroke();
        ctx.shadowBlur = 0;
        
        // Draw endpoints
        this.drawEndpoint(this.x1, this.y);
        this.drawEndpoint(this.x2, this.y);
      }

      drawEndpoint(x, y) {
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      pluck() {
        this.amplitude = CONFIG.waveAmplitude * 2;
        this.isPlucked = true;
        this.time = 0;
        
        // Create ripple effect
        createRipple(this.x1, this.y, this.color);
        
        // Update stats
        stats.pluckCount++;
        saveStats();
        updateStatsDisplay();
      }

      update() {
        this.time += CONFIG.waveSpeed;
      }

      containsPoint(px, py) {
        // Check if point is near the string line
        const minX = Math.min(this.x1, this.x2) - this.thickness;
        const maxX = Math.max(this.x1, this.x2) + this.thickness;
        const minY = this.y - CONFIG.waveAmplitude - this.thickness;
        const maxY = this.y + CONFIG.waveAmplitude + this.thickness;
        
        return px >= minX && px <= maxX && py >= minY && py <= maxY;
      }
    }

    // === Ripple effect ===
    function createRipple(x, y, color) {
      const ripple = document.createElement('div');
      ripple.className = 'ripple';
      ripple.style.left = x + 'px';
      ripple.style.top = y + 'px';
      ripple.style.borderColor = color;
      document.body.appendChild(ripple);
      
      setTimeout(() => ripple.remove(), 1000);
    }

    // === String info popup ===
    const stringInfo = document.getElementById('stringInfo');
    const infoTitle = document.getElementById('infoTitle');
    const infoText = document.getElementById('infoText');
    const infoFreq = document.getElementById('infoFreq');

    function showStringInfo(string, x, y) {
      infoTitle.textContent = string.text || '命運之弦';
      infoText.textContent = `在宇宙的弦上，這段思緒以 ${string.frequency.toFixed(0)} Hz 的頻率震動，穿越時空與其他命弦產生共鳴。`;
      infoFreq.textContent = `頻率: ${string.frequency.toFixed(0)} Hz`;
      
      stringInfo.style.left = Math.min(x + 20, width - 300) + 'px';
      stringInfo.style.top = Math.min(y + 20, height - 150) + 'px';
      stringInfo.classList.add('visible');
      
      setTimeout(() => stringInfo.classList.remove('visible'), 3000);
    }

    // === Stats management ===
    function loadStats() {
      const saved = localStorage.getItem('stringOfFate_stats');
      if (saved) {
        return JSON.parse(saved);
      }
      return { stringCount: 0, pluckCount: 0 };
    }

    function saveStats() {
      stats.stringCount = strings.length;
      localStorage.setItem('stringOfFate_stats', JSON.stringify(stats));
    }

    function updateStatsDisplay() {
      document.getElementById('stringCount').textContent = strings.length;
      document.getElementById('pluckCount').textContent = stats.pluckCount;
    }

    // === Add string ===
    function addString(text) {
      if (strings.length >= CONFIG.maxStrings) {
        // Remove oldest string
        strings.shift();
      }
      
      const string = new String(text, strings.length, CONFIG.maxStrings);
      strings.push(string);
      
      saveStats();
      updateStatsDisplay();
      
      // Create launch ripple
      createRipple(string.x1, string.y, string.color);
    }

    // === Event listeners ===
    document.getElementById('addBtn').addEventListener('click', () => {
      const input = document.getElementById('thoughtInput');
      const text = input.value.trim();
      
      if (text) {
        addString(text);
        input.value = '';
      }
    });

    document.getElementById('thoughtInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        const text = e.target.value.trim();
        if (text) {
          addString(text);
          e.target.value = '';
        }
      }
    });

    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      // Check if clicked on any string
      let hit = false;
      for (let i = strings.length - 1; i >= 0; i--) {
        if (strings[i].containsPoint(x, y)) {
          strings[i].pluck();
          showStringInfo(strings[i], x, y);
          hit = true;
          break;
        }
      }
      
      // If didn't hit a string, create ripple
      if (!hit) {
        createRipple(x, y, CONFIG.colors[Math.floor(Math.random() * CONFIG.colors.length)]);
      }
    });

    // === Animation loop ===
    function animate() {
      ctx.clearRect(0, 0, width, height);
      
      strings.forEach(string => {
        string.update();
        string.draw(ctx);
      });
      
      requestAnimationFrame(animate);
    }

    // === Initialize ===
    updateStatsDisplay();
    animate();

    // Add some initial strings for demo
    const initialStrings = ['命運', '共鳴', '時光'];
    initialStrings.forEach(text => addString(text));
  </script>
</body>
</html>
