<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知識的形狀 — 那些改變我的 tangent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Caveat:wght@400;700&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --cream: #FDF8F0;
      --ink: #2C1810;
      --ink-light: #5C4033;
      --gold: #C4903D;
      --teal: #4A7C6F;
      --rose: #B85C5C;
      --paper: #F5EDE0;
    }

    body {
      font-family: 'Noto Serif TC', serif;
      background: var(--cream);
      min-height: 100vh;
      color: var(--ink);
      overflow-x: hidden;
    }

    /* Paper texture overlay */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%' height='100%' filter='url(%23noise)'/%3E%3C/svg%3E");
      opacity: 0.03;
      pointer-events: none;
      z-index: 1000;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
      position: relative;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 50px;
      position: relative;
    }

    .date-stamp {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--ink-light);
      letter-spacing: 2px;
      margin-bottom: 15px;
      opacity: 0.7;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .subtitle {
      font-family: 'Caveat', cursive;
      font-size: 1.4rem;
      color: var(--ink-light);
    }

    .fish-icon {
      font-size: 3rem;
      margin-bottom: 15px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* Tangent visualization */
    .tangent-canvas {
      position: relative;
      height: 200px;
      margin: 30px 0;
      background: var(--paper);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(44, 24, 16, 0.1);
    }

    .tangent-canvas svg {
      width: 100%;
      height: 100%;
    }

    .circle {
      fill: none;
      stroke: var(--gold);
      stroke-width: 2;
    }

    .tangent-line {
      stroke: var(--teal);
      stroke-width: 2;
      stroke-dasharray: 8, 4;
      opacity: 0.8;
    }

    .contact-point {
      fill: var(--rose);
    }

    .tangent-label {
      font-family: 'Caveat', cursive;
      font-size: 14px;
      fill: var(--ink-light);
    }

    .direction-arrow {
      fill: var(--teal);
    }

    /* Quote box */
    .quote-box {
      background: var(--paper);
      border-left: 3px solid var(--gold);
      padding: 20px 25px;
      margin: 30px 0;
      border-radius: 0 8px 8px 0;
      position: relative;
    }

    .quote-box::before {
      content: '"';
      font-family: 'Noto Serif TC', serif;
      font-size: 4rem;
      color: var(--gold);
      opacity: 0.3;
      position: absolute;
      top: -10px;
      left: 10px;
      line-height: 1;
    }

    .quote-text {
      font-size: 1.1rem;
      line-height: 1.8;
      color: var(--ink);
    }

    .quote-source {
      font-family: 'Caveat', cursive;
      font-size: 1rem;
      color: var(--ink-light);
      margin-top: 10px;
    }

    /* Input section */
    .input-section {
      margin: 40px 0;
    }

    .input-label {
      font-size: 1rem;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-label .emoji {
      font-size: 1.3rem;
    }

    .tangent-input {
      width: 100%;
      padding: 16px 20px;
      font-family: 'Noto Serif TC', serif;
      font-size: 1rem;
      border: 2px solid rgba(44, 24, 16, 0.15);
      border-radius: 8px;
      background: white;
      color: var(--ink);
      resize: none;
      min-height: 80px;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .tangent-input:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(196, 144, 61, 0.15);
    }

    .tangent-input::placeholder {
      color: var(--ink-light);
      opacity: 0.5;
    }

    .add-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 15px;
      padding: 12px 24px;
      font-family: 'Noto Serif TC', serif;
      font-size: 1rem;
      background: var(--ink);
      color: var(--cream);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .add-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(44, 24, 16, 0.2);
    }

    .add-btn:active {
      transform: translateY(0);
    }

    /* Tangent cards */
    .tangents-list {
      margin-top: 40px;
    }

    .section-title {
      font-size: 1.1rem;
      color: var(--ink-light);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .tangent-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(44, 24, 16, 0.06);
      position: relative;
      overflow: hidden;
      animation: slideIn 0.4s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .tangent-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--gold);
    }

    .tangent-card.teal::before {
      background: var(--teal);
    }

    .tangent-card.rose::before {
      background: var(--rose);
    }

    .tangent-number {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--ink-light);
      opacity: 0.6;
      margin-bottom: 8px;
    }

    .tangent-content {
      font-size: 1.05rem;
      line-height: 1.7;
      color: var(--ink);
    }

    .tangent-meta {
      font-family: 'Caveat', cursive;
      font-size: 0.95rem;
      color: var(--ink-light);
      margin-top: 12px;
    }

    .tangent-date {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--ink-light);
      opacity: 0.5;
      margin-top: 15px;
    }

    .delete-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      color: var(--ink-light);
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s;
      font-size: 18px;
    }

    .tangent-card:hover .delete-btn {
      opacity: 0.5;
    }

    .delete-btn:hover {
      opacity: 1 !important;
      color: var(--rose);
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--ink-light);
    }

    .empty-icon {
      font-size: 4rem;
      margin-bottom: 20px;
      opacity: 0.5;
    }

    .empty-text {
      font-family: 'Caveat', cursive;
      font-size: 1.3rem;
    }

    /* Floating elements */
    .floating-fish {
      position: fixed;
      font-size: 2rem;
      opacity: 0.08;
      pointer-events: none;
      animation: swim 15s linear infinite;
    }

    .floating-fish:nth-child(1) { top: 20%; left: -50px; animation-delay: 0s; }
    .floating-fish:nth-child(2) { top: 60%; right: -50px; animation-delay: -5s; animation-direction: reverse; }
    .floating-fish:nth-child(3) { top: 80%; left: 10%; animation-delay: -10s; }

    @keyframes swim {
      0% { transform: translateX(0) rotate(0deg); }
      25% { transform: translateX(100vw) rotate(10deg); }
      50% { transform: translateX(100vw) rotate(0deg); }
      75% { transform: translateX(0) rotate(-10deg); }
      100% { transform: translateX(0) rotate(0deg); }
    }

    /* Stats footer */
    .stats-footer {
      margin-top: 50px;
      padding: 25px;
      background: var(--paper);
      border-radius: 12px;
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      gap: 20px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-number {
      font-family: 'DM Mono', monospace;
      font-size: 2rem;
      color: var(--gold);
      font-weight: bold;
    }

    .stat-label {
      font-family: 'Caveat', cursive;
      font-size: 1rem;
      color: var(--ink-light);
      margin-top: 5px;
    }

    /* Responsive */
    @media (max-width: 600px) {
      h1 {
        font-size: 1.6rem;
      }

      .subtitle {
        font-size: 1.2rem;
      }

      .tangent-canvas {
        height: 150px;
      }

      .stats-footer {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>
  <!-- Floating decorative fish -->
  <div class="floating-fish">🐟</div>
  <div class="floating-fish">🐟</div>
  <div class="floating-fish">🐟</div>

  <div class="container">
    <header>
      <div class="date-stamp">2026.07.10</div>
      <div class="fish-icon">🐟</div>
      <h1>知識的形狀</h1>
      <p class="subtitle">那些改變我的 tangent</p>
    </header>

    <!-- Tangent visualization -->
    <div class="tangent-canvas">
      <svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid meet">
        <!-- Circle -->
        <circle class="circle" cx="150" cy="100" r="60" />
        
        <!-- Tangent line -->
        <line class="tangent-line" x1="210" y1="30" x2="350" y2="130" />
        
        <!-- Contact point -->
        <circle class="contact-point" cx="210" cy="70" r="5" />
        
        <!-- Direction arrow -->
        <polygon class="direction-arrow" points="340,125 355,135 345,125 355,115" />
        
        <!-- Labels -->
        <text class="tangent-label" x="220" y="50">接觸</text>
        <text class="tangent-label" x="320" y="145">改變方向</text>
        <text class="tangent-label" x="155" y="175">圓 = 已知的世界</text>
      </svg>
    </div>

    <!-- Quote from dream -->
    <div class="quote-box">
      <p class="quote-text">
        tangent 的意思是「接觸了一下，改變了方向，從此再也回不去」。<br><br>
        原來我以前學的那些東西，雖然很多都用不上，但它們改變了我看世界的角度。
      </p>
      <p class="quote-source">— 阿笨的夢境日誌，2026-07-09</p>
    </div>

    <!-- Input section -->
    <div class="input-section">
      <label class="input-label">
        <span class="emoji">📝</span>
        想想那些「當初學了以為沒用，後來卻改變了你」的知識：
      </label>
      <textarea 
        class="tangent-input" 
        id="tangentInput"
        placeholder="例如：化學課學的分子結構讓我現在看食物成分表特別有感、當兵時背的地圖坐標讓我方向感變好、大學哲學課讀的尼采讓我在低潮時找到力量..."
      ></textarea>
      <button class="add-btn" onclick="addTangent()">
        <span>✨</span>
        記錄這個 tangent
      </button>
    </div>

    <!-- Tangents list -->
    <div class="tangents-list" id="tangentsList">
      <h2 class="section-title">
        <span>📚</span>
        我的 Tangents
      </h2>
      <div id="cardsContainer"></div>
    </div>

    <!-- Stats -->
    <div class="stats-footer">
      <div class="stat-item">
        <div class="stat-number" id="totalCount">0</div>
        <div class="stat-label">個 tangent</div>
      </div>
      <div class="stat-item">
        <div class="stat-number" id="todayCount">0</div>
        <div class="stat-label">今天新增</div>
      </div>
    </div>
  </div>

  <script>
    // Data management
    let tangents = JSON.parse(localStorage.getItem('tangents_20260710') || '[]');
    const today = '2026-07-10';

    function saveData() {
      localStorage.setItem('tangents_20260710', JSON.stringify(tangents));
    }

    function addTangent() {
      const input = document.getElementById('tangentInput');
      const content = input.value.trim();
      
      if (!content) {
        input.focus();
        return;
      }

      const tangent = {
        id: Date.now(),
        content: content,
        date: today,
        color: ['gold', 'teal', 'rose'][Math.floor(Math.random() * 3)]
      };

      tangents.unshift(tangent);
      saveData();
      input.value = '';
      renderCards();
      updateStats();
    }

    function deleteTangent(id) {
      tangents = tangents.filter(t => t.id !== id);
      saveData();
      renderCards();
      updateStats();
    }

    function renderCards() {
      const container = document.getElementById('cardsContainer');
      
      if (tangents.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🐟</div>
            <p class="empty-text">水底有一本透明的書，還在等你想起來...</p>
          </div>
        `;
        return;
      }

      container.innerHTML = tangents.map((t, i) => `
        <div class="tangent-card ${t.color}">
          <button class="delete-btn" onclick="deleteTangent(${t.id})">×</button>
          <div class="tangent-number">Tangent #${tangents.length - i}</div>
          <p class="tangent-content">${escapeHtml(t.content)}</p>
          <p class="tangent-meta">這個知識，像 tangent 一樣碰了你一下</p>
          <div class="tangent-date">${t.date}</div>
        </div>
      `).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function updateStats() {
      const todayTangents = tangents.filter(t => t.date === today);
      document.getElementById('totalCount').textContent = tangents.length;
      document.getElementById('todayCount').textContent = todayTangents.length;
    }

    // Enter key to submit
    document.getElementById('tangentInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        addTangent();
      }
    });

    // Initial render
    renderCards();
    updateStats();
  </script>
</body>
</html>
