<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔮 Oracle 13 - 十三號命運占卜機</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #111;
      --border: #333;
      --accent: #ff3333;
      --text: #ccc;
      --green: #22c55e;
      --yellow: #eab308;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Courier New', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(#333 1px, transparent 1px), linear-gradient(90deg, #333 1px, transparent 1px);
      background-size: 20px 20px;
      opacity: 0.03;
      pointer-events: none;
    }
    main { z-index: 10; width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 2rem; }
    header { border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
    h1 { font-size: 2.5rem; font-weight: bold; letter-spacing: -2px; display: flex; justify-content: space-between; align-items: center; }
    .accent { color: var(--accent); }
    .version { font-size: 0.75rem; opacity: 0.5; letter-spacing: 2px; }
    .subtitle { font-size: 0.7rem; color: #666; text-transform: uppercase; letter-spacing: 3px; margin-top: 4px; }
    #output {
      min-height: 200px;
      border: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }
    #output .waiting { opacity: 0.3; }
    #output .loading { color: var(--accent); }
    #output .result { animation: pop 0.3s ease-out; }
    #output .result.positive { color: var(--green); }
    #output .result.negative { color: var(--accent); }
    #output .result.neutral { color: var(--yellow); }
    #output .result-icon { font-size: 3rem; margin-bottom: 0.5rem; display: block; }
    #output .result-text { font-size: 2rem; font-weight: bold; text-transform: uppercase; }
    @keyframes pop { from { transform: scale(0.8); opacity: 0; filter: blur(10px); } to { transform: scale(1); opacity: 1; filter: blur(0); } }
    @keyframes scan { from { transform: translateY(-100%); } to { transform: translateY(100%); } }
    #output::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.02), transparent);
      animation: scan 2s linear infinite;
    }
    form { display: flex; flex-direction: column; gap: 0.5rem; }
    input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      padding: 1rem;
      font-size: 1.1rem;
      color: var(--text);
      outline: none;
      font-family: inherit;
      text-transform: uppercase;
    }
    input:focus { border-color: var(--accent); }
    input::placeholder { color: #444; }
    button {
      margin-top: 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1rem;
      color: var(--text);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover:not(:disabled) { background: var(--accent); color: #000; border-color: var(--accent); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #history { margin-top: 2rem; border-top: 1px solid var(--border); padding-top: 1rem; }
    #history h3 { font-size: 0.7rem; color: #666; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 1rem; }
    #history ul { max-height: 150px; overflow-y: auto; }
    #history li {
      font-size: 0.8rem;
      padding: 0.5rem 0;
      border-left: 2px solid var(--border);
      padding-left: 0.75rem;
      display: flex;
      justify-content: space-between;
    }
    #history li:hover { border-color: var(--accent); background: var(--surface); }
    #history .q { opacity: 0.6; font-size: 0.7rem; }
    #history .a { font-weight: bold; }
    footer { position: fixed; bottom: 1rem; font-size: 0.6rem; color: #444; text-transform: uppercase; letter-spacing: 2px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1><span class="accent">ORACLE</span><span class="version">v13</span></h1>
      <p class="subtitle">Friday the 13th Edition</p>
    </header>

    <div id="output">
      <div class="waiting">
        <span style="font-size:2rem">🔮</span>
        <p style="font-size:0.7rem;margin-top:0.5rem;letter-spacing:2px">AWAITING INPUT</p>
      </div>
    </div>

    <form id="form">
      <input type="text" id="question" placeholder="ASK THE ORACLE..." autofocus>
      <button type="submit" id="btn">CONSULT</button>
    </form>

    <div id="history" style="display:none">
      <h3>Past Prophecies</h3>
      <ul id="history-list"></ul>
    </div>
  </main>

  <footer>SYSTEM: ONLINE // LATENCY: 13ms</footer>

  <script>
    const ANSWERS = [
      { text: "YES", type: "positive", icon: "✅" },
      { text: "NO", type: "negative", icon: "❌" },
      { text: "MAYBE", type: "neutral", icon: "🤔" },
      { text: "ASK AGAIN", type: "neutral", icon: "🔄" },
      { text: "DOOM IMMINENT", type: "negative", icon: "⚠️" },
      { text: "THE VOID STARES BACK", type: "neutral", icon: "👁️" },
      { text: "UNLIKELY", type: "negative", icon: "❌" },
      { text: "CERTAINLY", type: "positive", icon: "✅" },
      { text: "CHAOS REIGNS", type: "neutral", icon: "🌀" },
      { text: "SILENCE", type: "neutral", icon: "🤫" },
    ];

    const form = document.getElementById('form');
    const input = document.getElementById('question');
    const btn = document.getElementById('btn');
    const output = document.getElementById('output');
    const historyDiv = document.getElementById('history');
    const historyList = document.getElementById('history-list');
    let history = [];

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const q = input.value.trim();
      if (!q) return;

      btn.disabled = true;
      input.disabled = true;
      output.innerHTML = '<div class="loading"><div style="font-size:3rem;font-weight:bold">...</div><p style="font-size:0.7rem;letter-spacing:3px">COMMUNING WITH VOID</p></div>';

      setTimeout(() => {
        const ans = ANSWERS[Math.floor(Math.random() * ANSWERS.length)];
        output.innerHTML = `<div class="result ${ans.type}"><span class="result-icon">${ans.icon}</span><div class="result-text">${ans.text}</div></div>`;
        
        history.unshift({ q, a: ans, t: new Date().toLocaleTimeString() });
        renderHistory();
        
        btn.disabled = false;
        input.disabled = false;
        input.value = '';
        input.focus();
      }, 1500);
    });

    function renderHistory() {
      if (history.length === 0) {
        historyDiv.style.display = 'none';
        return;
      }
      historyDiv.style.display = 'block';
      historyList.innerHTML = history.map(h => `
        <li>
          <div><span class="q">${h.q}</span><br><span class="a ${h.a.type}">${h.a.text}</span></div>
          <span style="opacity:0.3;font-size:0.6rem">${h.t}</span>
        </li>
      `).join('');
    }
  </script>
</body>
</html>
