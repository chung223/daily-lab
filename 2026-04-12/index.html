<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>昭和咖啡屋 — Showa Coffee House</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --cream: #f5f0e6;
            --paper: #faf8f3;
            --brown-dark: #3d2c1f;
            --brown: #6b4423;
            --brown-light: #8b6914;
            --amber: #c4956a;
            --gold: #d4a853;
            --coffee: #2c1810;
            --smoke: #9a8b7a;
        }

        body {
            font-family: 'Noto Serif TC', 'Shippori Mincho', serif;
            background: var(--paper);
            min-height: 100vh;
            color: var(--brown-dark);
            overflow-x: hidden;
        }

        /* Vintage paper texture overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%' height='100%' filter='url(%23noise)'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
            z-index: 1000;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 60px 20px 40px;
            background: linear-gradient(180deg, var(--cream) 0%, transparent 100%);
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--brown-dark);
            letter-spacing: 0.3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0 var(--amber);
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--smoke);
            letter-spacing: 0.5em;
            font-family: 'Shippori Mincho', serif;
        }

        .date-display {
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--amber);
            letter-spacing: 0.2em;
        }

        /* Decorative divider */
        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 30px auto;
            max-width: 300px;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--amber), transparent);
        }

        .divider-icon {
            color: var(--gold);
            font-size: 1.2rem;
        }

        /* Main content */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Ritual Card */
        .ritual-section {
            background: var(--cream);
            border-radius: 4px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 2px 10px rgba(59, 44, 31, 0.1);
            border: 1px solid rgba(139, 105, 20, 0.2);
            position: relative;
        }

        .ritual-section::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 1px solid var(--amber);
            opacity: 0.3;
            pointer-events: none;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--brown-dark);
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: 0.2em;
        }

        /* Ritual Items */
        .ritual-items {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .ritual-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: var(--paper);
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .ritual-item:hover {
            border-color: var(--amber);
            transform: translateX(5px);
        }

        .ritual-item.completed {
            background: linear-gradient(135deg, var(--cream), rgba(196, 149, 106, 0.2));
        }

        .ritual-checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid var(--brown);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .ritual-item.completed .ritual-checkbox {
            background: var(--brown);
            color: var(--cream);
        }

        .ritual-checkbox::after {
            content: '✓';
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .ritual-item.completed .ritual-checkbox::after {
            opacity: 1;
        }

        .ritual-content {
            flex: 1;
        }

        .ritual-name {
            font-size: 1rem;
            font-weight: 600;
            color: var(--brown-dark);
            margin-bottom: 4px;
        }

        .ritual-desc {
            font-size: 0.8rem;
            color: var(--smoke);
            font-family: 'Shippori Mincho', serif;
        }

        .ritual-time {
            font-size: 0.75rem;
            color: var(--amber);
            font-family: 'Shippori Mincho', serif;
            letter-spacing: 0.1em;
        }

        /* Coffee Maker Section */
        .coffee-section {
            background: var(--coffee);
            border-radius: 4px;
            padding: 30px;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }

        .coffee-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at center bottom, rgba(196, 149, 106, 0.3), transparent 70%);
            pointer-events: none;
        }

        .coffee-title {
            font-size: 1.2rem;
            color: var(--cream);
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 0.3em;
        }

        .coffee-maker {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .coffee-pot {
            width: 120px;
            height: 150px;
            position: relative;
        }

        .pot-body {
            width: 100%;
            height: 120px;
            background: linear-gradient(135deg, #d4d4d4, #8a8a8a);
            border-radius: 0 0 20px 20px;
            position: absolute;
            bottom: 0;
            overflow: hidden;
            box-shadow: inset 0 -20px 30px rgba(0,0,0,0.3);
        }

        .coffee-liquid {
            position: absolute;
            bottom: 0;
            left: 5px;
            right: 5px;
            height: 0%;
            background: linear-gradient(180deg, var(--brown-light), var(--brown));
            transition: height 0.5s ease;
            border-radius: 0 0 15px 15px;
        }

        .coffee-liquid.brewing {
            animation: coffeeBubble 0.5s ease-in-out infinite;
        }

        @keyframes coffeeBubble {
            0%, 100% { opacity: 0.9; }
            50% { opacity: 1; }
        }

        .pot-handle {
            width: 30px;
            height: 60px;
            border: 8px solid #888;
            border-left: none;
            border-radius: 0 20px 20px 0;
            position: absolute;
            right: -25px;
            top: 30px;
        }

        .pot-top {
            width: 80%;
            height: 20px;
            background: linear-gradient(135deg, #d4d4d4, #aaa);
            margin: 0 auto;
            border-radius: 5px 5px 0 0;
        }

        .coffee-spout {
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 15px solid #888;
            position: absolute;
            left: 15px;
            top: -15px;
        }

        .brew-btn {
            background: var(--gold);
            color: var(--coffee);
            border: none;
            padding: 12px 30px;
            font-family: 'Noto Serif TC', serif;
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
        }

        .brew-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        .brew-btn:disabled {
            background: var(--smoke);
            cursor: not-allowed;
            transform: none;
        }

        .brew-status {
            color: var(--amber);
            font-size: 0.85rem;
            font-family: 'Shippori Mincho', serif;
            min-height: 24px;
        }

        /* Steam Animation */
        .steam-container {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 50px;
            overflow: visible;
        }

        .steam {
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: steamRise 2s ease-out infinite;
            opacity: 0;
        }

        .steam:nth-child(1) { left: 10px; width: 8px; height: 8px; animation-delay: 0s; }
        .steam:nth-child(2) { left: 25px; width: 10px; height: 10px; animation-delay: 0.4s; }
        .steam:nth-child(3) { left: 40px; width: 6px; height: 6px; animation-delay: 0.8s; }

        .brewing .steam {
            opacity: 1;
        }

        @keyframes steamRise {
            0% { transform: translateY(0) scale(1); opacity: 0.6; }
            100% { transform: translateY(-40px) scale(1.5); opacity: 0; }
        }

        /* Quote Section */
        .quote-section {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(180deg, transparent, var(--cream), transparent);
        }

        .quote {
            font-size: 1.1rem;
            color: var(--brown);
            font-style: italic;
            max-width: 500px;
            margin: 0 auto 10px;
            line-height: 1.8;
            font-family: 'Shippori Mincho', serif;
        }

        .quote-author {
            font-size: 0.8rem;
            color: var(--smoke);
            letter-spacing: 0.2em;
        }

        /* Stats */
        .stats-section {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 30px;
        }

        .stat-card {
            background: var(--cream);
            border-radius: 4px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(139, 105, 20, 0.2);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--brown);
            font-family: 'Shippori Mincho', serif;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--smoke);
            margin-top: 5px;
            letter-spacing: 0.1em;
        }

        /* Reflection Input */
        .reflection-section {
            margin-top: 30px;
        }

        .reflection-input {
            width: 100%;
            min-height: 100px;
            background: var(--paper);
            border: 1px solid var(--amber);
            border-radius: 4px;
            padding: 15px;
            font-family: 'Noto Serif TC', serif;
            font-size: 0.95rem;
            color: var(--brown-dark);
            resize: vertical;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .reflection-input:focus {
            border-color: var(--brown);
        }

        .reflection-input::placeholder {
            color: var(--smoke);
            font-style: italic;
        }

        .save-btn {
            background: var(--brown);
            color: var(--cream);
            border: none;
            padding: 10px 25px;
            font-family: 'Noto Serif TC', serif;
            font-size: 0.85rem;
            letter-spacing: 0.15em;
            cursor: pointer;
            border-radius: 3px;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .save-btn:hover {
            background: var(--brown-dark);
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--smoke);
            font-size: 0.75rem;
            letter-spacing: 0.2em;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .logo { font-size: 1.8rem; }
            .stats-section { grid-template-columns: 1fr; }
            .ritual-item { flex-wrap: wrap; }
            .ritual-time { width: 100%; margin-top: 5px; }
        }

        /* Subtle entrance animation */
        .ritual-section, .coffee-section, .quote-section {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.6s ease forwards;
        }

        .coffee-section { animation-delay: 0.2s; }
        .quote-section { animation-delay: 0.4s; }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Check animation */
        .ritual-item.just-checked .ritual-checkbox {
            animation: checkPop 0.3s ease;
        }

        @keyframes checkPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1 class="logo">昭和咖啡屋</h1>
        <p class="subtitle">S H O W A &nbsp; C O F F E E &nbsp; H O U S E</p>
        <p class="date-display" id="dateDisplay"></p>
    </header>

    <div class="divider">
        <span class="divider-line"></span>
        <span class="divider-icon">☕</span>
        <span class="divider-line"></span>
    </div>

    <main class="container">
        <!-- Morning Ritual Section -->
        <section class="ritual-section">
            <h2 class="section-title">晨間儀式</h2>
            <div class="ritual-items" id="ritualList"></div>
        </section>

        <!-- Coffee Maker Section -->
        <section class="coffee-section">
            <h2 class="coffee-title">☕ 手沖咖啡時光</h2>
            <div class="coffee-maker">
                <div class="coffee-pot">
                    <div class="steam-container">
                        <div class="steam"></div>
                        <div class="steam"></div>
                        <div class="steam"></div>
                    </div>
                    <div class="pot-top">
                        <div class="coffee-spout"></div>
                    </div>
                    <div class="pot-body">
                        <div class="coffee-liquid" id="coffeeLiquid"></div>
                    </div>
                    <div class="pot-handle"></div>
                </div>
                <button class="brew-btn" id="brewBtn">開始沖煮</button>
                <p class="brew-status" id="brewStatus"></p>
            </div>
        </section>

        <!-- Quote Section -->
        <section class="quote-section">
            <p class="quote" id="quote"></p>
            <p class="quote-author" id="quoteAuthor"></p>
        </section>

        <!-- Stats Section -->
        <div class="stats-section">
            <div class="stat-card">
                <div class="stat-number" id="streakCount">0</div>
                <div class="stat-label">連續早晨</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="coffeeCount">0</div>
                <div class="stat-label">咖啡杯數</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="reflectionCount">0</div>
                <div class="stat-label">反思筆記</div>
            </div>
        </div>

        <!-- Reflection Section -->
        <section class="reflection-section">
            <textarea class="reflection-input" id="reflectionInput" placeholder="今天的晨間心情與思緒..."></textarea>
            <button class="save-btn" id="saveReflection">儲存反思</button>
        </section>
    </main>

    <footer class="footer">
        <p>每一杯咖啡都是新的一天</p>
    </footer>

    <script>
        // Data
        const rituals = [
            { id: 1, name: '睜開雙眼，深呼吸', desc: '感受早晨的第一縷光線', time: '7:00' },
            { id: 2, name: '慢慢起身，伸展身體', desc: '喚醒沉睡的肌肉', time: '7:05' },
            { id: 3, name: '為自己沖一杯咖啡', desc: '研磨、注水、等待', time: '7:10' },
            { id: 4, name: '寫下今日三件感恩', desc: '感謝讓生命豐盈', time: '7:20' },
            { id: 5, name: '閱讀幾頁書', desc: '滋養心靈的早晨時光', time: '7:30' }
        ];

        const quotes = [
            { text: '生活就像一杯咖啡，苦中帶甘，總有回甘的時刻。', author: '昭和年代的智慧' },
            { text: '緩慢而堅定地做你能做的事。', author: '日本諺語' },
            { text: '每個早晨都是嶄新的開始，每杯咖啡都是小小的儀式。', author: '咖啡哲學' },
            { text: '在匆忙的世界裡，給自己一杯咖啡的從容。', author: '慢活美學' },
            { text: '簡單的事物最美，一杯好咖啡，一段安靜時光。', author: '昭和咖啡屋' }
        ];

        // Initialize
        function init() {
            displayDate();
            displayRituals();
            displayRandomQuote();
            loadStats();
            setupEventListeners();
        }

        function displayDate() {
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('dateDisplay').textContent = now.toLocaleDateString('zh-TW', options);
        }

        function displayRituals() {
            const container = document.getElementById('ritualList');
            const todayKey = getTodayKey();
            const completedToday = JSON.parse(localStorage.getItem('rituals_completed') || '{}');
            const todayCompleted = completedToday[todayKey] || [];

            container.innerHTML = rituals.map(ritual => `
                <div class="ritual-item ${todayCompleted.includes(ritual.id) ? 'completed' : ''}" data-id="${ritual.id}">
                    <div class="ritual-checkbox"></div>
                    <div class="ritual-content">
                        <div class="ritual-name">${ritual.name}</div>
                        <div class="ritual-desc">${ritual.desc}</div>
                    </div>
                    <div class="ritual-time">${ritual.time}</div>
                </div>
            `).join('');

            // Add click handlers
            container.querySelectorAll('.ritual-item').forEach(item => {
                item.addEventListener('click', () => toggleRitual(item));
            });
        }

        function toggleRitual(item) {
            const id = parseInt(item.dataset.id);
            const todayKey = getTodayKey();
            const completedToday = JSON.parse(localStorage.getItem('rituals_completed') || '{}');
            
            if (!completedToday[todayKey]) completedToday[todayKey] = [];
            
            const idx = completedToday[todayKey].indexOf(id);
            if (idx > -1) {
                completedToday[todayKey].splice(idx, 1);
                item.classList.remove('completed');
            } else {
                completedToday[todayKey].push(id);
                item.classList.add('completed', 'just-checked');
                setTimeout(() => item.classList.remove('just-checked'), 300);
            }
            
            localStorage.setItem('rituals_completed', JSON.stringify(completedToday));
            updateStreak();
        }

        function getTodayKey() {
            const now = new Date();
            return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        }

        function displayRandomQuote() {
            const quote = quotes[Math.floor(Math.random() * quotes.length)];
            document.getElementById('quote').textContent = `「${quote.text}」`;
            document.getElementById('quoteAuthor').textContent = `— ${quote.author}`;
        }

        function loadStats() {
            const stats = JSON.parse(localStorage.getItem('showaStats') || '{"streak":0,"coffee":0,"reflection":0,"lastDate":""}');
            const today = getTodayKey();
            
            // Calculate streak
            if (stats.lastDate !== today) {
                const yesterday = getYesterdayKey();
                if (stats.lastDate !== yesterday) {
                    stats.streak = 0;
                }
                stats.lastDate = today;
                localStorage.setItem('showaStats', JSON.stringify(stats));
            }
            
            document.getElementById('streakCount').textContent = stats.streak;
            document.getElementById('coffeeCount').textContent = stats.coffee;
            document.getElementById('reflectionCount').textContent = stats.reflection;
        }

        function getYesterdayKey() {
            const d = new Date();
            d.setDate(d.getDate() - 1);
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function updateStreak() {
            const todayKey = getTodayKey();
            const completedToday = JSON.parse(localStorage.getItem('rituals_completed') || '{}');
            const todayCompleted = completedToday[todayKey] || [];
            
            if (todayCompleted.length > 0) {
                const stats = JSON.parse(localStorage.getItem('showaStats') || '{"streak":0,"coffee":0,"reflection":0,"lastDate":""}');
                const yesterday = getYesterdayKey();
                
                if (stats.lastDate === yesterday || stats.lastDate === todayKey) {
                    if (stats.lastDate !== todayKey) {
                        stats.streak++;
                    }
                } else {
                    stats.streak = 1;
                }
                
                stats.lastDate = todayKey;
                localStorage.setItem('showaStats', JSON.stringify(stats));
                document.getElementById('streakCount').textContent = stats.streak;
            }
        }

        function setupEventListeners() {
            // Coffee brewing
            const brewBtn = document.getElementById('brewBtn');
            const coffeeLiquid = document.getElementById('coffeeLiquid');
            const brewStatus = document.getElementById('brewStatus');
            
            brewBtn.addEventListener('click', () => {
                if (brewBtn.disabled) return;
                
                brewBtn.disabled = true;
                brewStatus.textContent = '正在沖煮中...';
                coffeeLiquid.classList.add('brewing');
                
                let level = 0;
                const brewInterval = setInterval(() => {
                    level += 2;
                    coffeeLiquid.style.height = level + '%';
                    
                    if (level >= 80) {
                        clearInterval(brewInterval);
                        coffeeLiquid.classList.remove('brewing');
                        brewStatus.textContent = '☕ 咖啡已就緒';
                        brewBtn.textContent = '已完成';
                        
                        // Update coffee count
                        const stats = JSON.parse(localStorage.getItem('showaStats') || '{"streak":0,"coffee":0,"reflection":0,"lastDate":""}');
                        stats.coffee++;
                        localStorage.setItem('showaStats', JSON.stringify(stats));
                        document.getElementById('coffeeCount').textContent = stats.coffee;
                    }
                }, 100);
                
                // Reset after 30 seconds
                setTimeout(() => {
                    coffeeLiquid.style.height = '0%';
                    brewBtn.disabled = false;
                    brewBtn.textContent = '再次沖煮';
                    brewStatus.textContent = '';
                }, 30000);
            });
            
            // Save reflection
            document.getElementById('saveReflection').addEventListener('click', () => {
                const input = document.getElementById('reflectionInput');
                const text = input.value.trim();
                
                if (!text) return;
                
                const todayKey = getTodayKey();
                const reflections = JSON.parse(localStorage.getItem('showaReflections') || '{}');
                
                if (!reflections[todayKey]) reflections[todayKey] = [];
                reflections[todayKey].push({
                    text: text,
                    time: new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' })
                });
                
                localStorage.setItem('showaReflections', JSON.stringify(reflections));
                
                // Update count
                const stats = JSON.parse(localStorage.getItem('showaStats') || '{"streak":0,"coffee":0,"reflection":0,"lastDate":""}');
                stats.reflection++;
                localStorage.setItem('showaStats', JSON.stringify(stats));
                document.getElementById('reflectionCount').textContent = stats.reflection;
                
                input.value = '';
                alert('反思已儲存 🌿');
            });
        }

        // Start
        init();
    </script>
</body>
</html>
