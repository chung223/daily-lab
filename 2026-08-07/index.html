<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VPS 健康監控中心 — 2026-08-07</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=DM+Mono:wght@400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F5F7FA;
      --surface: #FFFFFF;
      --navy: #1B3A5F;
      --navy-light: #2D5A8A;
      --green: #2E7D5A;
      --green-light: #E8F5EE;
      --red: #C62828;
      --red-light: #FFEBEE;
      --amber: #E65100;
      --amber-light: #FFF3E0;
      --text: #1A1A2E;
      --text-muted: #6B7280;
      --border: #E2E8F0;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Header */
    .header {
      background: var(--navy);
      color: white;
      padding: 24px 32px;
      position: relative;
      overflow: hidden;
    }
    .header::after {
      content: '';
      position: absolute;
      right: -40px; top: -40px;
      width: 200px; height: 200px;
      background: rgba(255,255,255,0.05);
      border-radius: 50%;
    }
    .header-top {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 8px;
    }
    .lighthouse-icon {
      width: 48px; height: 48px;
      background: rgba(255,255,255,0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    .header-label {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.7;
    }
    .header-title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }
    .header-sub {
      font-size: 14px;
      opacity: 0.8;
      margin-top: 4px;
    }

    /* Stats Bar */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--border);
      border-bottom: 1px solid var(--border);
    }
    .stat-item {
      background: var(--surface);
      padding: 20px 24px;
      text-align: center;
    }
    .stat-number {
      font-family: 'Space Mono', monospace;
      font-size: 36px;
      font-weight: 700;
      line-height: 1;
    }
    .stat-number.green { color: var(--green); }
    .stat-number.red { color: var(--red); }
    .stat-number.amber { color: var(--amber); }
    .stat-number.navy { color: var(--navy); }
    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 6px;
    }

    /* Main Content */
    .main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* Alert Banner */
    .alert-banner {
      background: var(--red-light);
      border: 2px solid var(--red);
      border-radius: var(--radius);
      padding: 20px 24px;
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      gap: 16px;
      animation: pulse-red 2s ease-in-out infinite;
    }
    @keyframes pulse-red {
      0%, 100% { box-shadow: 0 0 0 0 rgba(198,40,40,0.2); }
      50% { box-shadow: 0 0 0 8px rgba(198,40,40,0); }
    }
    .alert-icon {
      font-size: 32px;
      flex-shrink: 0;
    }
    .alert-content h3 {
      font-size: 16px;
      font-weight: 700;
      color: var(--red);
      margin-bottom: 4px;
    }
    .alert-content p {
      font-size: 13px;
      color: #555;
    }

    /* Section */
    .section-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-muted);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Station Grid */
    .station-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      margin-bottom: 40px;
    }
    .station-card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1.5px solid var(--border);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }
    .station-card:hover {
      border-color: var(--navy-light);
      box-shadow: 0 4px 20px rgba(27,58,95,0.12);
      transform: translateY(-2px);
    }
    .station-card.healthy { border-left: 4px solid var(--green); }
    .station-card.blocked { border-left: 4px solid var(--red); }
    .station-card.restricted { border-left: 4px solid var(--amber); }
    .station-card.docker { border-left: 4px solid var(--navy-light); }

    .card-header {
      padding: 16px 20px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .status-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-dot.healthy { background: var(--green); box-shadow: 0 0 8px rgba(46,125,90,0.4); }
    .status-dot.blocked { background: var(--red); animation: blink 1s ease-in-out infinite; }
    .status-dot.restricted { background: var(--amber); }
    .status-dot.docker { background: var(--navy-light); }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .card-name {
      font-weight: 700;
      font-size: 16px;
    }
    .card-location {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .card-body {
      padding: 0 20px 16px;
    }
    .card-meta {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .meta-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
    }
    .meta-label {
      color: var(--text-muted);
    }
    .meta-value {
      font-family: 'DM Mono', monospace;
      font-weight: 500;
    }
    .meta-value.ok { color: var(--green); }
    .meta-value.warn { color: var(--amber); }
    .meta-value.error { color: var(--red); }

    .card-footer {
      padding: 10px 20px;
      background: #FAFBFC;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
    }

    /* Details Panel */
    .details-panel {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1.5px solid var(--navy);
      padding: 24px;
      margin-bottom: 32px;
      display: none;
    }
    .details-panel.active { display: block; }
    .details-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .details-title {
      font-size: 20px;
      font-weight: 700;
    }
    .details-subtitle {
      font-size: 13px;
      color: var(--text-muted);
    }
    .details-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }
    .detail-item {
      background: var(--bg);
      border-radius: 8px;
      padding: 14px 16px;
    }
    .detail-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .detail-value {
      font-size: 14px;
      font-weight: 600;
    }
    .detail-value.green { color: var(--green); }
    .detail-value.red { color: var(--red); }
    .detail-value.amber { color: var(--amber); }

    /* Legend */
    .legend {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      margin-bottom: 32px;
      padding: 16px 20px;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }
    .legend-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
    }
    .legend-dot.healthy { background: var(--green); }
    .legend-dot.blocked { background: var(--red); }
    .legend-dot.restricted { background: var(--amber); }
    .legend-dot.docker { background: var(--navy-light); }

    /* Confetti */
    .confetti-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1000;
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 24px;
      font-size: 12px;
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .stats-bar { grid-template-columns: repeat(2, 1fr); }
      .header-title { font-size: 22px; }
      .station-grid { grid-template-columns: 1fr; }
      .main { padding: 20px 16px; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="lighthouse-icon">🗼</div>
    <div>
      <div class="header-label">VPS Mission Control</div>
      <div class="header-title">主機健康監控中心</div>
    </div>
  </div>
  <div class="header-sub">2026-08-07 03:30 自動健檢報告 · 12 站全體檢視</div>
</div>

<div class="stats-bar">
  <div class="stat-item">
    <div class="stat-number navy">12</div>
    <div class="stat-label">總站數</div>
  </div>
  <div class="stat-item">
    <div class="stat-number green">10</div>
    <div class="stat-label">健康運行</div>
  </div>
  <div class="stat-item">
    <div class="stat-number red">1</div>
    <div class="stat-label">需要關注</div>
  </div>
  <div class="stat-item">
    <div class="stat-number amber">1</div>
    <div class="stat-label">限制變更</div>
  </div>
</div>

<div class="main">
  <div class="alert-banner" onclick="showDetails('JP1')">
    <div class="alert-icon">🚨</div>
    <div class="alert-content">
      <h3>⚠️ JP1 主機需要人工介入</h3>
      <p>ssh user 無法讀取 /www/server/panel/vhost/nginx/*.conf<br>
      持續時間：2 天 · 需要設定 NOPASSWD sudo 權限</p>
    </div>
  </div>

  <div class="section-title">📡 站台狀態</div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot healthy"></div> 健康運行</div>
    <div class="legend-item"><div class="legend-dot blocked"></div> 需要關注</div>
    <div class="legend-item"><div class="legend-dot restricted"></div> 限制變更</div>
    <div class="legend-item"><div class="legend-dot docker"></div> Docker 站</div>
  </div>

  <div class="station-grid" id="stationGrid"></div>

  <div class="details-panel" id="detailsPanel">
    <div class="details-header">
      <span id="detailsIcon">🗄️</span>
      <div>
        <div class="details-title" id="detailsTitle">站台名稱</div>
        <div class="details-subtitle" id="detailsSubtitle">位置</div>
      </div>
    </div>
    <div class="details-grid" id="detailsGrid"></div>
  </div>
</div>

<div class="footer">
  🗼 VPS Mission Control · OpenClaw Lab Build · 2026-08-07
</div>

<div class="confetti-container" id="confettiContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
  const stations = [
    { id: 'JP1', name: 'JP1', location: '日本 · Tokyo', status: 'blocked', since: '2天', issue: 'sudo 權限', desc: 'HOST-BLOCKED：ssh user 無法讀取 nginx conf，需設定 NOPASSWD sudo' },
    { id: 'JP2', name: 'JP2', location: '日本 · Osaka', status: 'restricted', since: '長期', issue: 'YOULS+Docker', desc: '禁改站（YOULS + Docker），無變更空間' },
    { id: 'US', name: 'US', location: '美國', status: 'restricted', since: '長期', issue: '禁止自動變更', desc: '禁止自動變更，已開提案待核可' },
    { id: 'US1', name: 'US1', location: '美國', status: 'restricted', since: '長期', issue: '禁止自動變更', desc: '禁止自動變更，已開提案待核可' },
    { id: 'USARM', name: 'USARM', location: '美國 ARM', status: 'restricted', since: '長期', issue: '禁止自動變更', desc: '禁止自動變更，已開提案待核可' },
    { id: 'TW1', name: 'TW1', location: '台灣', status: 'healthy', since: '-', issue: '-', desc: '健康運行' },
    { id: 'TW2', name: 'TW2', location: '台灣', status: 'healthy', since: '-', issue: '-', desc: '健康運行' },
    { id: 'TW3', name: 'TW3', location: '台灣', status: 'healthy', since: '-', issue: '-', desc: '健康運行' },
    { id: 'SG1', name: 'SG1', location: '新加坡', status: 'healthy', since: '-', issue: '-', desc: '健康運行' },
    { id: 'EU1', name: 'EU1', location: '歐洲', status: 'healthy', since: '-', issue: '-', desc: '健康運行' },
    { id: 'EU2', name: 'EU2', location: '歐洲', status: 'healthy', since: '-', issue: '-', desc: '健康運行' },
    { id: 'HK1', name: 'HK1', location: '香港', status: 'healthy', since: '-', issue: '-', desc: '健康運行' },
  ];

  const statusLabels = { healthy: '健康運行', blocked: '需要關注', restricted: '限制變更', docker: 'Docker站' };
  const statusIcons = { healthy: '✅', blocked: '🚨', restricted: '🔒', docker: '🐳' };

  function renderStations() {
    const grid = document.getElementById('stationGrid');
    grid.innerHTML = stations.map(s => `
      <div class="station-card ${s.status}" onclick="showDetails('${s.id}')">
        <div class="card-header">
          <div class="status-dot ${s.status}"></div>
          <div>
            <div class="card-name">${s.name}</div>
            <div class="card-location">${s.location}</div>
          </div>
        </div>
        <div class="card-body">
          <div class="card-meta">
            <div class="meta-row">
              <span class="meta-label">狀態</span>
              <span class="meta-value ${s.status === 'healthy' ? 'ok' : s.status === 'blocked' ? 'error' : 'warn'}">${statusLabels[s.status]}</span>
            </div>
            <div class="meta-row">
              <span class="meta-label">問題</span>
              <span class="meta-value ${s.issue === '-' ? '' : s.status === 'blocked' ? 'error' : 'warn'}">${s.issue}</span>
            </div>
            <div class="meta-row">
              <span class="meta-label">持續</span>
              <span class="meta-value">${s.since}</span>
            </div>
          </div>
        </div>
        <div class="card-footer">點擊查看詳情</div>
      </div>
    `).join('');
  }

  function showDetails(id) {
    const s = stations.find(x => x.id === id);
    if (!s) return;

    document.getElementById('detailsIcon').textContent = statusIcons[s.status];
    document.getElementById('detailsTitle').textContent = `${s.name} — ${s.location}`;
    document.getElementById('detailsSubtitle').textContent = `狀態：${statusLabels[s.status]}`;

    const items = [
      { label: '站台ID', value: s.id },
      { label: '位置', value: s.location },
      { label: '狀態', value: statusLabels[s.status], class: s.status === 'healthy' ? 'green' : s.status === 'blocked' ? 'red' : 'amber' },
      { label: '問題描述', value: s.issue === '-' ? '無' : s.issue },
      { label: '持續時間', value: s.since },
      { label: '詳細說明', value: s.desc },
    ];

    document.getElementById('detailsGrid').innerHTML = items.map(item => `
      <div class="detail-item">
        <div class="detail-label">${item.label}</div>
        <div class="detail-value ${item.class || ''}">${item.value}</div>
      </div>
    `).join('');

    document.getElementById('detailsPanel').classList.add('active');
    document.getElementById('detailsPanel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    // Confetti on click
    confetti({
      particleCount: 60,
      spread: 50,
      origin: { y: 0.7 },
      colors: ['#1B3A5F', '#2E7D5A', '#C62828', '#E65100']
    });
  }

  renderStations();
</script>
</body>
</html>
