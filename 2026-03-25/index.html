<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question Flow — 問題之流</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #050508;
      --bg-surface: #0a0a12;
      --text-primary: #f0f4ff;
      --text-muted: #6b7280;
      --accent-cyan: #00f5ff;
      --accent-purple: #a855f7;
      --accent-gold: #fbbf24;
      --accent-pink: #ff6b9d;
      --accent-emerald: #34d399;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Serif TC', serif;
      background: var(--bg-deep);
      color: var(--text-primary);
      min-height: 100vh;
      overflow: hidden;
    }

    /* Background layers */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .stars {
      background-image: 
        radial-gradient(1px 1px at 20px 30px, rgba(255,255,255,0.3), transparent),
        radial-gradient(1px 1px at 40px 70px, rgba(255,255,255,0.2), transparent),
        radial-gradient(1px 1px at 50px 160px, rgba(255,255,255,0.3), transparent),
        radial-gradient(1px 1px at 90px 40px, rgba(255,255,255,0.2), transparent),
        radial-gradient(1px 1px at 130px 80px, rgba(255,255,255,0.3), transparent),
        radial-gradient(2px 2px at 160px 120px, rgba(0,245,255,0.4), transparent),
        radial-gradient(1px 1px at 200px 50px, rgba(255,255,255,0.2), transparent),
        radial-gradient(1px 1px at 250px 90px, rgba(255,255,255,0.3), transparent),
        radial-gradient(2px 2px at 300px 140px, rgba(168,85,247,0.3), transparent);
      background-size: 350px 200px;
      animation: twinkle 8s ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    .nebula {
      background: 
        radial-gradient(ellipse at 20% 80%, rgba(168,85,247,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(0,245,255,0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(255,107,157,0.04) 0%, transparent 60%);
      animation: nebulaDrift 20s ease-in-out infinite alternate;
    }

    @keyframes nebulaDrift {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-20px, 20px) scale(1.05); }
    }

    .noise {
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%' height='100%' filter='url(%23noise)'/%3E%3C/svg%3E");
    }

    /* Canvas for flowing questions */
    #flow-canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    /* Main UI */
    .container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .title {
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 700;
      text-align: center;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .input-wrapper {
      position: relative;
      width: 100%;
      max-width: 500px;
    }

    .input-field {
      width: 100%;
      padding: 1.25rem 1.5rem;
      font-family: 'Noto Serif TC', serif;
      font-size: 1.1rem;
      background: rgba(10, 10, 18, 0.8);
      border: 1px solid rgba(0, 245, 255, 0.2);
      border-radius: 16px;
      color: var(--text-primary);
      outline: none;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .input-field::placeholder {
      color: var(--text-muted);
    }

    .input-field:focus {
      border-color: var(--accent-cyan);
      box-shadow: 
        0 0 20px rgba(0, 245, 255, 0.15),
        0 0 40px rgba(0, 245, 255, 0.05);
    }

    .hint {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 1rem;
      opacity: 0.7;
    }

    /* Stats bar */
    .stats {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 2rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      color: var(--text-muted);
      z-index: 20;
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .stat-value {
      color: var(--accent-cyan);
      font-weight: 400;
    }

    .stat-icon {
      width: 16px;
      height: 16px;
      opacity: 0.7;
    }

    /* Quote */
    .quote {
      position: fixed;
      top: 2rem;
      left: 50%;
      transform: translateX(-50%);
      max-width: 600px;
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-muted);
      opacity: 0;
      transition: opacity 1s ease;
      z-index: 20;
    }

    .quote.visible {
      opacity: 1;
    }

    .quote-author {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: var(--accent-purple);
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="bg-layer stars"></div>
  <div class="bg-layer nebula"></div>
  <div class="bg-layer noise"></div>
  <canvas id="flow-canvas"></canvas>

  <div class="quote" id="quote">
    <span id="quote-text"></span>
    <div class="quote-author">— Harari</div>
  </div>

  <div class="container">
    <h1 class="title">問題之流</h1>
    <p class="subtitle">Question Flow — Clarity Through Inquiry</p>
    
    <div class="input-wrapper">
      <input 
        type="text" 
        class="input-field" 
        id="question-input" 
        placeholder="輸入你的問題..."
        autocomplete="off"
      >
    </div>
    <p class="hint">按下 Enter 讓問題流入意識之河</p>
  </div>

  <div class="stats">
    <div class="stat">
      <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 6v6l4 2"/>
      </svg>
      <span>問題:</span>
      <span class="stat-value" id="count">0</span>
    </div>
    <div class="stat">
      <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
      <span>澄清:</span>
      <span class="stat-value" id="clarity">0</span>
    </div>
  </div>

  <script>
    // Canvas setup
    const canvas = document.getElementById('flow-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let width, height;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // Local storage
    const stats = JSON.parse(localStorage.getItem('questionflow') || '{"count":0,"clarity":0}');
    document.getElementById('count').textContent = stats.count;
    document.getElementById('clarity').textContent = stats.clarity;

    // Quotes
    const quotes = [
      "95%的力氣用來解題，只有5%用來選題，結果解決了錯誤的問題。",
      "心智是幻想工廠，連專注呼吸5秒都做不到。",
      "資訊 ≠ 真相，真相昂貴且罕見。",
      "Clarity is power — 清晰就是力量。",
      "如果連呼吸都觀察不了，如何理解AI或中東問題？"
    ];

    // Particle class
    class FlowParticle {
      constructor(text, x, y) {
        this.text = text;
        this.x = x;
        this.y = y;
        this.targetY = height * 0.6 + Math.random() * height * 0.3;
        this.vx = (Math.random() - 0.5) * 2;
        this.vy = 0;
        this.alpha = 0;
        this.targetAlpha = 1;
        this.size = 14 + Math.random() * 6;
        this.rotation = 0;
        this.rotationSpeed = (Math.random() - 0.5) * 0.02;
        this.life = 1;
        this.phase = 'falling'; // falling, floating, dissolving
        this.color = this.getColor();
        this.wobble = Math.random() * Math.PI * 2;
        this.wobbleSpeed = 0.02 + Math.random() * 0.02;
      }

      getColor() {
        const colors = [
          { r: 0, g: 245, b: 255 },    // cyan
          { r: 168, g: 85, b: 247 },  // purple
          { r: 251, g: 191, b: 36 },  // gold
          { r: 255, g: 107, b: 157 }, // pink
          { r: 52, g: 211, b: 153 }   // emerald
        ];
        return colors[Math.floor(Math.random() * colors.length)];
      }

      update() {
        this.wobble += this.wobbleSpeed;

        if (this.phase === 'falling') {
          this.vy += 0.3;
          this.y += this.vy;
          this.x += this.vx;
          this.alpha = Math.min(1, this.alpha + 0.05);
          
          if (this.y >= this.targetY) {
            this.phase = 'floating';
            this.vy = 0;
          }
        } else if (this.phase === 'floating') {
          this.x += Math.sin(this.wobble) * 0.5;
          this.y += Math.cos(this.wobble * 0.7) * 0.3;
          this.rotation += this.rotationSpeed;
          this.life -= 0.002;
          
          if (this.life <= 0.3) {
            this.phase = 'dissolving';
          }
        } else if (this.phase === 'dissolving') {
          this.alpha -= 0.02;
          this.y -= 0.5;
          this.x += Math.sin(this.wobble) * 0.3;
        }
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha * this.life;
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        // Glow
        ctx.shadowColor = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, 0.5)`;
        ctx.shadowBlur = 20;

        // Text
        ctx.font = `${this.size}px 'Noto Serif TC', serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = `rgb(${this.color.r}, ${this.color.g}, ${this.color.b})`;
        ctx.fillText(this.text, 0, 0);

        ctx.restore();
      }
    }

    // Ripple effect
    class Ripple {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 0;
        this.maxRadius = 100;
        this.alpha = 0.5;
        this.color = { r: 0, g: 245, b: 255 };
      }

      update() {
        this.radius += 3;
        this.alpha -= 0.01;
      }

      draw() {
        if (this.alpha <= 0) return;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${this.alpha})`;
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }

    let ripples = [];

    // Input handling
    const input = document.getElementById('question-input');
    const quoteEl = document.getElementById('quote');
    const quoteText = document.getElementById('quote-text');

    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && input.value.trim()) {
        const text = input.value.trim();
        
        // Create particles
        const words = text.split('');
        const centerX = width / 2;
        const startY = height * 0.3;
        
        words.forEach((char, i) => {
          setTimeout(() => {
            const offsetX = (Math.random() - 0.5) * 100;
            const p = new FlowParticle(char, centerX + offsetX, startY);
            particles.push(p);
          }, i * 30);
        });

        // Create ripple
        ripples.push(new Ripple(centerX, height * 0.5));

        // Update stats
        stats.count++;
        stats.clarity++;
        localStorage.setItem('questionflow', JSON.stringify(stats));
        document.getElementById('count').textContent = stats.count;
        document.getElementById('clarity').textContent = stats.clarity;

        // Show quote every 5 questions
        if (stats.count % 5 === 0) {
          const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
          quoteText.textContent = randomQuote;
          quoteEl.classList.add('visible');
          setTimeout(() => quoteEl.classList.remove('visible'), 5000);
        }

        input.value = '';
      }
    });

    // Canvas click ripple
    canvas.addEventListener('click', (e) => {
      ripples.push(new Ripple(e.clientX, e.clientY));
    });

    // Animation loop
    function animate() {
      ctx.clearRect(0, 0, width, height);

      // Draw ripples
      ripples = ripples.filter(r => r.alpha > 0);
      ripples.forEach(r => {
        r.update();
        r.draw();
      });

      // Draw particles
      particles = particles.filter(p => p.alpha > 0);
      particles.forEach(p => {
        p.update();
        p.draw();
      });

      requestAnimationFrame(animate);
    }
    animate();

    // Initial quote
    setTimeout(() => {
      quoteText.textContent = quotes[0];
      quoteEl.classList.add('visible');
      setTimeout(() => quoteEl.classList.remove('visible'), 4000);
    }, 1000);
  </script>
</body>
</html>
