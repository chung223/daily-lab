<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>思維花園 | Thought Garden</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #faf7f2;
            --cream-dark: #f0ebe3;
            --sage: #8fae8b;
            --sage-light: #b8d4ae;
            --sage-dark: #5d7a54;
            --terracotta: #c4785a;
            --terracotta-light: #e8a88a;
            --gold: #d4a853;
            --gold-light: #f0d9a0;
            --brown: #6b5344;
            --brown-light: #8a7366;
            --paper: #fffef9;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: var(--cream);
            min-height: 100vh;
            color: var(--brown);
            overflow-x: hidden;
        }
        
        /* Paper texture overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%' height='100%' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1000;
        }
        
        /* Header */
        .header {
            text-align: center;
            padding: 2.5rem 1rem 1.5rem;
            background: linear-gradient(180deg, var(--cream-dark) 0%, var(--cream) 100%);
        }
        
        .header h1 {
            font-family: 'Caveat', cursive;
            font-size: 3rem;
            color: var(--sage-dark);
            margin-bottom: 0.25rem;
            letter-spacing: 2px;
        }
        
        .header p {
            font-size: 0.9rem;
            color: var(--brown-light);
            font-weight: 300;
        }
        
        /* Stats bar */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 2rem;
            padding: 1rem;
            flex-wrap: wrap;
        }
        
        .stat {
            text-align: center;
            padding: 0.75rem 1.5rem;
            background: var(--paper);
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(107, 83, 68, 0.08);
            border: 1px solid var(--cream-dark);
        }
        
        .stat-value {
            font-family: 'DM Mono', monospace;
            font-size: 1.75rem;
            color: var(--sage-dark);
            font-weight: 500;
        }
        
        .stat-label {
            font-size: 0.75rem;
            color: var(--brown-light);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* Input Section */
        .input-section {
            max-width: 600px;
            margin: 1.5rem auto;
            padding: 0 1rem;
        }
        
        .input-card {
            background: var(--paper);
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 4px 20px rgba(107, 83, 68, 0.1);
            border: 2px solid var(--sage-light);
        }
        
        .input-card h2 {
            font-family: 'Caveat', cursive;
            font-size: 1.5rem;
            color: var(--sage-dark);
            margin-bottom: 1rem;
            text-align: center;
        }
        
        .input-group {
            margin-bottom: 1rem;
        }
        
        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--brown-light);
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        
        .input-group input,
        .input-group textarea {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid var(--cream-dark);
            border-radius: 12px;
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 1rem;
            background: var(--cream);
            color: var(--brown);
            transition: all 0.3s ease;
            resize: none;
        }
        
        .input-group input:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: var(--sage);
            background: var(--paper);
        }
        
        .input-group textarea {
            height: 100px;
        }
        
        .plant-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--sage) 0%, var(--sage-dark) 100%);
            color: white;
            border: none;
            border-radius: 16px;
            font-family: 'Caveat', cursive;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(93, 122, 84, 0.3);
        }
        
        .plant-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(93, 122, 84, 0.4);
        }
        
        .plant-btn:active {
            transform: translateY(0);
        }
        
        /* Garden Section */
        .garden-section {
            padding: 2rem 1rem;
        }
        
        .section-title {
            font-family: 'Caveat', cursive;
            font-size: 2rem;
            color: var(--sage-dark);
            text-align: center;
            margin-bottom: 1.5rem;
        }
        
        .garden-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .tree-card {
            background: var(--paper);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(107, 83, 68, 0.1);
            border: 2px solid var(--cream-dark);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .tree-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(107, 83, 68, 0.15);
            border-color: var(--sage-light);
        }
        
        .tree-visual {
            height: 180px;
            background: linear-gradient(180deg, #e8f0e6 0%, #d4e4d0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        .tree-svg {
            width: 120px;
            height: 140px;
            animation: sway 4s ease-in-out infinite;
        }
        
        @keyframes sway {
            0%, 100% { transform: rotate(-2deg); }
            50% { transform: rotate(2deg); }
        }
        
        .tree-date {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            background: var(--paper);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-family: 'DM Mono', monospace;
            font-size: 0.7rem;
            color: var(--brown-light);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .tree-info {
            padding: 1rem;
        }
        
        .tree-title {
            font-family: 'Caveat', cursive;
            font-size: 1.25rem;
            color: var(--sage-dark);
            margin-bottom: 0.5rem;
        }
        
        .tree-concepts {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        
        .concept-tag {
            background: var(--cream);
            color: var(--brown-light);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            border: 1px solid var(--cream-dark);
        }
        
        .tree-preview {
            font-size: 0.85rem;
            color: var(--brown-light);
            margin-top: 0.5rem;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        /* Empty State */
        .empty-garden {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--brown-light);
        }
        
        .empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
        
        .empty-garden p {
            font-size: 1rem;
            max-width: 300px;
            margin: 0 auto;
            line-height: 1.6;
        }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(107, 83, 68, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            padding: 1rem;
        }
        
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .modal {
            background: var(--paper);
            border-radius: 24px;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }
        
        .modal-overlay.active .modal {
            transform: scale(1);
        }
        
        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--cream-dark);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-title {
            font-family: 'Caveat', cursive;
            font-size: 1.5rem;
            color: var(--sage-dark);
        }
        
        .close-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: var(--cream);
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.25rem;
            color: var(--brown-light);
            transition: all 0.3s ease;
        }
        
        .close-btn:hover {
            background: var(--cream-dark);
            color: var(--brown);
        }
        
        .modal-body {
            padding: 1.5rem;
        }
        
        .modal-body p {
            line-height: 1.7;
            color: var(--brown);
            margin-bottom: 1rem;
        }
        
        .modal-body .concept-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin: 1rem 0;
        }
        
        .modal-body .concept-tag {
            background: var(--sage-light);
            color: var(--sage-dark);
            border: none;
        }
        
        .delete-btn {
            width: 100%;
            padding: 0.75rem;
            background: var(--cream);
            border: 2px solid var(--terracotta-light);
            border-radius: 12px;
            color: var(--terracotta);
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 1rem;
            transition: all 0.3s ease;
        }
        
        .delete-btn:hover {
            background: var(--terracotta-light);
            color: var(--paper);
        }
        
        /* Floating leaves decoration */
        .leaf {
            position: fixed;
            pointer-events: none;
            opacity: 0.6;
            z-index: 999;
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }
        
        /* Responsive */
        @media (max-width: 600px) {
            .header h1 {
                font-size: 2.25rem;
            }
            
            .stats-bar {
                gap: 1rem;
            }
            
            .stat {
                padding: 0.5rem 1rem;
            }
            
            .stat-value {
                font-size: 1.5rem;
            }
            
            .tree-visual {
                height: 150px;
            }
            
            .tree-svg {
                width: 100px;
                height: 120px;
            }
        }
        
        /* Animation for new tree */
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .tree-card.new {
            animation: popIn 0.5s ease-out;
        }
    </style>
</head>
<body>
    <!-- Decorative floating leaves -->
    <svg class="leaf" style="top: 10%; left: 5%; width: 30px;" viewBox="0 0 24 24" fill="#8fae8b">
        <path d="M17,8C8,10 5.9,16.17 3.82,21.34L5.71,22L6.66,19.7C7.14,19.87 7.64,20 8,20C19,20 22,3 22,3C21,5 14,5.25 9,6.25C4,7.25 2,11.5 2,13.5C2,15.5 3.75,17.25 3.75,17.25C7,8 17,8 17,8Z"/>
    </svg>
    <svg class="leaf" style="top: 30%; right: 8%; width: 25px; animation-delay: 1s;" viewBox="0 0 24 24" fill="#b8d4ae">
        <path d="M17,8C8,10 5.9,16.17 3.82,21.34L5.71,22L6.66,19.7C7.14,19.87 7.64,20 8,20C19,20 22,3 22,3C21,5 14,5.25 9,6.25C4,7.25 2,11.5 2,13.5C2,15.5 3.75,17.25 3.75,17.25C7,8 17,8 17,8Z"/>
    </svg>
    <svg class="leaf" style="bottom: 20%; left: 10%; width: 20px; animation-delay: 2s;" viewBox="0 0 24 24" fill="#8fae8b">
        <path d="M17,8C8,10 5.9,16.17 3.82,21.34L5.71,22L6.66,19.7C7.14,19.87 7.64,20 8,20C19,20 22,3 22,3C21,5 14,5.25 9,6.25C4,7.25 2,11.5 2,13.5C2,15.5 3.75,17.25 3.75,17.25C7,8 17,8 17,8Z"/>
    </svg>
    
    <header class="header">
        <h1>🌿 思維花園</h1>
        <p>種下每一天的智慧種子，讓知識在此生根發芽</p>
    </header>
    
    <div class="stats-bar">
        <div class="stat">
            <div class="stat-value" id="totalSeeds">0</div>
            <div class="stat-label">播種總數</div>
        </div>
        <div class="stat">
            <div class="stat-value" id="totalConcepts">0</div>
            <div class="stat-label">概念標籤</div>
        </div>
        <div class="stat">
            <div class="stat-value" id="streakDays">0</div>
            <div class="stat-label">連續播種</div>
        </div>
    </div>
    
    <section class="input-section">
        <div class="input-card">
            <h2>🌱 種下今日的智慧</h2>
            <div class="input-group">
                <label for="treeName">這棵樹的名字</label>
                <input type="text" id="treeName" placeholder="例如：愛自己的勇氣">
            </div>
            <div class="input-group">
                <label for="treeContent">今天學到了什麼？</label>
                <textarea id="treeContent" placeholder="寫下今天學習的內容、感悟或新的想法..."></textarea>
            </div>
            <div class="input-group">
                <label for="treeTags">標籤（用逗號分隔）</label>
                <input type="text" id="treeTags" placeholder="例如：愛情, 自我成長, Naval">
            </div>
            <button class="plant-btn" onclick="plantTree()">🌱 播種</button>
        </div>
    </section>
    
    <section class="garden-section">
        <h2 class="section-title">🌳 我的智慧花園</h2>
        <div class="garden-grid" id="gardenGrid">
            <div class="empty-garden" id="emptyState">
                <div class="empty-icon">🌱</div>
                <p>花園還空空的～<br>種下第一棵智慧樹吧！</p>
            </div>
        </div>
    </section>
    
    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">智慧樹</h3>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Content injected by JS -->
            </div>
        </div>
    </div>
    
    <script>
        // Tree SVGs - different shapes for variety
        const treeSVGs = [
            // Oak-like tree
            `<svg viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 120V70" stroke="#6b5344" stroke-width="8" stroke-linecap="round"/>
                <path d="M50 70C30 70 20 50 25 35C30 20 45 15 50 10C55 15 70 20 75 35C80 50 70 70 50 70Z" fill="#8fae8b"/>
                <path d="M35 55C25 50 20 40 25 30" stroke="#6b5344" stroke-width="3" stroke-linecap="round"/>
                <path d="M65 55C75 50 80 40 75 30" stroke="#6b5344" stroke-width="3" stroke-linecap="round"/>
                <ellipse cx="35" cy="32" rx="12" ry="10" fill="#b8d4ae"/>
                <ellipse cx="65" cy="32" rx="12" ry="10" fill="#b8d4ae"/>
                <ellipse cx="50" cy="20" rx="15" ry="12" fill="#a8c89a"/>
            </svg>`,
            // Pine-like tree
            `<svg viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 120V80" stroke="#6b5344" stroke-width="8" stroke-linecap="round"/>
                <path d="M50 10L25 45H40L20 75H35L15 105H85L65 75H80L60 45H75L50 10Z" fill="#5d7a54"/>
                <path d="M50 25L35 45H45L30 70H42L25 95H42" stroke="#8fae8b" stroke-width="3" stroke-linecap="round"/>
            </svg>`,
            // Cherry blossom tree
            `<svg viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 120V65" stroke="#6b5344" stroke-width="6" stroke-linecap="round"/>
                <path d="M50 65C30 65 15 50 15 35C15 15 35 10 50 25C65 10 85 15 85 35C85 50 70 65 50 65Z" fill="#ffb7c5"/>
                <circle cx="30" cy="30" r="4" fill="#ff69b4"/>
                <circle cx="70" cy="28" r="4" fill="#ff69b4"/>
                <circle cx="50" cy="18" r="4" fill="#ff69b4"/>
                <circle cx="40" cy="40" r="3" fill="#ff69b4"/>
                <circle cx="62" cy="38" r="3" fill="#ff69b4"/>
                <circle cx="25" cy="45" r="3" fill="#ff69b4"/>
                <circle cx="75" cy="42" r="3" fill="#ff69b4"/>
            </svg>`,
            // Willow-like tree
            `<svg viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 120V60" stroke="#6b5344" stroke-width="6" stroke-linecap="round"/>
                <path d="M50 60C35 60 20 70 20 85C20 100 30 110 40 115" stroke="#8fae8b" stroke-width="3" stroke-linecap="round"/>
                <path d="M50 60C65 60 80 70 80 85C80 100 70 110 60 115" stroke="#8fae8b" stroke-width="3" stroke-linecap="round"/>
                <path d="M50 60C40 55 30 60 25 75" stroke="#b8d4ae" stroke-width="2" stroke-linecap="round"/>
                <path d="M50 60C60 55 70 60 75 75" stroke="#b8d4ae" stroke-width="2" stroke-linecap="round"/>
                <path d="M50 60C45 50 35 45 30 55" stroke="#a8c89a" stroke-width="2" stroke-linecap="round"/>
                <path d="M50 60C55 50 65 45 70 55" stroke="#a8c89a" stroke-width="2" stroke-linecap="round"/>
                <ellipse cx="50" cy="45" rx="20" ry="15" fill="#8fae8b"/>
            </svg>`,
            // Ginkgo tree
            `<svg viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 120V70" stroke="#6b5344" stroke-width="7" stroke-linecap="round"/>
                <path d="M50 70C25 65 15 40 25 25C35 10 50 15 50 15C50 15 65 10 75 25C85 40 75 65 50 70Z" fill="#d4a853"/>
                <path d="M50 70V15" stroke="#c49843" stroke-width="2"/>
                <path d="M50 40L35 30M50 40L65 30" stroke="#c49843" stroke-width="1.5"/>
                <path d="M50 50L30 42M50 50L70 42" stroke="#c49843" stroke-width="1.5"/>
                <path d="M50 60L32 55M50 60L68 55" stroke="#c49843" stroke-width="1.5"/>
            </svg>`
        ];
        
        // Load data from localStorage
        function loadGarden() {
            const data = localStorage.getItem('thoughtGarden');
            return data ? JSON.parse(data) : [];
        }
        
        // Save data to localStorage
        function saveGarden(garden) {
            localStorage.setItem('thoughtGarden', JSON.stringify(garden));
        }
        
        // Update stats
        function updateStats() {
            const garden = loadGarden();
            const totalSeeds = garden.length;
            const totalConcepts = garden.reduce((sum, tree) => sum + (tree.tags ? tree.tags.length : 0), 0);
            
            // Calculate streak
            let streak = 0;
            if (garden.length > 0) {
                const sortedDates = garden.map(t => t.date).sort().reverse();
                const today = new Date().toISOString().split('T')[0];
                const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
                
                if (sortedDates[0] === today || sortedDates[0] === yesterday) {
                    streak = 1;
                    let checkDate = new Date(sortedDates[0]);
                    for (let i = 1; i < sortedDates.length; i++) {
                        const prevDate = new Date(checkDate.getTime() - 86400000).toISOString().split('T')[0];
                        if (sortedDates[i] === prevDate) {
                            streak++;
                            checkDate = new Date(sortedDates[i]);
                        } else {
                            break;
                        }
                    }
                }
            }
            
            document.getElementById('totalSeeds').textContent = totalSeeds;
            document.getElementById('totalConcepts').textContent = totalConcepts;
            document.getElementById('streakDays').textContent = streak;
        }
        
        // Render garden
        function renderGarden() {
            const garden = loadGarden();
            const grid = document.getElementById('gardenGrid');
            const emptyState = document.getElementById('emptyState');
            
            if (garden.length === 0) {
                grid.innerHTML = '';
                grid.appendChild(emptyState);
                emptyState.style.display = 'block';
                return;
            }
            
            emptyState.style.display = 'none';
            
            // Sort by date, newest first
            const sorted = [...garden].sort((a, b) => new Date(b.date) - new Date(a.date));
            
            grid.innerHTML = sorted.map((tree, index) => {
                const treeSvg = treeSVGs[index % treeSVGs.length];
                const displayDate = new Date(tree.date).toLocaleDateString('zh-TW', { month: 'short', day: 'numeric' });
                const tagsHtml = tree.tags ? tree.tags.map(tag => `<span class="concept-tag">#${tag}</span>`).join('') : '';
                
                return `
                    <div class="tree-card" onclick="openTree('${tree.id}')">
                        <div class="tree-visual">
                            ${treeSvg}
                            <span class="tree-date">${displayDate}</span>
                        </div>
                        <div class="tree-info">
                            <h3 class="tree-title">${tree.name}</h3>
                            <div class="tree-concepts">${tagsHtml}</div>
                            <p class="tree-preview">${tree.content.substring(0, 80)}${tree.content.length > 80 ? '...' : ''}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // Plant a new tree
        function plantTree() {
            const name = document.getElementById('treeName').value.trim();
            const content = document.getElementById('treeContent').value.trim();
            const tagsInput = document.getElementById('treeTags').value.trim();
            
            if (!name || !content) {
                alert('請填寫樹名和學習內容！');
                return;
            }
            
            const tags = tagsInput ? tagsInput.split(',').map(t => t.trim()).filter(t => t) : [];
            
            const tree = {
                id: 'tree_' + Date.now(),
                name: name,
                content: content,
                tags: tags,
                date: new Date().toISOString().split('T')[0],
                createdAt: new Date().toISOString()
            };
            
            const garden = loadGarden();
            garden.push(tree);
            saveGarden(garden);
            
            // Clear inputs
            document.getElementById('treeName').value = '';
            document.getElementById('treeContent').value = '';
            document.getElementById('treeTags').value = '';
            
            // Re-render
            renderGarden();
            updateStats();
            
            // Add animation to new card
            setTimeout(() => {
                const cards = document.querySelectorAll('.tree-card');
                if (cards[0]) {
                    cards[0].classList.add('new');
                    setTimeout(() => cards[0].classList.remove('new'), 500);
                }
            }, 100);
        }
        
        // Open tree detail modal
        function openTree(id) {
            const garden = loadGarden();
            const tree = garden.find(t => t.id === id);
            if (!tree) return;
            
            const displayDate = new Date(tree.date).toLocaleDateString('zh-TW', { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric',
                weekday: 'long'
            });
            
            const tagsHtml = tree.tags && tree.tags.length > 0 
                ? `<div class="concept-tags">${tree.tags.map(tag => `<span class="concept-tag">#${tag}</span>`).join('')}</div>`
                : '';
            
            document.getElementById('modalTitle').textContent = tree.name;
            document.getElementById('modalBody').innerHTML = `
                <p style="font-family: 'DM Mono', monospace; color: var(--brown-light); margin-bottom: 1rem;">
                    🌱 播種於 ${displayDate}
                </p>
                ${tagsHtml}
                <p>${tree.content.replace(/\n/g, '<br>')}</p>
                <button class="delete-btn" onclick="deleteTree('${tree.id}')">🗑️ 刪除這棵樹</button>
            `;
            
            document.getElementById('modalOverlay').classList.add('active');
        }
        
        // Close modal
        function closeModal(event) {
            if (event && event.target !== event.currentTarget) return;
            document.getElementById('modalOverlay').classList.remove('active');
        }
        
        // Delete tree
        function deleteTree(id) {
            if (!confirm('確定要刪除這棵智慧樹嗎？')) return;
            
            const garden = loadGarden();
            const filtered = garden.filter(t => t.id !== id);
            saveGarden(filtered);
            
            closeModal();
            renderGarden();
            updateStats();
        }
        
        // Close modal on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
        
        // Initial render
        renderGarden();
        updateStats();
    </script>
</body>
</html>
