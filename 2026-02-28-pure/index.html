<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>易經六十四卦 | I Ching Oracle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0a0f;
      --bg-card: #12121a;
      --gold: #d4af37;
      --gold-light: #f4d58d;
      --gold-dark: #b8860b;
      --text: #e8e6e3;
      --text-muted: #8a8a8a;
      --accent-red: #8b0000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Serif TC', serif;
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-image: 
        radial-gradient(ellipse at top, #1a1a2e 0%, transparent 50%),
        radial-gradient(ellipse at bottom, #0f0f1a 0%, transparent 50%);
    }

    .container {
      max-width: 500px;
      width: 100%;
      text-align: center;
    }

    .title {
      font-family: 'Cinzel', serif;
      font-size: 2rem;
      color: var(--gold);
      margin-bottom: 8px;
      letter-spacing: 4px;
      text-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 40px;
      letter-spacing: 2px;
    }

    .taiji {
      width: 120px;
      height: 120px;
      margin: 0 auto 40px;
      position: relative;
      cursor: pointer;
      animation: float 3s ease-in-out infinite;
    }

    .taiji svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.5));
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .taiji:hover {
      animation: spin 2s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .oracle-btn {
      background: linear-gradient(135deg, var(--gold-dark), var(--gold));
      color: var(--bg-dark);
      border: none;
      padding: 16px 48px;
      font-size: 1.1rem;
      font-family: 'Noto Serif TC', serif;
      font-weight: 700;
      letter-spacing: 3px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.3);
    }

    .oracle-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 30px rgba(212, 175, 55, 0.5);
    }

    .oracle-btn:active {
      transform: translateY(0);
    }

    .result {
      display: none;
      margin-top: 40px;
      padding: 30px;
      background: var(--bg-card);
      border: 1px solid var(--gold-dark);
      border-radius: 8px;
      animation: fadeIn 0.5s ease;
    }

    .result.show {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hexagram-symbol {
      font-size: 4rem;
      color: var(--gold);
      margin-bottom: 16px;
      font-family: 'Cinzel', serif;
    }

    .hexagram-name {
      font-size: 1.5rem;
      color: var(--gold-light);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .hexagram-number {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .hexagram-meaning {
      font-size: 1rem;
      line-height: 1.8;
      color: var(--text);
      text-align: left;
    }

    .divider {
      width: 60px;
      height: 2px;
      background: var(--gold);
      margin: 20px auto;
    }

    .stats {
      margin-top: 30px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .grain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div class="grain"></div>
  
  <div class="container">
    <h1 class="title">易經六十四卦</h1>
    <p class="subtitle">I CHING ORACLE</p>
    
    <div class="taiji">
      <svg viewBox="0 0 100 100">
        <defs>
          <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#d4af37"/>
            <stop offset="100%" style="stop-color:#b8860b"/>
          </linearGradient>
        </defs>
        <circle cx="50" cy="50" r="48" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
        <path d="M50 2 A48 48 0 0 1 50 98" fill="#d4af37" opacity="0.9"/>
        <path d="M50 2 A48 48 0 0 0 50 98" fill="#1a1a2e" opacity="0.9"/>
        <circle cx="50" cy="26" r="10" fill="#d4af37"/>
        <circle cx="50" cy="74" r="10" fill="#1a1a2e" stroke="#d4af37" stroke-width="2"/>
      </svg>
    </div>
    
    <button class="oracle-btn" onclick="castOracle()">擲筊求卦</button>
    
    <div class="result" id="result">
      <div class="hexagram-symbol" id="symbol"></div>
      <div class="hexagram-name" id="name"></div>
      <div class="hexagram-number" id="number"></div>
      <div class="divider"></div>
      <div class="hexagram-meaning" id="meaning"></div>
    </div>
    
    <div class="stats">
      已累計占卜 <span id="count">0</span> 次
    </div>
  </div>

  <script>
    const hexagrams = [
      { symbol: "�罒", name: "乾為天", number: 1, meaning: "元亨利貞。象徵天，龍潛於淵，君子以自强不息。" },
      { symbol: "䷐", name: "坤為地", number: 2, meaning: "元亨，利牝馬之貞。象徵地，君子以厚德載物。" },
      { symbol: "䷐", name: "水雷屯", number: 3, meaning: "元亨利貞，勿用有攸往，利建侯。象徵萬物初生，艱難之時。" },
      { symbol: "䷒", name: "山水蒙", number: 4, meaning: "亨，匪我求童蒙，童蒙求我。象徵啟蒙，賢明之人教育愚昧。" },
      { symbol: "䷓", name: "水天需", number: 5, meaning: "有孚，光亨，貞吉，利涉大川。象徵等待，誠信則獲利。" },
      { symbol: "䷔", name: "天水讼", number: 6, meaning: "有孚窒惕，中吉，終凶。象徵爭執，須戒慎恐懼。" },
      { symbol: "䷙", name: "地水師", number: 7, meaning: "貞丈人吉，无咎。象徵兵戈，賢明之人統軍則吉。" },
      { symbol: "䷚", name: "水地比", number: 8, meaning: "吉，原筮元永貞，无咎。象徵親比，順從則獲利。" },
      { symbol: "䷪", name: "風天小畜", number: 9, meaning: "亨，密雲不雨，自我西郊。象徵積蓄，小有所成但未大就。" },
      { symbol: "䷫", name: "天澤履", number: 10, meaning: "履虎尾，不咥人，亨。象徵踐履，踩老虎尾巴而不被咬。" },
      { symbol: "䷬", name: "地天泰", number: 11, meaning: "小往大來，吉亨。象徵通泰，天地相交而萬物生成。" },
      { symbol: "䷭", name: "天地否", number: 12, meaning: "否之匪人，不利君子貞。象徵閉塞，天地不相交感。" },
      { symbol: "䷮", name: "天火同人", number: 13, meaning: "同人於野，亨，利涉大川。象徵同心，和同於野曠之地。" },
      { symbol: "䷯", name: "火天大有", number: 14, meaning: "元亨。象徵豐盛，離火在天上，萬物皆照。" },
      { symbol: "䷰", name: "地山謙", number: 15, meaning: "亨，君子有終。象徵謙遜，山在地中以卑屈而上。" },
      { symbol: "䷱", name: "雷地豫", number: 16, meaning: "利建侯行師。象徵歡悅，雷出於地，萬物振發。" },
      { symbol: "䷲", name: "澤雷隨", number: 17, meaning: "元亨利貞，无咎。象徵隨從，澤中有雷，陽氣從之。" },
      { symbol: "䷳", name: "山風蠱", number: 18, meaning: "元亨，利涉大川。象徵弊亂，山風相遇，整治則亨。" },
      { symbol: "䷴", name: "地澤臨", number: 19, meaning: "元亨利貞，至於八月有凶。象徵臨近，澤上有地，居高臨下。" },
      { symbol: "䷵", name: "風地觀", number: 20, meaning: "盥而不荐，有孚颙若。象徵觀仰，風行地上，萬物皆觀。" },
      { symbol: "䷶", name: "火雷噬嗑", number: 21, meaning: "亨，利用獄。象徵刑罰，雷電合而相噬。" },
      { symbol: "䷷", name: "山火賁", number: 22, meaning: "亨，小利有攸往。象徵修飾，山下有火，萬物被照。" },
      { symbol: "䷸", name: "山地剝", number: 23, meaning: "不利有攸往。象徵剝落，山附於地，傾危之時。" },
      { symbol: "䷹", name: "地雷復", number: 24, meaning: "亨，出入无疾，朋來无咎。象徵復歸，雷在地中，陽氣復生。" },
      { symbol: "䷺", name: "天雷无妄", number: 25, meaning: "元亨利貞，其匪正有眚。象徵無妄，雷在天上，萬物各遂其性。" },
      { symbol: "䷻", name: "山天大畜", number: 26, meaning: "利貞，不家食吉，利涉大川。象徵積蓄，山在天上，剛健笃實。" },
      { symbol: "䷼", name: "山雷頤", number: 27, meaning: "貞吉，利涉大川。象徵頤養，山下有雷，萬物得以養。" },
      { symbol: "䷽", name: "澤風大過", number: 28, meaning: "棟橈，利有攸往，亨。象徵過度，澤滅木，大過之時。" },
      { symbol: "䷾", name: "坎為水", number: 29, meaning: "習坎，有孚，維心亨，行有尚。象徵險陷，兩坎相重，險阻重重。" },
      { symbol: "䷿", name: "離為火", number: 30, meaning: "利貞，亨，畜牝牛吉。象徵附麗，兩離相重，光明相繼。" },
      { symbol: "䷤", name: "澤山咸", number: 31, meaning: "亨利貞，取女吉。象徵感應，澤上有山，氣息相感。" },
      { symbol: "䷥", name: "雷風恆", number: 32, meaning: "亨无咎，利貞，利有攸往。象徵恆久，雷風相與，恆久不已。" },
      { symbol: "䷦", name: "天山遯", number: 33, meaning: "亨，小利貞。象徵退避，天山上進，陰長陽退。" },
      { symbol: "䷧", name: "雷天大壯", number: 34, meaning: "利貞。象徵壯盛，雷在天上，陽氣盛壯。" },
      { symbol: "䷨", name: "火地晉", number: 35, meaning: "康侯用錫馬蕃庶，晝日三接。象徵進升，火在地上，萬物皆明。" },
      { symbol: "䷩", name: "地火明夷", number: 36, meaning: "利艱貞。象徵昏暗，明入地中，君子用晦而明。" },
      { symbol: "䷪", name: "風火家人", number: 37, meaning: "利女貞。象徵齊家，風自火出，家人之象。" },
      { symbol: "䷫", name: "火澤睽", number: 38, meaning: "小事吉。象徵乖離，火澤相睽，萬物不暢。" },
      { symbol: "䷬", name: "水山蹇", number: 39, meaning: "利西南，不利東北，利見大人，貞吉。象徵艱難，山上有水，險阻在前。" },
      { symbol: "䷭", name: "雷水解", number: 40, meaning: "利西南，无所往，其來復吉。象徵解難，雷雨作，萬物生長。" },
      { symbol: "䷮", name: "山澤損", number: 41, meaning: "有孚，元吉，无咎可貞，利有攸往。象徵減損，澤上有山，陽氣受損。" },
      { symbol: "䷯", name: "風雷益", number: 42, meaning: "利有攸往，利涉大川。象徵增益，風雷相助，萬物益盛。" },
      { symbol: "䷰", name: "澤天夬", number: 43, meaning: "揚于王庭，孚號有厲，告自邑，不利即戎。象徵決斷，澤上於天，陽氣決陰。" },
      { symbol: "䷱", name: "天風姤", number: 44, meaning: "女壯，勿用取女。象徵相遇，天風相遇，陰始生於下。" },
      { symbol: "䷲", name: "澤地萃", number: 45, meaning: "亨，王假有廟，利見大人，亨利貞。象徵聚集，澤上於地，萬物萃聚。" },
      { symbol: "䷳", name: "地風升", number: 46, meaning: "元亨，用見大人，勿恤，南征吉。象徵上升，地中有木，陽氣升長。" },
      { symbol: "䷴", name: "澤水困", number: 47, meaning: "亨，貞大人吉，无咎，有言不信。象徵困窮，澤無水，困乏之時。" },
      { symbol: "䷵", name: "水風井", number: 48, meaning: "改邑不改井，无喪无得，往來井井。象徵井泉，水風相激，養人不竭。" },
      { symbol: "䷶", name: "澤火革", number: 49, meaning: "己日乃孚，元亨利貞，悔亡。象徵變革，澤火相革，順天應人。" },
      { symbol: "䷷", name: "火鼎鼎", number: 50, meaning: "吉鼎。象徵鼎新，火在澤上，萬物皆烹。" },
      { symbol: "䷸", name: "震為雷", number: 51, meaning: "亨，震來虩虩，笑言啞啞。象徵震動，震雷相叠，驚恐萬物。" },
      { symbol: "䷹", name: "艮為山", number: 52, meaning: "艮其背，不獲其身，行其庭，不見其人，无咎。象徵停止，兩山相重，靜止不動。" },
      { symbol: "䷺", name: "風山漸", number: 53, meaning: "女歸吉，利貞。象徵漸進，山上有風，萬物有序。" },
      { symbol: "䷻", name: "雷澤歸妹", number: 54, meaning: "征凶，无攸利。象徵嫁娶，雷澤相遇，少女從長男。" },
      { symbol: "䷼", name: "雷火豐", number: 55, meaning: "亨，王假之，勿憂，宜日中。象徵豐盛，雷電相遇，聲勢顯赫。" },
      { symbol: "䷽", name: "火山旅", number: 56, meaning: "小亨，旅貞吉。象徵羈旅，火在山上，羈旅之象。" },
      { symbol: "䷾", name: "巽為風", number: 57, meaning: "小亨，利有攸往，利見大人。象徵順從，風入於地，陰順從陽。" },
      { symbol: "䷿", name: "兌為澤", number: 58, meaning: "亨，利貞。象徵喜悅，兩澤相連，欣悅相與。" },
      { symbol: "䷽", name: "風水渙", number: 59, meaning: "亨，王假有廟，利涉大川，利貞。象徵渙散，風水相遇，離散之時。" },
      { symbol: "䷾", name: "水澤節", number: 60, meaning: "亨，苦節不可貞。象徵節制，澤上有水，節制則亨。" },
      { symbol: "䷿", name: "風澤中孚", number: 61, meaning: "豚魚吉，利涉大川，利貞。象徵誠信，風澤相從，心意誠信。" },
      { symbol: "㓨", name: "雷山小過", number: 62, meaning: "小事吉，大事不可。象徵小過，雷在山上，陽大陰小。" },
      { symbol: "㓥", name: "水火既濟", number: 63, meaning: "亨小利貞，初吉終亂。象徵成功，水在火上，陰陽已濟。" },
      { symbol: "㓧", name: "火水未濟", number: 64, meaning: "亨，小狐汔濟，濡其尾，无攸利。象徵未成，火在水上，陰陽未濟。" }
    ];

    function getCount() {
      return parseInt(localStorage.getItem('iching_count') || '0');
    }

    function setCount(n) {
      localStorage.setItem('iching_count', n.toString());
      document.getElementById('count').textContent = n;
    }

    function castOracle() {
      const result = document.getElementById('result');
      result.classList.remove('show');
      
      setTimeout(() => {
        const idx = Math.floor(Math.random() * 64);
        const hex = hexagrams[idx];
        
        document.getElementById('symbol').textContent = hex.symbol;
        document.getElementById('name').textContent = hex.name;
        document.getElementById('number').textContent = `第 ${hex.number} 卦`;
        document.getElementById('meaning').textContent = hex.meaning;
        
        setCount(getCount() + 1);
        
        result.classList.add('show');
      }, 300);
    }

    document.getElementById('count').textContent = getCount();
  </script>
</body>
</html>
