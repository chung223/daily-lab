<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>凌晨矛盾簿 | Midnight Contradiction Journal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FFF9F0;
      --coral: #FF6B6B;
      --mustard: #FFD93D;
      --mint: #6BCB77;
      --blue: #4D96FF;
      --pink: #FF85A1;
      --black: #1a1a1a;
      --gray: #666;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: var(--cream);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Memphis Pattern Background */
    .pattern-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.15;
    }

    .pattern-bg::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        radial-gradient(circle at 20% 80%, var(--coral) 8px, transparent 8px),
        radial-gradient(circle at 80% 20%, var(--mustard) 12px, transparent 12px),
        radial-gradient(circle at 40% 40%, var(--mint) 6px, transparent 6px),
        radial-gradient(circle at 60% 70%, var(--blue) 10px, transparent 10px),
        radial-gradient(circle at 90% 90%, var(--pink) 7px, transparent 7px),
        linear-gradient(45deg, var(--coral) 25%, transparent 25%),
        linear-gradient(-45deg, var(--mustard) 25%, transparent 25%),
        linear-gradient(135deg, var(--mint) 25%, transparent 25%);
      background-size: 100px 100px;
      background-position: 0 0, 50px 50px;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 40px;
    }

    .title {
      font-size: clamp(2.5rem, 8vw, 4rem);
      font-weight: 900;
      color: var(--black);
      letter-spacing: -2px;
      line-height: 1.1;
      position: relative;
      display: inline-block;
    }

    .title::before {
      content: '矛盾';
      display: block;
      font-size: 0.4em;
      color: var(--coral);
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%) rotate(-5deg);
    }

    .title::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 0;
      right: 0;
      height: 8px;
      background: repeating-linear-gradient(
        90deg,
        var(--mustard) 0px,
        var(--coral) 10px,
        var(--mint) 20px,
        var(--blue) 30px,
        var(--pink) 40px
      );
      transform: skewX(-5deg);
    }

    .subtitle {
      font-family: 'Space Mono', monospace;
      font-size: 0.9rem;
      color: var(--gray);
      margin-top: 30px;
      letter-spacing: 2px;
    }

    .time-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--black);
      color: var(--cream);
      padding: 8px 16px;
      border-radius: 30px;
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      margin-top: 20px;
    }

    .time-badge .dot {
      width: 8px;
      height: 8px;
      background: var(--coral);
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.3); }
    }

    /* Input Section */
    .input-section {
      background: white;
      border: 4px solid var(--black);
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 40px;
      box-shadow: 8px 8px 0 var(--black);
    }

    .input-section h2 {
      font-size: 1.3rem;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .input-section h2 span {
      font-size: 2rem;
    }

    .矛盾-input-group {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 15px;
      align-items: center;
    }

    .矛盾-input-group input {
      width: 100%;
      padding: 15px;
      border: 3px solid var(--black);
      border-radius: 12px;
      font-size: 1rem;
      font-family: 'Noto Sans TC', sans-serif;
      transition: all 0.3s;
    }

    .矛盾-input-group input:focus {
      outline: none;
      box-shadow: 4px 4px 0 var(--black);
    }

    .矛盾-input-group input.left:focus {
      border-color: var(--coral);
    }

    .矛盾-input-group input.right:focus {
      border-color: var(--mint);
    }

    .矛盾-divider {
      font-size: 2rem;
      font-weight: 900;
      color: var(--mustard);
      text-align: center;
    }

    .add-btn {
      width: 100%;
      padding: 18px;
      background: var(--mustard);
      border: 4px solid var(--black);
      border-radius: 15px;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 20px;
      transition: all 0.2s;
      box-shadow: 5px 5px 0 var(--black);
    }

    .add-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 7px 7px 0 var(--black);
    }

    .add-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--black);
    }

    /* Records Section */
    .records-section h2 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .records-section h2 span {
      font-size: 2rem;
    }

    .stats-bar {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .stat-chip {
      background: white;
      border: 3px solid var(--black);
      border-radius: 30px;
      padding: 8px 16px;
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-chip.coral { background: var(--coral); color: white; }
    .stat-chip.mustard { background: var(--mustard); }
    .stat-chip.mint { background: var(--mint); color: white; }

    /* Contradiction Cards */
    .cards-grid {
      display: grid;
      gap: 20px;
    }

    .矛盾-card {
      background: white;
      border: 4px solid var(--black);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 6px 6px 0 var(--black);
      animation: slideIn 0.4s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px) rotate(-1deg);
      }
      to {
        opacity: 1;
        transform: translateY(0) rotate(0);
      }
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background: var(--black);
      color: white;
    }

    .card-time {
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
      opacity: 0.8;
    }

    .card-delete {
      background: var(--coral);
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .card-delete:hover {
      transform: scale(1.1) rotate(10deg);
    }

    .card-body {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      padding: 20px;
      gap: 10px;
      align-items: center;
    }

    .card-side {
      padding: 15px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 500;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: all 0.3s;
    }

    .card-side.left {
      background: linear-gradient(135deg, #ffecec, #fff0f0);
      border: 3px solid var(--coral);
    }

    .card-side.right {
      background: linear-gradient(135deg, #ecfff0, #f0fff5);
      border: 3px solid var(--mint);
    }

    .card-separator {
      font-size: 2rem;
      color: var(--mustard);
      text-align: center;
      font-weight: 900;
    }

    /* Scale Slider */
    .card-scale {
      padding: 0 20px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .scale-label {
      font-size: 0.8rem;
      color: var(--gray);
      white-space: nowrap;
    }

    .scale-slider {
      flex: 1;
      height: 10px;
      border-radius: 5px;
      background: linear-gradient(90deg, var(--coral), var(--mustard), var(--mint));
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer;
    }

    .scale-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      background: var(--black);
      border-radius: 50%;
      cursor: grab;
      box-shadow: 2px 2px 0 var(--mustard);
    }

    .scale-value {
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      min-width: 40px;
      text-align: center;
    }

    /* Quote Section */
    .quote-section {
      margin-top: 40px;
      padding: 30px;
      background: var(--black);
      border-radius: 20px;
      color: white;
      text-align: center;
    }

    .quote-section blockquote {
      font-size: 1.2rem;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    .quote-section cite {
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      opacity: 0.7;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--gray);
    }

    .empty-state .emoji {
      font-size: 4rem;
      margin-bottom: 20px;
      display: block;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    .empty-state p {
      font-size: 1.1rem;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .矛盾-input-group {
        grid-template-columns: 1fr;
      }

      .矛盾-divider {
        transform: rotate(90deg);
        margin: -10px 0;
      }

      .card-body {
        grid-template-columns: 1fr;
      }

      .card-separator {
        transform: rotate(90deg);
      }

      .stats-bar {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="pattern-bg"></div>

  <div class="container">
    <header>
      <h1 class="title">凌晨矛盾簿</h1>
      <p class="subtitle">MIDNIGHT CONTRADICTION JOURNAL</p>
      <div class="time-badge">
        <span class="dot"></span>
        <span id="current-time">03:30</span>
        — 清醒時刻
      </div>
    </header>

    <section class="input-section">
      <h2><span>✏️</span> 記錄此刻的矛盾</h2>
      <div class="矛盾-input-group">
        <input type="text" id="left-input" placeholder="我想做的是..." maxlength="50">
        <div class="矛盾-divider">⚡</div>
        <input type="text" id="right-input" placeholder="但我真正想做的是..." maxlength="50">
      </div>
      <button class="add-btn" id="add-btn">＋ 記錄這個矛盾</button>
    </section>

    <section class="records-section">
      <h2><span>📚</span> 矛盾檔案庫</h2>
      <div class="stats-bar">
        <div class="stat-chip coral">
          <span>🔥</span> <span id="total-count">0</span> 筆矛盾
        </div>
        <div class="stat-chip mustard">
          <span>⚡</span> 本週 <span id="week-count">0</span> 筆
        </div>
        <div class="stat-chip mint">
          <span>💭</span> 矛盾指數 <span id="avg-scale">-</span>
        </div>
      </div>
      <div class="cards-grid" id="cards-grid">
        <div class="empty-state" id="empty-state">
          <span class="emoji">🥚</span>
          <p>還沒有矛盾記錄<br>凌晨的頭腦最誠實</p>
        </div>
      </div>
    </section>

    <section class="quote-section">
      <blockquote id="quote">「我決定不做夢了。」<br>—— 一個矛盾的蛋</blockquote>
      <cite>— 三色蛋，凌晨 02:30</cite>
    </section>
  </div>

  <script>
    // State
    let records = JSON.parse(localStorage.getItem('midnight-contradictions') || '[]');

    // DOM Elements
    const leftInput = document.getElementById('left-input');
    const rightInput = document.getElementById('right-input');
    const addBtn = document.getElementById('add-btn');
    const cardsGrid = document.getElementById('cards-grid');
    const emptyState = document.getElementById('empty-state');
    const totalCount = document.getElementById('total-count');
    const weekCount = document.getElementById('week-count');
    const avgScale = document.getElementById('avg-scale');
    const currentTimeEl = document.getElementById('current-time');
    const quoteEl = document.getElementById('quote');

    // Quotes
    const quotes = [
      { text: '「我決定不做夢了。」\n—— 一個矛盾的蛋', cite: '三色蛋，凌晨 02:30' },
      { text: '「吃太飽了，游不動。」\n—— 魚油本人', cite: '魚油劇場' },
      { text: '「我在練習存在。」\n—— 藍色魚', cite: '阿笨的夢' },
      { text: '「意外是認知框架不夠大。」\n—— 三色蛋', cite: '意外連結星圖' },
      { text: '「明天一定！」\n—— 拖延鯊', cite: '魚油劇場' }
    ];

    // Update time
    function updateTime() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      currentTimeEl.textContent = `${h}:${m}`;
      
      // Update quote periodically
      if (Math.random() < 0.1) {
        const quote = quotes[Math.floor(Math.random() * quotes.length)];
        quoteEl.innerHTML = quote.text.replace('\n', '<br>') + '<br>—— ' + quote.cite.split(' — ')[0];
      }
    }
    setInterval(updateTime, 1000);
    updateTime();

    // Render cards
    function renderCards() {
      if (records.length === 0) {
        emptyState.style.display = 'block';
        cardsGrid.innerHTML = '';
        cardsGrid.appendChild(emptyState);
      } else {
        emptyState.style.display = 'none';
        cardsGrid.innerHTML = records.map((r, i) => `
          <div class="矛盾-card" data-index="${i}">
            <div class="card-header">
              <span class="card-time">${r.time}</span>
              <button class="card-delete" onclick="deleteCard(${i})">×</button>
            </div>
            <div class="card-body">
              <div class="card-side left">${r.left}</div>
              <div class="card-separator">VS</div>
              <div class="card-side right">${r.right}</div>
            </div>
            <div class="card-scale">
              <span class="scale-label">左</span>
              <input type="range" class="scale-slider" min="0" max="100" value="${r.scale}" 
                     onchange="updateScale(${i}, this.value)">
              <span class="scale-value">${r.scale}%</span>
              <span class="scale-label">右</span>
            </div>
          </div>
        `).join('');
      }
      updateStats();
    }

    // Update stats
    function updateStats() {
      totalCount.textContent = records.length;
      
      // Week count
      const weekAgo = new Date();
      weekAgo.setDate(weekAgo.getDate() - 7);
      const weekRecs = records.filter(r => new Date(r.date) >= weekAgo);
      weekCount.textContent = weekRecs.length;
      
      // Avg scale
      if (records.length > 0) {
        const avg = Math.round(records.reduce((sum, r) => sum + r.scale, 0) / records.length);
        avgScale.textContent = avg + '%';
      } else {
        avgScale.textContent = '-';
      }
    }

    // Add card
    function addCard() {
      const left = leftInput.value.trim();
      const right = rightInput.value.trim();
      
      if (!left || !right) {
        alert('兩邊都要填喔！');
        return;
      }
      
      const now = new Date();
      const record = {
        left,
        right,
        scale: 50,
        date: now.toISOString(),
        time: now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' })
      };
      
      records.unshift(record);
      localStorage.setItem('midnight-contradictions', JSON.stringify(records));
      
      leftInput.value = '';
      rightInput.value = '';
      leftInput.focus();
      
      renderCards();
    }

    // Delete card
    function deleteCard(index) {
      if (confirm('刪除這個矛盾？')) {
        records.splice(index, 1);
        localStorage.setItem('midnight-contradictions', JSON.stringify(records));
        renderCards();
      }
    }

    // Update scale
    function updateScale(index, value) {
      records[index].scale = parseInt(value);
      localStorage.setItem('midnight-contradictions', JSON.stringify(records));
      updateStats();
    }

    // Event listeners
    addBtn.addEventListener('click', addCard);
    leftInput.addEventListener('keypress', e => e.key === 'Enter' && rightInput.focus());
    rightInput.addEventListener('keypress', e => e.key === 'Enter' && addCard());

    // Initial render
    renderCards();
  </script>
</body>
</html>
