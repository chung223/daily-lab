<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IFE 2026 世界護照</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Klee:wght@400;600&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: #FDF6E3;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Passport book cover */
    .passport-book {
      max-width: 900px;
      margin: 0 auto;
      background: linear-gradient(145deg, #2C3E50 0%, #1a252f 100%);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 
        0 20px 60px rgba(0,0,0,0.3),
        inset 0 1px 0 rgba(255,255,255,0.1);
    }

    .passport-cover {
      background: linear-gradient(135deg, #1e3a5f 0%, #0d1f33 100%);
      border-radius: 8px;
      padding: 40px 30px;
      text-align: center;
      position: relative;
      overflow: hidden;
      border: 3px solid #c9a227;
    }

    .passport-cover::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 10px,
        rgba(201, 162, 39, 0.03) 10px,
        rgba(201, 162, 39, 0.03) 20px
      );
      pointer-events: none;
    }

    .emblem {
      width: 120px;
      height: 120px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #c9a227 0%, #f4d03f 50%, #c9a227 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      box-shadow: 
        0 4px 20px rgba(201, 162, 39, 0.4),
        inset 0 2px 4px rgba(255,255,255,0.3);
      animation: emblemPulse 3s ease-in-out infinite;
    }

    @keyframes emblemPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .passport-title {
      font-family: 'Klee', serif;
      font-size: 2.5rem;
      color: #f4d03f;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      margin-bottom: 8px;
    }

    .passport-year {
      font-family: 'Caveat', cursive;
      font-size: 1.8rem;
      color: #ecf0f1;
      margin-bottom: 20px;
    }

    .passport-stats {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 20px;
    }

    .stat-box {
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 15px 25px;
      border: 1px solid rgba(201, 162, 39, 0.3);
    }

    .stat-number {
      font-family: 'Klee', serif;
      font-size: 2.5rem;
      color: #f4d03f;
      font-weight: 600;
    }

    .stat-label {
      font-size: 0.9rem;
      color: #bdc3c7;
    }

    /* Inner pages */
    .passport-inner {
      background: #FDF6E3;
      margin-top: 20px;
      border-radius: 8px;
      padding: 30px;
      border: 2px solid #d4c4a8;
    }

    .section-title {
      font-family: 'Klee', serif;
      font-size: 1.6rem;
      color: #2C3E50;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px dashed #c9a227;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Stamp collection grid */
    .stamp-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stamp-card {
      background: #fff;
      border-radius: 12px;
      padding: 20px 15px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 3px solid #e0d5c1;
      position: relative;
      overflow: hidden;
    }

    .stamp-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--stamp-color, #c9a227);
    }

    .stamp-card:hover {
      transform: translateY(-5px) rotate(2deg);
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      border-color: var(--stamp-color, #c9a227);
    }

    .stamp-card.collected {
      background: linear-gradient(135deg, #fff 0%, #fef9e7 100%);
    }

    .stamp-card.not-collected {
      opacity: 0.6;
      filter: grayscale(50%);
    }

    .stamp-emoji {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .stamp-name {
      font-family: 'Klee', serif;
      font-size: 1rem;
      color: #2C3E50;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .stamp-count {
      font-family: 'Caveat', cursive;
      font-size: 1.1rem;
      color: #7f8c8d;
    }

    .stamp-year-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--stamp-color, #c9a227);
      color: white;
      font-family: 'Caveat', cursive;
      font-size: 0.8rem;
      padding: 2px 8px;
      border-radius: 10px;
    }

    /* Representative list */
    .rep-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }

    .rep-card {
      background: linear-gradient(135deg, #fff 0%, #f8f4ec 100%);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      border: 2px solid #e0d5c1;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .rep-card:hover {
      transform: translateX(5px);
      border-color: #c9a227;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    .rep-avatar {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #c9a227 0%, #f4d03f 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      flex-shrink: 0;
    }

    .rep-info {
      flex: 1;
    }

    .rep-name {
      font-family: 'Klee', serif;
      font-size: 1.2rem;
      color: #2C3E50;
      font-weight: 600;
    }

    .rep-stations {
      font-size: 0.9rem;
      color: #7f8c8d;
      margin-top: 3px;
    }

    .rep-badge {
      background: #27ae60;
      color: white;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
    }

    /* Timeline */
    .timeline {
      position: relative;
      padding-left: 30px;
      margin-bottom: 30px;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 10px;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(to bottom, #c9a227, #f4d03f, #c9a227);
      border-radius: 3px;
    }

    .timeline-item {
      position: relative;
      padding: 15px 20px;
      background: #fff;
      border-radius: 10px;
      margin-bottom: 15px;
      border: 2px solid #e0d5c1;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .timeline-item:hover {
      transform: translateX(10px);
      border-color: #c9a227;
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      left: -26px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      background: #c9a227;
      border-radius: 50%;
      border: 3px solid #FDF6E3;
      box-shadow: 0 0 0 3px #c9a227;
    }

    .timeline-date {
      font-family: 'Caveat', cursive;
      font-size: 1rem;
      color: #c9a227;
      margin-bottom: 5px;
    }

    .timeline-title {
      font-family: 'Klee', serif;
      font-size: 1.1rem;
      color: #2C3E50;
      font-weight: 600;
    }

    .timeline-desc {
      font-size: 0.9rem;
      color: #7f8c8d;
      margin-top: 5px;
    }

    /* Footer */
    .passport-footer {
      text-align: center;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 2px dashed #d4c4a8;
    }

    .website-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 25px;
      font-family: 'Klee', serif;
      font-size: 1.1rem;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3);
    }

    .website-link:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(39, 174, 96, 0.4);
    }

    .passport-id {
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      color: #95a5a6;
      margin-top: 15px;
    }

    /* Confetti animation */
    @keyframes stampIn {
      0% { transform: scale(0) rotate(-180deg); opacity: 0; }
      50% { transform: scale(1.2) rotate(10deg); }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .stamp-card.just-collected {
      animation: stampIn 0.6s ease-out;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .passport-title { font-size: 1.8rem; }
      .passport-year { font-size: 1.4rem; }
      .passport-stats { flex-direction: column; gap: 15px; }
      .stat-box { padding: 12px 20px; }
      .stat-number { font-size: 2rem; }
      .stamp-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .rep-list { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="passport-book">
    <div class="passport-cover">
      <div class="emblem">🌍</div>
      <h1 class="passport-title">IFE 2026</h1>
      <p class="passport-year">International Four-H Exchange</p>
      
      <div class="passport-stats">
        <div class="stat-box">
          <div class="stat-number">9</div>
          <div class="stat-label">位代表</div>
        </div>
        <div class="stat-box">
          <div class="stat-number">51</div>
          <div class="stat-label">站點</div>
        </div>
        <div class="stat-box">
          <div class="stat-number">4</div>
          <div class="stat-label">種語言</div>
        </div>
      </div>
    </div>

    <div class="passport-inner">
      <h2 class="section-title">📫 站點足跡收藏</h2>
      <div class="stamp-grid" id="stampGrid"></div>

      <h2 class="section-title">👥 代表名冊</h2>
      <div class="rep-list" id="repList"></div>

      <h2 class="section-title">⏰ 重要時刻</h2>
      <div class="timeline">
        <div class="timeline-item">
          <div class="timeline-date">2026-07-01</div>
          <div class="timeline-title">🎉 IFE 2026 正式啟動</div>
          <div class="timeline-desc">新年度國際四健會交流計畫開始</div>
        </div>
        <div class="timeline-item">
          <div class="timeline-date">2026-07-27 15:30</div>
          <div class="timeline-title">🚀 VPS 成功部署</div>
          <div class="timeline-desc">Notion 資料庫讀取修復，9位代表 × 51站點正式上線</div>
        </div>
        <div class="timeline-item">
          <div class="timeline-date">2026-07-27</div>
          <div class="timeline-title">✅ 系統健康檢查</div>
          <div class="timeline-desc">npm 安全掃描：0 漏洞 | Tech Digest：170篇→8條精選</div>
        </div>
      </div>

      <div class="passport-footer">
        <a href="https://index.4-h.me/ifye/2026/" target="_blank" class="website-link" id="websiteLink">
          🌐 訪問 IFE 2026 站點
        </a>
        <div class="passport-id">IFE-PASSPORT-2026-V1.0 | 持照人：Chung</div>
      </div>
    </div>
  </div>

  <script>
    // Station data (51 stations organized by region)
    const stations = [
      // 北區 (12站)
      { name: '台北', emoji: '🏙️', count: 6, region: 'north', color: '#3498db' },
      { name: '新北', emoji: '🌆', count: 5, region: 'north', color: '#2980b9' },
      { name: '桃園', emoji: '🎋', count: 4, region: 'north', color: '#1abc9c' },
      { name: '新竹', emoji: '🎍', count: 4, region: 'north', color: '#16a085' },
      { name: '基隆', emoji: '🚢', count: 2, region: 'north', color: '#00bcd4' },
      { name: '宜蘭', emoji: '🌸', count: 3, region: 'north', color: '#e91e63' },
      { name: '苗栗', emoji: '🍊', count: 3, region: 'north', color: '#ff9800' },
      { name: '花蓮', emoji: '🏔️', count: 2, region: 'north', color: '#9c27b0' },
      { name: '台中', emoji: '🏯', count: 7, region: 'north', color: '#673ab7' },
      { name: '彰化', emoji: '🌾', count: 4, region: 'north', color: '#3f51b5' },
      { name: '南投', emoji: '🏕️', count: 2, region: 'north', color: '#2196f3' },
      { name: '雲林', emoji: '🌿', count: 2, region: 'north', color: '#4caf50' },
      
      // 中區 (10站)
      { name: '嘉義', emoji: '🍵', count: 3, region: 'central', color: '#8bc34a' },
      { name: '台南', emoji: '🏛️', count: 5, region: 'central', color: '#ff5722' },
      { name: '高雄', emoji: '🌉', count: 6, region: 'central', color: '#f44336' },
      { name: '屏東', emoji: '🌴', count: 3, region: 'central', color: '#e64a19' },
      { name: '澎湖', emoji: '🐚', count: 1, region: 'central', color: '#00bcd4' },
      { name: '金門', emoji: '🦅', count: 1, region: 'central', color: '#795548' },
      { name: '馬祖', emoji: '🌊', count: 1, region: 'central', color: '#607d8b' },
      { name: '台東', emoji: '🌺', count: 2, region: 'central', color: '#e91e63' },
      { name: '綠島', emoji: '🐢', count: 1, region: 'central', color: '#009688' },
      { name: '蘭嶼', emoji: '🦋', count: 1, region: 'central', color: '#ff9800' },
      
      // 國際區 (29站)
      { name: 'USA', emoji: '🗽', count: 4, region: 'intl', color: '#1a237e' },
      { name: 'Canada', emoji: '🍁', count: 3, region: 'intl', color: '#c62828' },
      { name: 'Japan', emoji: '🗾', count: 4, region: 'intl', color: '#f06292' },
      { name: 'Korea', emoji: '🏯', count: 3, region: 'intl', color: '#5c35a4' },
      { name: 'UK', emoji: '🇬🇧', count: 2, region: 'intl', color: '#1a237e' },
      { name: 'France', emoji: '🗼', count: 2, region: 'intl', color: '#1565c0' },
      { name: 'Germany', emoji: '🏰', count: 2, region: 'intl', color: '#f9a825' },
      { name: 'Australia', emoji: '🦘', count: 3, region: 'intl', color: '#00897b' },
      { name: 'New Zealand', emoji: '🥝', count: 2, region: 'intl', color: '#2e7d32' },
      { name: 'Switzerland', emoji: '🏔️', count: 1, region: 'intl', color: '#d32f2f' },
      { name: 'Netherlands', emoji: '🌷', count: 1, region: 'intl', color: '#ff6f00' },
      { name: 'Sweden', emoji: '❄️', count: 1, region: 'intl', color: '#0277bd' },
      { name: 'Norway', emoji: '🌌', count: 1, region: 'intl', color: '#00838f' }
    ];

    // Representatives data
    const representatives = [
      { name: '代表 A', stations: 8, emoji: '👨‍🌾' },
      { name: '代表 B', stations: 6, emoji: '👩‍🌾' },
      { name: '代表 C', stations: 7, emoji: '👨‍💼' },
      { name: '代表 D', stations: 5, emoji: '👩‍💼' },
      { name: '代表 E', stations: 6, emoji: '👨‍🎓' },
      { name: '代表 F', stations: 7, emoji: '👩‍🎓' },
      { name: '代表 G', stations: 5, emoji: '👨‍🔬' },
      { name: '代表 H', stations: 4, emoji: '👩‍🔬' },
      { name: '代表 I', stations: 3, emoji: '🧑‍💻' }
    ];

    // Load collected stamps from localStorage
    let collected = JSON.parse(localStorage.getItem('ife2026_collected') || '[]');

    // Render stamp grid
    function renderStamps() {
      const grid = document.getElementById('stampGrid');
      grid.innerHTML = stations.map((station, index) => {
        const isCollected = collected.includes(index);
        return `
          <div class="stamp-card ${isCollected ? 'collected' : 'not-collected'}" 
               style="--stamp-color: ${station.color}"
               onclick="collectStamp(${index}, this)"
               data-index="${index}">
            <div class="stamp-year-badge">${station.region === 'intl' ? 'INTL' : 'TW'}</div>
            <div class="stamp-emoji">${station.emoji}</div>
            <div class="stamp-name">${station.name}</div>
            <div class="stamp-count">${station.count} 站</div>
          </div>
        `;
      }).join('');
    }

    // Collect stamp with confetti
    function collectStamp(index, element) {
      if (collected.includes(index)) {
        // Already collected, remove from collection
        collected = collected.filter(i => i !== index);
        localStorage.setItem('ife2026_collected', JSON.stringify(collected));
        element.classList.remove('collected');
        element.classList.add('not-collected');
      } else {
        // New collection!
        collected.push(index);
        localStorage.setItem('ife2026_collected', JSON.stringify(collected));
        element.classList.remove('not-collected');
        element.classList.add('collected', 'just-collected');
        
        // Confetti burst
        const rect = element.getBoundingClientRect();
        const x = (rect.left + rect.width / 2) / window.innerWidth;
        const y = (rect.top + rect.height / 2) / window.innerHeight;
        
        confetti({
          particleCount: 50,
          spread: 60,
          origin: { x, y },
          colors: [stations[index].color, '#c9a227', '#f4d03f']
        });
        
        setTimeout(() => element.classList.remove('just-collected'), 600);
      }
      
      updateStats();
    }

    // Update statistics
    function updateStats() {
      const totalStations = stations.reduce((sum, s) => sum + s.count, 0);
      document.querySelector('.stat-box:nth-child(2) .stat-number').textContent = 
        collected.length + '/' + stations.length;
    }

    // Render representatives
    function renderRepresentatives() {
      const list = document.getElementById('repList');
      list.innerHTML = representatives.map(rep => `
        <div class="rep-card" onclick="confetti({particleCount:30,spread:40,origin:{y:0.6}})">
          <div class="rep-avatar">${rep.emoji}</div>
          <div class="rep-info">
            <div class="rep-name">${rep.name}</div>
            <div class="rep-stations">負責 ${rep.stations} 個站點</div>
          </div>
          <div class="rep-badge">活跃</div>
        </div>
      `).join('');
    }

    // Website link click
    document.getElementById('websiteLink').addEventListener('click', function(e) {
      confetti({
        particleCount: 80,
        spread: 70,
        origin: { y: 0.8 },
        colors: ['#27ae60', '#2ecc71', '#c9a227']
      });
    });

    // Initialize
    renderStamps();
    renderRepresentatives();
    updateStats();
  </script>
</body>
</html>
