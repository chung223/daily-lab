<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>露珠禪境 | Dewdrop Zen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #0a0f0d;
      --bg-surface: #0d1512;
      --leaf-dark: #1a3d2a;
      --leaf-mid: #2d5a40;
      --leaf-light: #4a8c5e;
      --dew-clear: rgba(255, 255, 255, 0.9);
      --dew-glow: rgba(200, 230, 255, 0.6);
      --accent-gold: #d4af37;
      --text-primary: #e8f0ea;
      --text-muted: rgba(232, 240, 234, 0.5);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: var(--bg-deep);
      font-family: 'Noto Serif TC', serif;
      color: var(--text-primary);
      overflow: hidden;
      position: relative;
    }

    /* Mist layers */
    .mist {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .mist-layer {
      position: absolute;
      width: 200%;
      height: 100%;
      background: radial-gradient(ellipse at center, rgba(45, 90, 64, 0.15) 0%, transparent 70%);
      animation: mist-drift 30s ease-in-out infinite;
    }

    .mist-layer:nth-child(2) {
      top: 20%;
      animation-delay: -10s;
      animation-duration: 40s;
      opacity: 0.7;
    }

    .mist-layer:nth-child(3) {
      top: 50%;
      animation-delay: -20s;
      animation-duration: 35s;
      opacity: 0.5;
    }

    @keyframes mist-drift {
      0%, 100% { transform: translateX(-25%) translateY(0); }
      50% { transform: translateX(0%) translateY(-5%); }
    }

    /* Star particles */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      animation: twinkle var(--duration) ease-in-out infinite;
      animation-delay: var(--delay);
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.5); }
    }

    /* Leaf branches */
    .leaf-container {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60%;
      pointer-events: none;
      z-index: 2;
    }

    .leaf {
      position: absolute;
      bottom: 0;
      width: 120px;
      height: 200px;
      background: linear-gradient(to top, var(--leaf-dark), var(--leaf-mid));
      border-radius: 50% 50% 0 50%;
      transform-origin: bottom left;
      opacity: 0.6;
      filter: blur(1px);
    }

    .leaf::after {
      content: '';
      position: absolute;
      left: 10%;
      top: 20%;
      width: 2px;
      height: 60%;
      background: rgba(255, 255, 255, 0.1);
      transform: rotate(-10deg);
    }

    .leaf:nth-child(1) { left: 5%; transform: rotate(-20deg) scale(1.2); }
    .leaf:nth-child(2) { left: 15%; transform: rotate(-35deg) scale(0.9); }
    .leaf:nth-child(3) { left: 25%; transform: rotate(-10deg) scale(1.1); }
    .leaf:nth-child(4) { right: 5%; transform: rotate(20deg) scale(1.3) scaleX(-1); }
    .leaf:nth-child(5) { right: 15%; transform: rotate(35deg) scale(0.8) scaleX(-1); }
    .leaf:nth-child(6) { right: 25%; transform: rotate(10deg) scale(1.0) scaleX(-1); }

    /* Dewdrop canvas */
    #dewdrop-canvas {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    /* Input area */
    .input-area {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .input-wrapper {
      position: relative;
      width: 320px;
      max-width: 90vw;
    }

    .text-input {
      width: 100%;
      padding: 16px 24px;
      font-family: 'Noto Serif TC', serif;
      font-size: 1rem;
      color: var(--text-primary);
      background: rgba(13, 21, 18, 0.7);
      border: 1px solid rgba(74, 140, 94, 0.3);
      border-radius: 30px;
      outline: none;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .text-input::placeholder {
      color: var(--text-muted);
    }

    .text-input:focus {
      border-color: var(--leaf-light);
      box-shadow: 0 0 30px rgba(74, 140, 94, 0.2);
    }

    .submit-btn {
      padding: 10px 28px;
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      color: var(--text-primary);
      background: linear-gradient(135deg, var(--leaf-dark), var(--leaf-mid));
      border: 1px solid rgba(74, 140, 94, 0.4);
      border-radius: 20px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      background: linear-gradient(135deg, var(--leaf-mid), var(--leaf-light));
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(74, 140, 94, 0.3);
    }

    /* Stats */
    .stats {
      position: fixed;
      top: 20px;
      right: 20px;
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      color: var(--text-muted);
      z-index: 10;
      text-align: right;
    }

    .stats span {
      display: block;
      margin-bottom: 4px;
    }

    /* Title */
    .title {
      position: fixed;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: 0.3em;
      z-index: 10;
      text-shadow: 0 0 40px rgba(74, 140, 94, 0.5);
      opacity: 0.8;
    }

    .title-en {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: var(--text-muted);
      margin-top: 4px;
      text-align: center;
    }

    /* Ripple effect */
    .ripple {
      position: fixed;
      border: 1px solid var(--dew-glow);
      border-radius: 50%;
      pointer-events: none;
      animation: ripple-expand 2s ease-out forwards;
      z-index: 4;
    }

    @keyframes ripple-expand {
      0% {
        width: 0;
        height: 0;
        opacity: 0.8;
      }
      100% {
        width: 300px;
        height: 300px;
        opacity: 0;
        margin-left: -150px;
        margin-top: -150px;
      }
    }

    /* Mobile responsive */
    @media (max-width: 600px) {
      .title {
        font-size: 1.2rem;
      }
      .input-wrapper {
        width: 280px;
      }
    }
  </style>
</head>
<body>
  <div class="mist">
    <div class="mist-layer"></div>
    <div class="mist-layer"></div>
    <div class="mist-layer"></div>
  </div>

  <div class="stars" id="stars"></div>

  <div class="leaf-container">
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
  </div>

  <canvas id="dewdrop-canvas"></canvas>

  <div class="title">
    露珠禪境
    <div class="title-en">DEWDROP ZEN</div>
  </div>

  <div class="stats" id="stats">
    <span>凝結 ${count} 次</span>
  </div>

  <div class="input-area">
    <div class="input-wrapper">
      <input type="text" class="text-input" id="textInput" placeholder="輸入思緒，化作露珠..." maxlength="20" autocomplete="off">
    </div>
    <button class="submit-btn" id="submitBtn">凝結</button>
  </div>

  <script>
    // Canvas setup
    const canvas = document.getElementById('dewdrop-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // Generate stars
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 50; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 60 + '%';
      star.style.setProperty('--duration', (2 + Math.random() * 3) + 's');
      star.style.setProperty('--delay', Math.random() * 5 + 's');
      starsContainer.appendChild(star);
    }

    // Dewdrop system
    const dewDrops = [];
    const ripples = [];

    class DewDrop {
      constructor(x, y, text) {
        this.x = x;
        this.y = y;
        this.text = text || '';
        this.radius = 0;
        this.maxRadius = 20 + Math.random() * 15;
        this.growing = true;
        this.opacity = 1;
        this.life = 0;
        this.maxLife = 300 + Math.random() * 200;
        this.floatSpeed = 0.2 + Math.random() * 0.3;
        this.wobble = Math.random() * Math.PI * 2;
        this.wobbleSpeed = 0.02 + Math.random() * 0.02;
        this.particles = [];

        // Create floating particles
        for (let i = 0; i < 8; i++) {
          this.particles.push({
            angle: (i / 8) * Math.PI * 2,
            dist: 30 + Math.random() * 50,
            size: 1 + Math.random() * 2,
            speed: 0.01 + Math.random() * 0.01
          });
        }
      }

      update() {
        this.life++;
        this.wobble += this.wobbleSpeed;

        if (this.growing) {
          this.radius += (this.maxRadius - this.radius) * 0.05;
          if (this.radius >= this.maxRadius - 1) this.growing = false;
        }

        if (this.life > this.maxLife) {
          this.opacity -= 0.01;
        }

        this.y -= this.floatSpeed;

        // Update particles
        this.particles.forEach(p => {
          p.angle += p.speed;
        });
      }

      draw(ctx) {
        if (this.opacity <= 0) return;

        const wobbleX = Math.sin(this.wobble) * 3;
        const drawX = this.x + wobbleX;

        ctx.save();
        ctx.globalAlpha = this.opacity;

        // Glow
        const gradient = ctx.createRadialGradient(drawX, this.y, 0, drawX, this.y, this.radius * 2);
        gradient.addColorStop(0, 'rgba(200, 230, 255, 0.4)');
        gradient.addColorStop(0.5, 'rgba(200, 230, 255, 0.1)');
        gradient.addColorStop(1, 'transparent');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(drawX, this.y, this.radius * 2, 0, Math.PI * 2);
        ctx.fill();

        // Main drop
        const dropGradient = ctx.createRadialGradient(
          drawX - this.radius * 0.3, this.y - this.radius * 0.3, 0,
          drawX, this.y, this.radius
        );
        dropGradient.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
        dropGradient.addColorStop(0.5, 'rgba(220, 240, 255, 0.8)');
        dropGradient.addColorStop(1, 'rgba(180, 220, 240, 0.6)');

        ctx.fillStyle = dropGradient;
        ctx.beginPath();
        ctx.arc(drawX, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();

        // Highlight
        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.beginPath();
        ctx.arc(drawX - this.radius * 0.3, this.y - this.radius * 0.3, this.radius * 0.25, 0, Math.PI * 2);
        ctx.fill();

        // Text
        if (this.text && this.life < this.maxLife * 0.7) {
          const textOpacity = this.life < 50 ? this.life / 50 : 
                            this.life > this.maxLife * 0.5 ? (this.maxLife - this.life) / (this.maxLife * 0.5) : 1;
          ctx.globalAlpha = textOpacity * 0.8;
          ctx.font = '12px "Noto Serif TC", serif';
          ctx.fillStyle = 'rgba(45, 90, 64, 0.9)';
          ctx.textAlign = 'center';
          ctx.fillText(this.text, drawX, this.y + this.radius + 18);
        }

        // Orbiting particles
        ctx.globalAlpha = this.opacity * 0.6;
        this.particles.forEach(p => {
          const px = drawX + Math.cos(p.angle) * p.dist;
          const py = this.y + Math.sin(p.angle) * p.dist * 0.3;
          ctx.fillStyle = 'rgba(200, 230, 255, 0.7)';
          ctx.beginPath();
          ctx.arc(px, py, p.size, 0, Math.PI * 2);
          ctx.fill();
        });

        ctx.restore();
      }

      isDead() {
        return this.opacity <= 0;
      }
    }

    class Ripple {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 0;
        this.maxRadius = 80 + Math.random() * 40;
        this.opacity = 0.6;
      }

      update() {
        this.radius += 1.5;
        this.opacity -= 0.008;
      }

      draw(ctx) {
        if (this.opacity <= 0) return;
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.strokeStyle = 'rgba(200, 230, 255, 0.5)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      isDead() {
        return this.opacity <= 0;
      }
    }

    // Stats
    let count = parseInt(localStorage.getItem('dewdrop-count') || '0');
    document.getElementById('stats').innerHTML = `<span>凝結 ${count} 次</span>`;

    // Input handling
    const textInput = document.getElementById('textInput');
    const submitBtn = document.getElementById('submitBtn');

    function createDew(text = '') {
      const x = width * 0.2 + Math.random() * width * 0.6;
      const y = height * 0.4 + Math.random() * height * 0.3;
      dewDrops.push(new DewDrop(x, y, text));

      count++;
      localStorage.setItem('dewdrop-count', count.toString());
      document.getElementById('stats').innerHTML = `<span>凝結 ${count} 次</span>`;
    }

    function createRipple(x, y) {
      ripples.push(new Ripple(x, y));
    }

    submitBtn.addEventListener('click', () => {
      const text = textInput.value.trim();
      createDew(text);
      textInput.value = '';
      textInput.focus();
    });

    textInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        const text = textInput.value.trim();
        createDew(text);
        textInput.value = '';
      }
    });

    // Canvas click for ripples
    canvas.style.pointerEvents = 'auto';
    canvas.addEventListener('click', (e) => {
      createRipple(e.clientX, e.clientY);
      // Small dewdrop on click
      dewDrops.push(new DewDrop(e.clientX, e.clientY, ''));
    });

    // Animation loop
    function animate() {
      ctx.clearRect(0, 0, width, height);

      // Update and draw ripples
      for (let i = ripples.length - 1; i >= 0; i--) {
        ripples[i].update();
        ripples[i].draw(ctx);
        if (ripples[i].isDead()) ripples.splice(i, 1);
      }

      // Update and draw dew drops
      for (let i = dewDrops.length - 1; i >= 0; i--) {
        dewDrops[i].update();
        dewDrops[i].draw(ctx);
        if (dewDrops[i].isDead()) dewDrops.splice(i, 1);
      }

      // Spawn ambient dew occasionally
      if (Math.random() < 0.005 && dewDrops.length < 15) {
        const x = width * 0.1 + Math.random() * width * 0.8;
        dewDrops.push(new DewDrop(x, height * 0.3, ''));
      }

      requestAnimationFrame(animate);
    }

    animate();

    // Auto spawn a few dew drops on load
    setTimeout(() => {
      for (let i = 0; i < 3; i++) {
        setTimeout(() => {
          const x = width * 0.2 + Math.random() * width * 0.6;
          dewDrops.push(new DewDrop(x, height * 0.4 + Math.random() * height * 0.3, ''));
        }, i * 500);
      }
    }, 500);
  </script>
</body>
</html>
