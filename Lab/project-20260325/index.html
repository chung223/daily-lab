<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Oracle — 提問預言家</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Noto+Serif+TC:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a1628;
            --bg-secondary: #0d1f3c;
            --grid-color: #1e3a5f;
            --text-primary: #e8f4fc;
            --text-secondary: #8ba4c4;
            --accent-red: #ff4757;
            --accent-blue: #3498db;
            --accent-gold: #f1c40f;
            --success: #2ecc71;
            --card-bg: rgba(13, 31, 60, 0.8);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif TC', serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Blueprint Grid Background */
        .blueprint-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px),
                linear-gradient(rgba(30, 58, 95, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(30, 58, 95, 0.3) 1px, transparent 1px);
            background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
            opacity: 0.6;
        }

        /* Floating grid particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--accent-blue);
            opacity: 0.3;
            animation: float 15s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0.3; }
            25% { transform: translateY(-30px) translateX(10px); opacity: 0.6; }
            50% { transform: translateY(-10px) translateX(-10px); opacity: 0.3; }
            75% { transform: translateY(-40px) translateX(5px); opacity: 0.5; }
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 10;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeInDown 0.8s ease-out;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .title {
            font-family: 'Cinzel Decorative', cursive;
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            letter-spacing: 0.3em;
            margin-bottom: 15px;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-style: italic;
        }

        .oracle-icon {
            width: 80px;
            height: 80px;
            margin: 20px auto;
            opacity: 0.8;
        }

        /* Steps */
        .step {
            background: var(--card-bg);
            border: 1px solid var(--grid-color);
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            animation: fadeIn 0.6s ease-out;
            animation-fill-mode: both;
        }

        .step:nth-child(2) { animation-delay: 0.1s; }
        .step:nth-child(3) { animation-delay: 0.2s; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .step-title {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 1.2rem;
            color: var(--accent-blue);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .step-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background: var(--accent-blue);
            color: var(--bg-primary);
            border-radius: 50%;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* Problem Inputs */
        .problem-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .problem-input-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .problem-bullet {
            width: 20px;
            height: 20px;
            border: 2px solid var(--accent-blue);
            border-radius: 50%;
            flex-shrink: 0;
            position: relative;
        }

        .problem-bullet.filled::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            background: var(--accent-blue);
            border-radius: 50%;
        }

        .problem-input {
            flex: 1;
            background: rgba(10, 22, 40, 0.6);
            border: 1px solid var(--grid-color);
            border-radius: 6px;
            padding: 14px 18px;
            font-size: 1rem;
            color: var(--text-primary);
            font-family: 'Noto Serif TC', serif;
            transition: all 0.3s ease;
        }

        .problem-input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 20px rgba(52, 152, 219, 0.2);
        }

        .problem-input::placeholder {
            color: var(--text-secondary);
            opacity: 0.6;
        }

        /* Primary Button */
        .btn-primary {
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 30px auto 0;
            padding: 16px 32px;
            background: linear-gradient(135deg, var(--accent-blue), #2980b9);
            border: none;
            border-radius: 6px;
            color: white;
            font-family: 'Cinzel Decorative', cursive;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(52, 152, 219, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Oracle Question Panel */
        .oracle-panel {
            display: none;
            text-align: center;
        }

        .oracle-panel.active {
            display: block;
            animation: fadeIn 0.5s ease-out;
        }

        .oracle-question {
            font-size: 1.3rem;
            line-height: 1.8;
            margin-bottom: 30px;
            padding: 30px;
            background: rgba(10, 22, 40, 0.5);
            border-left: 4px solid var(--accent-gold);
            border-radius: 0 8px 8px 0;
            text-align: left;
        }

        .oracle-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--accent-gold);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .oracle-label::before {
            content: '◆';
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .choices-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .choice-btn {
            padding: 18px 20px;
            background: var(--card-bg);
            border: 2px solid var(--grid-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: 'Noto Serif TC', serif;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
        }

        .choice-btn:hover {
            border-color: var(--accent-blue);
            background: rgba(52, 152, 219, 0.1);
            transform: translateY(-2px);
        }

        .choice-btn.selected {
            border-color: var(--success);
            background: rgba(46, 204, 113, 0.1);
        }

        /* Result Panel */
        .result-panel {
            display: none;
            text-align: center;
        }

        .result-panel.active {
            display: block;
            animation: fadeIn 0.8s ease-out;
        }

        .priority-badge {
            display: inline-block;
            padding: 8px 20px;
            background: linear-gradient(135deg, var(--accent-red), #e74c3c);
            border-radius: 30px;
            font-family: 'Cinzel Decorative', cursive;
            font-size: 0.9rem;
            margin-bottom: 20px;
            animation: glow 2s infinite;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 71, 87, 0.5); }
            50% { box-shadow: 0 0 40px rgba(255, 71, 87, 0.8); }
        }

        .priority-name {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 2rem;
            margin-bottom: 25px;
            color: var(--accent-gold);
        }

        .insight-card {
            background: rgba(10, 22, 40, 0.6);
            border: 1px solid var(--grid-color);
            border-radius: 12px;
            padding: 30px;
            margin: 25px 0;
            text-align: left;
        }

        .insight-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--accent-gold);
            margin-bottom: 15px;
        }

        .insight-text {
            font-size: 1.15rem;
            line-height: 1.8;
            color: var(--text-primary);
        }

        .harari-quote {
            margin-top: 25px;
            padding: 20px;
            background: rgba(255, 71, 87, 0.1);
            border-left: 3px solid var(--accent-red);
            border-radius: 0 8px 8px 0;
            font-style: italic;
            color: var(--text-secondary);
        }

        /* Clarity Meter */
        .clarity-meter {
            margin: 30px 0;
        }

        .clarity-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .clarity-bar {
            height: 12px;
            background: var(--bg-secondary);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        .clarity-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-red), var(--accent-gold), var(--success));
            border-radius: 6px;
            transition: width 1s ease-out;
            position: relative;
        }

        .clarity-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* Statistics */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid var(--grid-color);
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 1.8rem;
            color: var(--accent-blue);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 5px;
        }

        /* Reset Button */
        .btn-reset {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 30px;
            background: transparent;
            border: 1px solid var(--grid-color);
            border-radius: 6px;
            color: var(--text-secondary);
            font-family: 'Noto Serif TC', serif;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-reset:hover {
            border-color: var(--text-primary);
            color: var(--text-primary);
        }

        /* Hidden utility */
        .hidden {
            display: none !important;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                padding: 25px 15px;
            }
            
            .step {
                padding: 20px;
            }
            
            .title {
                letter-spacing: 0.15em;
            }
            
            .choices-grid {
                grid-template-columns: 1fr;
            }
            
            .stats-bar {
                gap: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="blueprint-bg"></div>
    <div class="particles" id="particles"></div>
    
    <div class="container">
        <header class="header">
            <svg class="oracle-icon" viewBox="0 0 100 100" fill="none">
                <circle cx="50" cy="50" r="45" stroke="#3498db" stroke-width="2" opacity="0.5"/>
                <circle cx="50" cy="50" r="35" stroke="#3498db" stroke-width="1" opacity="0.3"/>
                <circle cx="50" cy="50" r="25" stroke="#3498db" stroke-width="1" opacity="0.2"/>
                <path d="M50 20 L53 40 L70 35 L56 48 L75 55 L55 55 L60 75 L50 58 L45 75 L50 55 L30 55 L49 48 L30 35 L47 40 Z" fill="#3498db" opacity="0.8"/>
                <circle cx="50" cy="50" r="8" fill="#f1c40f"/>
            </svg>
            <h1 class="title">QUESTION ORACLE</h1>
            <p class="subtitle">「幫助我看見真正重要的問題」</p>
        </header>

        <!-- Step 1: Enter Problems -->
        <section class="step" id="step1">
            <h2 class="step-title">
                <span class="step-number">1</span>
                寫下你的問題或困擾
            </h2>
            <div class="problem-list">
                <div class="problem-input-wrapper">
                    <div class="problem-bullet" id="bullet1"></div>
                    <input type="text" class="problem-input" id="problem1" placeholder="例如：工作量大、睡不好、人際關係複雜..." maxlength="50">
                </div>
                <div class="problem-input-wrapper">
                    <div class="problem-bullet" id="bullet2"></div>
                    <input type="text" class="problem-input" id="problem2" placeholder="第二個困擾（選填）" maxlength="50">
                </div>
                <div class="problem-input-wrapper">
                    <div class="problem-bullet" id="bullet3"></div>
                    <input type="text" class="problem-input" id="problem3" placeholder="第三個困擾（選填）" maxlength="50">
                </div>
                <div class="problem-input-wrapper">
                    <div class="problem-bullet" id="bullet4"></div>
                    <input type="text" class="problem-input" id="problem4" placeholder="第四個困擾（選填）" maxlength="50">
                </div>
                <div class="problem-input-wrapper">
                    <div class="problem-bullet" id="bullet5"></div>
                    <input type="text" class="problem-input" id="problem5" placeholder="第五個困擾（選填）" maxlength="50">
                </div>
            </div>
            <button class="btn-primary" id="startBtn" disabled>開始審視 →</button>
        </section>

        <!-- Step 2: Oracle Questions -->
        <section class="step hidden" id="step2">
            <h2 class="step-title">
                <span class="step-number">2</span>
                預言家的提問
            </h2>
            <div class="oracle-panel active" id="oraclePanel">
                <div class="oracle-label">預言家問道</div>
                <p class="oracle-question" id="oracleQuestion"></p>
                <div class="choices-grid" id="choicesGrid"></div>
                <button class="btn-primary" id="answerBtn" disabled>回答 →</button>
            </div>
        </section>

        <!-- Step 3: Result -->
        <section class="step hidden" id="step3">
            <h2 class="step-title">
                <span class="step-number">3</span>
                你的清晰洞察
            </h2>
            <div class="result-panel active" id="resultPanel">
                <div class="priority-badge">★ 最高優先級</div>
                <h3 class="priority-name" id="priorityName"></h3>
                
                <div class="clarity-meter">
                    <div class="clarity-label">
                        <span>清晰度</span>
                        <span id="clarityPercent">0%</span>
                    </div>
                    <div class="clarity-bar">
                        <div class="clarity-fill" id="clarityFill" style="width: 0%"></div>
                    </div>
                </div>

                <div class="insight-card">
                    <div class="insight-label">// 洞察</div>
                    <p class="insight-text" id="insightText"></p>
                </div>

                <div class="harari-quote" id="harariQuote"></div>

                <button class="btn-reset" id="resetBtn">← 重新開始</button>
                
                <div class="stats-bar">
                    <div class="stat-item">
                        <div class="stat-value" id="totalAudits">0</div>
                        <div class="stat-label">審視次數</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="avgClarity">0%</div>
                        <div class="stat-label">平均清晰度</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="totalInsights">0</div>
                        <div class="stat-label">獲得洞察</div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        // State
        let problems = [];
        let currentQuestionIndex = 0;
        let answers = [];
        let selectedChoice = null;

        // Questions based on number of problems
        const questionTemplates = {
            1: [
                {
                    question: "如果這個問題明天就奇蹟般消失了，你的生活會有什麼不同？",
                    choices: (p) => [
                        { text: "會輕鬆很多", score: 1 },
                        { text: "感覺差不多", score: 0 },
                        { text: "不知道", score: 0 }
                    ]
                },
                {
                    question: "這個問題是否讓你長期失眠或焦慮？",
                    choices: (p) => [
                        { text: "是的，經常", score: 2 },
                        { text: "偶爾", score: 1 },
                        { text: "很少", score: 0 }
                    ]
                }
            ],
            2: [
                {
                    question: "如果只能解決其中一個問題，你會選哪一個？",
                    choices: (p) => p.map((prob, i) => ({ text: prob, score: i === 0 ? 2 : 1 }))
                },
                {
                    question: "解決這個問題，會連帶改善另一個嗎？",
                    choices: (p) => [
                        { text: "會的，它們相關", score: 2 },
                        { text: "可能有點關係", score: 1 },
                        { text: "完全獨立", score: 0 }
                    ]
                }
            ],
            3: [
                {
                    question: "哪一個問題阻止你做其他所有事？",
                    choices: (p) => p.map((prob, i) => ({ text: prob, score: i === 0 ? 3 : 1 }))
                },
                {
                    question: "如果三年後回顧，這個問題還重要嗎？",
                    choices: (p) => [
                        { text: "很重要", score: 2 },
                        { text: "可能淡化", score: 1 },
                        { text: "微不足道", score: 0 }
                    ]
                },
                {
                    question: "這個問題是「真正的問題」還是「問題的症狀」？",
                    choices: (p) => [
                        { text: "真正的問題核心", score: 2 },
                        { text: "不確定", score: 1 },
                        { text: "可能是表象", score: 0 }
                    ]
                }
            ],
            4: [
                {
                    question: "如果薩拉赫（前1%有影響力的人）看到你的問題清單，他會說哪個最重要？",
                    choices: (p) => p.map((prob, i) => ({ text: prob, score: Math.random() > 0.5 ? 3 : 1 }))
                },
                {
                    question: "「二八法則」——哪個問題帶來80%的困擾？",
                    choices: (p) => p.map((prob, i) => ({ text: prob, score: i < 2 ? 2 : 1 }))
                }
            ],
            5: [
                {
                    question: "華倫·巴菲特的「不做的清單」——哪個問題你應該直接放棄？",
                    choices: (p) => p.map((prob, i) => ({ text: prob, score: i > 3 ? 2 : 1 }))
                },
                {
                    question: "史蒂夫·賈伯斯會說：「哪個問題值得我投入生命？」",
                    choices: (p) => p.map((prob, i) => ({ text: prob, score: i === 0 ? 3 : 1 }))
                },
                {
                    question: "這個清單中有多少是「他人的問題」而不是「你的問題」？",
                    choices: (p) => [
                        { text: "大部分是別人的", score: 0 },
                        { text: "大約一半", score: 1 },
                        { text: "都是我自己的", score: 2 }
                    ]
                }
            ]
        };

        // Insights based on answers
        const insightTemplates = [
            "你正在解決的是「症狀」而非「根源」。找到源頭，問題自然消散。",
            "這個優先級選擇顯示了你的內心價值觀。跟隨它。",
            "太多的問題清單反而讓人無法行動。專注一件事。",
            "你選的這個問題，解決後會像多米諾骨牌一樣影響其他問題。",
            "有時候「不做」比「做」更有力量。學會取捨。"
        ];

        // Harari quotes
        const harariQuotes = [
            "「95%的人把力氣花在解題，卻只花5%選題——結果解決了錯誤的問題。」—— 哈拉瑞",
            "「人們選錯問題：連5秒專注呼吸都做不到，各種幻想記憶立馬入侵。」—— 哈拉瑞",
            "「資訊不等於真相。真相昂貴且罕見，但了解真相才能選對問題。」—— 哈拉瑞",
            "「Clarity is power。宏觀歷史思維的根源是冥想——停下來，看清楚。」—— 哈拉瑞",
            "「心智是幻想工廠。連自己的思緒都觀察不了，如何選對問題？」—— 哈拉瑞"
        ];

        // DOM Elements
        const problemInputs = [
            document.getElementById('problem1'),
            document.getElementById('problem2'),
            document.getElementById('problem3'),
            document.getElementById('problem4'),
            document.getElementById('problem5')
        ];
        const bullets = [
            document.getElementById('bullet1'),
            document.getElementById('bullet2'),
            document.getElementById('bullet3'),
            document.getElementById('bullet4'),
            document.getElementById('bullet5')
        ];
        const startBtn = document.getElementById('startBtn');
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const step3 = document.getElementById('step3');
        const oracleQuestion = document.getElementById('oracleQuestion');
        const choicesGrid = document.getElementById('choicesGrid');
        const answerBtn = document.getElementById('answerBtn');
        const resultPanel = document.getElementById('resultPanel');

        // Initialize
        function init() {
            loadStats();
            createParticles();
            setupInputListeners();
        }

        // Create floating particles
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 15; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (10 + Math.random() * 10) + 's';
                container.appendChild(particle);
            }
        }

        // Setup input listeners
        function setupInputListeners() {
            problemInputs.forEach((input, index) => {
                input.addEventListener('input', () => {
                    bullets[index].classList.toggle('filled', input.value.trim().length > 0);
                    updateStartButton();
                });
            });

            startBtn.addEventListener('click', startAudit);
            answerBtn.addEventListener('click', handleAnswer);
            document.getElementById('resetBtn').addEventListener('click', reset);
        }

        // Update start button state
        function updateStartButton() {
            const filledProblems = problemInputs.filter(ip => ip.value.trim().length > 0);
            startBtn.disabled = filledProblems.length === 0;
        }

        // Start the audit
        function startAudit() {
            problems = problemInputs
                .map(ip => ip.value.trim())
                .filter(v => v.length > 0);
            
            if (problems.length === 0) return;

            currentQuestionIndex = 0;
            answers = [];
            
            step1.classList.add('hidden');
            step2.classList.remove('hidden');
            
            showQuestion();
        }

        // Show current question
        function showQuestion() {
            const numProblems = problems.length;
            const questions = questionTemplates[numProblems] || questionTemplates[3];
            
            if (currentQuestionIndex >= questions.length) {
                showResult();
                return;
            }

            const q = questions[currentQuestionIndex];
            oracleQuestion.textContent = q.question;
            
            const choices = q.choices(problems);
            choicesGrid.innerHTML = '';
            selectedChoice = null;
            answerBtn.disabled = true;

            choices.forEach((choice, index) => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.textContent = choice.text;
                btn.addEventListener('click', () => selectChoice(btn, choice, index));
                choicesGrid.appendChild(btn);
            });
        }

        // Select a choice
        function selectChoice(btn, choice, index) {
            document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedChoice = choice;
            answerBtn.disabled = false;
        }

        // Handle answer
        function handleAnswer() {
            if (!selectedChoice) return;
            
            answers.push(selectedChoice.score);
            currentQuestionIndex++;
            
            setTimeout(() => {
                showQuestion();
            }, 300);
        }

        // Show result
        function showResult() {
            step2.classList.add('hidden');
            step3.classList.remove('hidden');

            // Calculate priority
            const totalScore = answers.reduce((a, b) => a + b, 0);
            const clarity = Math.min(100, Math.round(60 + (totalScore / answers.length) * 15));
            
            // Select priority problem (first one if tied)
            const priority = problems[0];
            
            // Update UI
            document.getElementById('priorityName').textContent = priority;
            document.getElementById('insightText').textContent = 
                insightTemplates[Math.floor(Math.random() * insightTemplates.length)];
            document.getElementById('harariQuote').textContent = 
                harariQuotes[Math.floor(Math.random() * harariQuotes.length)];
            
            // Animate clarity meter
            setTimeout(() => {
                document.getElementById('clarityFill').style.width = clarity + '%';
                document.getElementById('clarityPercent').textContent = clarity + '%';
            }, 300);

            // Update stats
            updateStats(clarity);
        }

        // Update localStorage stats
        function updateStats(clarity) {
            let stats = JSON.parse(localStorage.getItem('questionOracleStats') || '{"audits":0,"totalClarity":0,"insights":0}');
            stats.audits++;
            stats.totalClarity += clarity;
            stats.insights++;
            localStorage.setItem('questionOracleStats', JSON.stringify(stats));
            loadStats();
        }

        // Load and display stats
        function loadStats() {
            const stats = JSON.parse(localStorage.getItem('questionOracleStats') || '{"audits":0,"totalClarity":0,"insights":0}');
            document.getElementById('totalAudits').textContent = stats.audits;
            document.getElementById('avgClarity').textContent = 
                stats.audits > 0 ? Math.round(stats.totalClarity / stats.audits) + '%' : '0%';
            document.getElementById('totalInsights').textContent = stats.insights;
        }

        // Reset
        function reset() {
            problems = [];
            currentQuestionIndex = 0;
            answers = [];
            selectedChoice = null;

            problemInputs.forEach(ip => ip.value = '');
            bullets.forEach(b => b.classList.remove('filled'));
            startBtn.disabled = true;

            step1.classList.remove('hidden');
            step2.classList.add('hidden');
            step3.classList.add('hidden');
            resultPanel.classList.remove('active');
            
            document.getElementById('clarityFill').style.width = '0%';
            document.getElementById('clarityPercent').textContent = '0%';
        }

        // Start
        init();
    </script>
</body>
</html>
