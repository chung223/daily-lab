<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>幸運拉霸 | Lucky Slots</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Orbitron:wght@700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #1a1a2e;
      --bg-card: #12121f;
      --gold: #ffd700;
      --gold-dark: #b8960b;
      --neon-orange: #ff6b35;
      --lucky-green: #00ff88;
      --text-primary: #ffffff;
      --text-secondary: #a0a0b0;
      --shadow-glow: 0 0 30px rgba(255, 215, 0, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: var(--bg-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      opacity: 0.04;
      pointer-events: none;
      z-index: 1000;
    }

    /* Ambient glow */
    body::after {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255, 107, 53, 0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: -1;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    h1 {
      font-family: 'Righteous', cursive;
      font-size: 2.5rem;
      text-align: center;
      color: var(--gold);
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
      margin-bottom: 30px;
      letter-spacing: 4px;
      animation: titleGlow 2s ease-in-out infinite alternate;
    }

    @keyframes titleGlow {
      from { text-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
      to { text-shadow: 0 0 40px rgba(255, 215, 0, 0.8), 0 0 60px rgba(255, 215, 0, 0.4); }
    }

    .slot-machine {
      background: var(--bg-card);
      border-radius: 24px;
      padding: 30px;
      border: 2px solid rgba(255, 215, 0, 0.2);
      box-shadow: 
        0 0 0 1px rgba(255, 215, 0, 0.1),
        0 20px 60px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      position: relative;
      overflow: hidden;
    }

    .slot-machine::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0.5;
    }

    .slots {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 25px;
    }

    .slot {
      width: 90px;
      height: 120px;
      background: linear-gradient(180deg, #1a1a2e 0%, #0f0f1a 100%);
      border-radius: 16px;
      border: 2px solid rgba(255, 215, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      position: relative;
      overflow: hidden;
      box-shadow: 
        inset 0 2px 10px rgba(0, 0, 0, 0.5),
        0 0 20px rgba(255, 215, 0, 0.1);
    }

    .slot::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 30%;
      background: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, transparent 100%);
      border-radius: 14px 14px 0 0;
    }

    .slot-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.1s;
    }

    .slot.rolling .slot-content {
      animation: roll 0.15s linear infinite;
    }

    @keyframes roll {
      0% { transform: translateY(-10px); opacity: 0.5; }
      50% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(10px); opacity: 0.5; }
    }

    .slot-emoji {
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }

    .stats {
      display: flex;
      justify-content: space-around;
      margin-bottom: 25px;
      padding: 15px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat {
      text-align: center;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .stat-value {
      font-family: 'Orbitron', monospace;
      font-size: 1.25rem;
      color: var(--gold);
    }

    .spin-btn {
      width: 100%;
      padding: 18px 40px;
      font-family: 'Righteous', cursive;
      font-size: 1.5rem;
      letter-spacing: 3px;
      background: linear-gradient(180deg, var(--gold) 0%, var(--gold-dark) 100%);
      border: none;
      border-radius: 50px;
      color: #0a0a0f;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      box-shadow: 
        0 4px 15px rgba(255, 215, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    .spin-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 
        0 8px 25px rgba(255, 215, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    .spin-btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    .spin-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      background: linear-gradient(180deg, #666 0%, #444 100%);
    }

    .spin-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: left 0.5s;
    }

    .spin-btn:hover::before {
      left: 100%;
    }

    .message {
      text-align: center;
      margin-top: 20px;
      font-size: 1.1rem;
      min-height: 30px;
      color: var(--text-secondary);
      transition: all 0.3s;
    }

    .message.win {
      color: var(--gold);
      font-weight: 700;
      animation: winPulse 0.5s ease-out;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }

    .message.big-win {
      color: var(--lucky-green);
      font-size: 1.3rem;
      animation: bigWinPulse 0.6s ease-out;
    }

    @keyframes winPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    @keyframes bigWinPulse {
      0% { transform: scale(0.8); opacity: 0; }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Win celebration */
    .celebration {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
      display: none;
    }

    .celebration.active {
      display: block;
      animation: celebrate 1s ease-out forwards;
    }

    @keyframes celebrate {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }

    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      background: var(--gold);
      animation: fall 1s ease-out forwards;
    }

    @keyframes fall {
      0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    /* Slot border glow on win */
    .slot-machine.winning {
      animation: winBorder 0.5s ease-out 3;
      border-color: var(--gold);
      box-shadow: 
        0 0 0 1px var(--gold),
        0 0 40px rgba(255, 215, 0, 0.5),
        0 20px 60px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    @keyframes winBorder {
      0%, 100% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.3); }
      50% { box-shadow: 0 0 40px rgba(255, 215, 0, 0.6); }
    }

    .slot.winning {
      border-color: var(--gold);
      box-shadow: 
        inset 0 2px 10px rgba(0, 0, 0, 0.5),
        0 0 20px rgba(255, 215, 0, 0.4);
    }

    /* Responsive */
    @media (max-width: 480px) {
      h1 {
        font-size: 1.8rem;
        letter-spacing: 2px;
      }
      
      .slot {
        width: 75px;
        height: 100px;
        font-size: 2.5rem;
      }
      
      .slot-machine {
        padding: 20px;
      }
      
      .spin-btn {
        padding: 15px 30px;
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>💰 幸運拉霸 💰</h1>
    
    <div class="slot-machine" id="slotMachine">
      <div class="slots">
        <div class="slot" id="slot1">
          <div class="slot-content">
            <span class="slot-emoji">🍒</span>
          </div>
        </div>
        <div class="slot" id="slot2">
          <div class="slot-content">
            <span class="slot-emoji">🍒</span>
          </div>
        </div>
        <div class="slot" id="slot3">
          <div class="slot-content">
            <span class="slot-emoji">🍒</span>
          </div>
        </div>
      </div>
      
      <div class="stats">
        <div class="stat">
          <div class="stat-label">總旋轉</div>
          <div class="stat-value" id="totalSpins">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">獲勝次數</div>
          <div class="stat-value" id="totalWins">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">最高連線</div>
          <div class="stat-value" id="maxWin">0</div>
        </div>
      </div>
      
      <button class="spin-btn" id="spinBtn">🎰 旋轉</button>
      
      <div class="message" id="message">準備好了嗎？開始吧！</div>
    </div>
  </div>
  
  <div class="celebration" id="celebration"></div>

  <script>
    // Symbols with weights (higher = more common)
    const symbols = [
      { emoji: '🍒', weight: 30 },
      { emoji: '⭐', weight: 25 },
      { emoji: '🔔', weight: 20 },
      { emoji: '💎', weight: 15 },
      { emoji: '🍀', weight: 10 }
    ];

    // Weighted random selection
    function getRandomSymbol() {
      const totalWeight = symbols.reduce((sum, s) => sum + s.weight, 0);
      let random = Math.random() * totalWeight;
      
      for (const symbol of symbols) {
        random -= symbol.weight;
        if (random <= 0) return symbol;
      }
      return symbols[0];
    }

    // Load stats from localStorage
    function loadStats() {
      const stats = JSON.parse(localStorage.getItem('luckySlotsStats') || '{"totalSpins":0,"totalWins":0,"maxWin":0}');
      document.getElementById('totalSpins').textContent = stats.totalSpins;
      document.getElementById('totalWins').textContent = stats.totalWins;
      document.getElementById('maxWin').textContent = stats.maxWin;
      return stats;
    }

    // Save stats to localStorage
    function saveStats(stats) {
      localStorage.setItem('luckySlotsStats', JSON.stringify(stats));
    }

    // Update stats display
    function updateStatsDisplay(stats) {
      document.getElementById('totalSpins').textContent = stats.totalSpins;
      document.getElementById('totalWins').textContent = stats.totalWins;
      document.getElementById('maxWin').textContent = stats.maxWin;
    }

    // Create confetti
    function createConfetti() {
      const celebration = document.getElementById('celebration');
      celebration.innerHTML = '';
      celebration.classList.add('active');
      
      const colors = ['#ffd700', '#ff6b35', '#00ff88', '#ff69b4', '#00bfff'];
      
      for (let i = 0; i < 50; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.animationDelay = Math.random() * 0.5 + 's';
        confetti.style.animationDuration = (0.8 + Math.random() * 0.5) + 's';
        celebration.appendChild(confetti);
      }
      
      setTimeout(() => {
        celebration.classList.remove('active');
      }, 1500);
    }

    // Main spin function
    async function spin() {
      const spinBtn = document.getElementById('spinBtn');
      const slot1 = document.getElementById('slot1');
      const slot2 = document.getElementById('slot2');
      const slot3 = document.getElementById('slot3');
      const message = document.getElementById('message');
      const slotMachine = document.getElementById('slotMachine');
      
      // Disable button
      spinBtn.disabled = true;
      message.textContent = '旋轉中...';
      message.className = 'message';
      
      // Add rolling animation
      slot1.classList.add('rolling');
      slot2.classList.add('rolling');
      slot3.classList.add('rolling');
      
      // Generate results
      const result1 = getRandomSymbol();
      const result2 = getRandomSymbol();
      const result3 = getRandomSymbol();
      
      // Animate each slot with delay
      const spinDuration = 1500;
      
      // Slot 1 stops first
      setTimeout(() => {
        slot1.classList.remove('rolling');
        slot1.querySelector('.slot-emoji').textContent = result1.emoji;
      }, spinDuration * 0.6);
      
      // Slot 2 stops second
      setTimeout(() => {
        slot2.classList.remove('rolling');
        slot2.querySelector('.slot-emoji').textContent = result2.emoji;
      }, spinDuration * 0.8);
      
      // Slot 3 stops last
      setTimeout(() => {
        slot3.classList.remove('rolling');
        slot3.querySelector('.slot-emoji').textContent = result3.emoji;
      }, spinDuration);
      
      // Wait for all animations to complete
      await new Promise(resolve => setTimeout(resolve, spinDuration + 200));
      
      // Check win
      const results = [result1.emoji, result2.emoji, result3.emoji];
      const unique = [...new Set(results)];
      
      // Load and update stats
      let stats = loadStats();
      stats.totalSpins++;
      
      let winType = 0;
      let winMessage = '再來一次！';
      let isWin = false;
      
      if (unique.length === 1) {
        // 3 of a kind - Big Win!
        winType = 3;
        winMessage = '🎉 大獲勝！ 🎉';
        isWin = true;
        stats.totalWins++;
        stats.maxWin = Math.max(stats.maxWin, 3);
      } else if (unique.length === 2) {
        // 2 of a kind - Small Win
        const counts = {};
        results.forEach(r => counts[r] = (counts[r] || 0) + 1);
        const hasPair = Object.values(counts).includes(2);
        
        if (hasPair) {
          winType = 2;
          winMessage = '✨ 小獲勝！ ✨';
          isWin = true;
          stats.totalWins++;
          stats.maxWin = Math.max(stats.maxWin, 2);
        }
      }
      
      saveStats(stats);
      updateStatsDisplay(stats);
      
      // Show result
      message.textContent = winMessage;
      
      if (isWin) {
        if (winType === 3) {
          message.className = 'message big-win';
          slotMachine.classList.add('winning');
          [slot1, slot2, slot3].forEach(s => s.classList.add('winning'));
          createConfetti();
        } else {
          message.className = 'message win';
        }
        
        // Remove winning styles after animation
        setTimeout(() => {
          slotMachine.classList.remove('winning');
          [slot1, slot2, slot3].forEach(s => s.classList.remove('winning'));
        }, 1500);
      }
      
      // Re-enable button
      spinBtn.disabled = false;
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      loadStats();
      document.getElementById('spinBtn').addEventListener('click', spin);
    });
  </script>
</body>
</html>
