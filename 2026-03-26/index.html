<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>時間之結 | Time Knot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep: #050508;
      --bg-surface: rgba(255,255,255,0.03);
      --glass: rgba(255,255,255,0.06);
      --glass-border: rgba(255,255,255,0.10);
      --text-primary: #f0f4ff;
      --text-muted: rgba(240,244,255,0.5);
      --accent-cyan: #00f5ff;
      --accent-purple: #a855f7;
      --accent-pink: #ff6b9d;
      --accent-gold: #fbbf24;
      --accent-emerald: #34d399;
      --accent-blue: #60a5fa;
    }

    body {
      font-family: 'Noto Serif TC', serif;
      background: var(--bg-deep);
      color: var(--text-primary);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* Stars background */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .star {
      position: absolute;
      border-radius: 50%;
      background: white;
      animation: twinkle var(--d, 3s) ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.5); }
    }

    /* Nebula drift */
    .nebula {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.3;
    }

    .nebula::before, .nebula::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      animation: nebulaDrift 20s ease-in-out infinite alternate;
    }

    .nebula::before {
      width: 60vw; height: 60vw;
      top: -20%; left: -10%;
      background: radial-gradient(circle, rgba(168,85,247,0.15) 0%, transparent 70%);
    }

    .nebula::after {
      width: 50vw; height: 50vw;
      bottom: -20%; right: -10%;
      background: radial-gradient(circle, rgba(0,245,255,0.1) 0%, transparent 70%);
      animation-delay: -10s;
    }

    @keyframes nebulaDrift {
      0% { transform: translate(0,0) scale(1); }
      100% { transform: translate(5vw, 3vh) scale(1.1); }
    }

    /* Noise overlay */
    .noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 256px 256px;
    }

    /* Canvas */
    #canvas {
      position: fixed;
      inset: 0;
      z-index: 2;
      cursor: crosshair;
    }

    /* Knot nodes (DOM elements for clickable moments) */
    .knot-node {
      position: fixed;
      z-index: 3;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .knot-node:hover {
      transform: scale(1.15);
    }

    .knot-node .knot-label {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      color: var(--text-primary);
      text-align: center;
      padding: 4px 8px;
      max-width: 80px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      opacity: 0.9;
    }

    .knot-node .knot-time {
      font-family: 'DM Mono', monospace;
      font-size: 8px;
      color: var(--text-muted);
      text-align: center;
    }

    .knot-node .knot-pulse {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 1px solid currentColor;
      opacity: 0;
      animation: knotPulse 3s ease-out infinite;
    }

    @keyframes knotPulse {
      0% { transform: scale(1); opacity: 0.5; }
      100% { transform: scale(2); opacity: 0; }
    }

    /* UI Panel */
    .panel {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      animation: fadeInUp 0.8s ease-out;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateX(-50%) translateY(20px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    .panel-glass {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 20px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 60px rgba(168,85,247,0.05);
    }

    .title-row {
      text-align: center;
    }

    .title-row h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.1em;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .title-row p {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 4px;
      letter-spacing: 0.05em;
    }

    .input-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    .input-group input[type="text"] {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 10px 16px;
      color: var(--text-primary);
      font-family: 'Noto Serif TC', serif;
      font-size: 14px;
      outline: none;
      width: 180px;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .input-group input[type="text"]:focus {
      border-color: var(--accent-purple);
      box-shadow: 0 0 20px rgba(168,85,247,0.2);
    }

    .input-group input[type="text"]::placeholder {
      color: var(--text-muted);
    }

    .input-group input[type="datetime-local"] {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 10px 12px;
      color: var(--text-primary);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      outline: none;
      color-scheme: dark;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .input-group input[type="datetime-local"]:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 20px rgba(0,245,255,0.2);
    }

    .btn {
      background: linear-gradient(135deg, rgba(168,85,247,0.3), rgba(0,245,255,0.2));
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 10px 20px;
      color: var(--text-primary);
      font-family: 'Noto Serif TC', serif;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 0.05em;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(168,85,247,0.3), 0 0 40px rgba(0,245,255,0.1);
      border-color: rgba(168,85,247,0.4);
    }

    .btn:hover::before { opacity: 1; }

    .btn:active { transform: translateY(0); }

    .btn-secondary {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--glass-border);
      padding: 10px 16px;
    }

    .btn-secondary:hover {
      border-color: rgba(255,255,255,0.2);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    /* Stats */
    .stats {
      display: flex;
      gap: 20px;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--text-muted);
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .stat-value {
      color: var(--text-primary);
      font-size: 12px;
    }

    /* Hint */
    .hint {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      color: var(--text-muted);
      text-align: center;
      opacity: 0.6;
      letter-spacing: 0.03em;
    }

    /* Click ripple */
    .ripple {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 5;
      border: 1px solid;
      animation: rippleOut 1s ease-out forwards;
    }

    @keyframes rippleOut {
      0% { width: 0; height: 0; opacity: 0.8; }
      100% { width: 120px; height: 120px; opacity: 0; }
    }

    /* Quote toast */
    .quote-toast {
      position: fixed;
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(5,5,8,0.9);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 14px 24px;
      max-width: 500px;
      text-align: center;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      animation: quoteIn 0.6s ease-out, quoteOut 0.6s ease-in 4.4s forwards;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }

    .quote-toast p {
      font-size: 13px;
      color: var(--text-primary);
      line-height: 1.6;
    }

    .quote-toast .quote-author {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    @keyframes quoteIn {
      from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    @keyframes quoteOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }

    /* Responsive */
    @media (max-width: 600px) {
      .panel-glass { padding: 16px 20px; }
      .input-group { flex-direction: column; }
      .input-group input[type="text"] { width: 100%; }
      .title-row h1 { font-size: 17px; }
      .stats { flex-direction: column; gap: 8px; align-items: center; }
    }
  </style>
</head>
<body>

  <!-- Background layers -->
  <div class="nebula"></div>
  <div class="stars" id="stars"></div>
  <div class="noise"></div>

  <!-- Canvas for particles -->
  <canvas id="canvas"></canvas>

  <!-- Knot nodes container -->
  <div id="knots-container"></div>

  <!-- UI Panel -->
  <div class="panel">
    <div class="panel-glass">
      <div class="title-row">
        <h1>時間之結</h1>
        <p>TIME KNOT · connect moments across time</p>
      </div>

      <div class="input-group">
        <input type="text" id="momentText" placeholder="此刻的想法..." maxlength="40">
        <input type="datetime-local" id="momentTime">
        <button class="btn" id="addBtn">✦ 連結此刻</button>
        <button class="btn btn-secondary" id="clearBtn">清除</button>
      </div>

      <div class="stats">
        <div class="stat-item">
          <span class="stat-dot" style="background: var(--accent-cyan);"></span>
          <span>結點</span>
          <span class="stat-value" id="statKnots">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-dot" style="background: var(--accent-purple);"></span>
          <span>連結</span>
          <span class="stat-value" id="statLinks">0</span>
      </div>
    </div>
    <p class="hint">點擊任意位置產生連接波 · 點擊結點查看時間 · 每 5 個結點揭示一句時光之語</p>
  </div>

  <script>
    // === State ===
    const COLORS = ['#00f5ff','#a855f7','#ff6b9d','#fbbf24','#34d399','#60a5fa'];
    let knots = [];
    let particles = [];
    let ripples = [];
    let totalLinks = 0;

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const knotsContainer = document.getElementById('knots-container');

    // === Quotes ===
    const QUOTES = [
      { text: "時間不是直線，而是一張編織的網", author: "時間哲學" },
      { text: "每一刻都是一個結，串聯過去與未來", author: "時間之結" },
      { text: "現在是過去的未來，未來是未來的過去", author: "時間相對論" },
      { text: "在時間的長河中，每個瞬間都是永恆", author: "瞬恆哲學" },
      { text: "你無法踏入同一條河流兩次，但河流從未離開", author: "赫拉克利特" },
      { text: "時間是意識的錯覺，還是錯覺的意識？", author: "時間之結" },
      { text: "過去不存在，未來尚未存在，只有此刻是真實", author: "禪宗智慧" },
    ];

    // === Setup ===
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // Stars
    function createStars() {
      const container = document.getElementById('stars');
      for (let i = 0; i < 120; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = Math.random() * 2 + 1;
        star.style.cssText = `
          width:${size}px;height:${size}px;
          left:${Math.random()*100}%;top:${Math.random()*100}%;
          --d:${(Math.random()*4+2).toFixed(1)}s;
          animation-delay:${(Math.random()*4).toFixed(1)}s;
          opacity:${Math.random()*0.5+0.1};
        `;
        container.appendChild(star);
      }
    }
    createStars();

    // === Particles ===
    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 1.5;
        this.vy = (Math.random() - 0.5) * 1.5;
        this.life = 1;
        this.decay = Math.random() * 0.008 + 0.003;
        this.size = Math.random() * 2.5 + 0.5;
        this.color = color;
        this.angle = Math.random() * Math.PI * 2;
        this.spin = (Math.random() - 0.5) * 0.1;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.angle += this.spin;
        this.life -= this.decay;
        // gentle drift toward nearest knot
        if (knots.length > 0 && Math.random() < 0.01) {
          const target = knots[Math.floor(Math.random() * knots.length)];
          const dx = target.x - this.x;
          const dy = target.y - this.y;
          this.vx += dx * 0.0003;
          this.vy += dy * 0.0003;
        }
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.globalAlpha = this.life * 0.7;
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = this.color;
        ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
        ctx.restore();
      }
    }

    // Ambient particles
    function spawnAmbientParticle() {
      const x = Math.random() * canvas.width;
      const y = Math.random() * canvas.height;
      const color = COLORS[Math.floor(Math.random() * COLORS.length)];
      particles.push(new Particle(x, y, color));
    }

    // Burst particles
    function burstParticles(x, y, color, count = 15) {
      for (let i = 0; i < count; i++) {
        const p = new Particle(x, y, color);
        p.vx = (Math.random() - 0.5) * 4;
        p.vy = (Math.random() - 0.5) * 4;
        p.decay = Math.random() * 0.015 + 0.005;
        particles.push(p);
      }
    }

    // Flow particles from new knot toward existing ones
    function flowParticles(x, y, color) {
      if (knots.length <= 1) return;
      for (let i = 0; i < 8; i++) {
        const target = knots.filter(k => k.x !== x || k.y !== y)[Math.floor(Math.random() * (knots.length - 1))] || knots[0];
        const p = new Particle(x, y, color);
        const dx = target.x - x;
        const dy = target.y - y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        p.vx = dx / dist * (1.5 + Math.random());
        p.vy = dy / dist * (1.5 + Math.random());
        p.decay = Math.random() * 0.02 + 0.01;
        p.size = Math.random() * 2 + 1;
        particles.push(p);
      }
    }

    // === Ripples ===
    class Ripple {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.r = 0;
        this.maxR = 80 + Math.random() * 40;
        this.color = color;
        this.life = 1;
      }
      update() {
        this.r += 2.5;
        this.life = Math.max(0, 1 - this.r / this.maxR);
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.strokeStyle = this.color;
        ctx.globalAlpha = this.life * 0.6;
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }

    // === Connection lines between knots ===
    function drawConnections() {
      for (let i = 0; i < knots.length; i++) {
        for (let j = i + 1; j < knots.length; j++) {
          const a = knots[i], b = knots[j];
          const dx = b.x - a.x, dy = b.y - a.y;
          const dist = Math.sqrt(dx*dx + dy*dy);
          if (dist < 400) {
            const alpha = (1 - dist / 400) * 0.15;
            const grad = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
            grad.addColorStop(0, a.color);
            grad.addColorStop(1, b.color);
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.strokeStyle = grad;
            ctx.globalAlpha = alpha;
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.globalAlpha = 1;
          }
        }
      }
    }

    // === Knot DOM nodes ===
    function createKnotNode(knot) {
      const el = document.createElement('div');
      el.className = 'knot-node';
      const size = 44 + Math.random() * 16;
      el.style.cssText = `
        width:${size}px; height:${size}px;
        left:${knot.x - size/2}px; top:${knot.y - size/2}px;
        background: radial-gradient(circle, ${knot.color}22 0%, transparent 70%),
                    rgba(255,255,255,0.03);
        border: 1.5px solid ${knot.color}66;
        box-shadow: 0 0 20px ${knot.color}33, inset 0 0 10px ${knot.color}11;
        color: ${knot.color};
      `;

      const label = document.createElement('div');
      label.className = 'knot-label';
      label.textContent = knot.text;

      const time = document.createElement('div');
      time.className = 'knot-time';
      time.textContent = new Date(knot.timestamp).toLocaleDateString('zh-TW', {month:'numeric', day:'numeric'});

      const pulse = document.createElement('div');
      pulse.className = 'knot-pulse';

      el.appendChild(pulse);
      el.appendChild(label);
      el.appendChild(time);

      el.addEventListener('click', (e) => {
        e.stopPropagation();
        burstParticles(knot.x, knot.y, knot.color, 20);
        showKnotInfo(knot);
      });

      knotsContainer.appendChild(el);
      knot.el = el;
    }

    function showKnotInfo(knot) {
      // Brief flash on the node
      if (knot.el) {
        knot.el.style.transform = 'scale(1.3)';
        setTimeout(() => { knot.el.style.transform = ''; }, 300);
      }
      // Ripple
      ripples.push(new Ripple(knot.x, knot.y, knot.color));
    }

    // === Quote toast ===
    let quoteCount = 0;
    function showQuote() {
      quoteCount++;
      const q = QUOTES[Math.floor(Math.random() * QUOTES.length)];
      const toast = document.createElement('div');
      toast.className = 'quote-toast';
      toast.innerHTML = `<p>"${q.text}"</p><div class="quote-author">— ${q.author}</div>`;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 5000);
    }

    // === Ripple on canvas click ===
    canvas.addEventListener('click', (e) => {
      const color = COLORS[Math.floor(Math.random() * COLORS.length)];
      ripples.push(new Ripple(e.clientX, e.clientY, color));
      burstParticles(e.clientX, e.clientY, color, 8);
    });

    // === Add knot ===
    document.getElementById('addBtn').addEventListener('click', addKnot);
    document.getElementById('momentText').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addKnot();
    });

    function addKnot() {
      const text = document.getElementById('momentText').value.trim();
      const timeInput = document.getElementById('momentTime').value;
      const timestamp = timeInput ? new Date(timeInput).getTime() : Date.now();

      if (!text) return;

      const color = COLORS[knots.length % COLORS.length];
      // Random position avoiding edges
      const margin = 120;
      const x = margin + Math.random() * (canvas.width - margin * 2);
      const y = margin + Math.random() * (canvas.height - margin * 2 - 180);

      const knot = { id: Date.now(), text, timestamp, color, x, y };
      knots.push(knot);
      createKnotNode(knot);
      burstParticles(x, y, color, 25);
      flowParticles(x, y, color);
      ripples.push(new Ripple(x, y, color));
      totalLinks++;
      saveKnots();
      updateStats();

      document.getElementById('momentText').value = '';

      if (knots.length % 5 === 0) showQuote();
    }

    // === Clear ===
    document.getElementById('clearBtn').addEventListener('click', () => {
      knots.forEach(k => { if (k.el) k.el.remove(); });
      knots = [];
      particles = [];
      ripples = [];
      knotsContainer.innerHTML = '';
      totalLinks = 0;
      localStorage.removeItem('timeknot');
      updateStats();
    });

    // === Stats ===
    function updateStats() {
      document.getElementById('statKnots').textContent = knots.length;
      document.getElementById('statLinks').textContent = totalLinks;
    }

    // === localStorage ===
    function saveKnots() {
      const data = knots.map(k => ({ id:k.id, text:k.text, timestamp:k.timestamp, color:k.color }));
      localStorage.setItem('timeknot', JSON.stringify(data));
    }

    function loadKnots() {
      const raw = localStorage.getItem('timeknot');
      if (!raw) return;
      try {
        const data = JSON.parse(raw);
        knots = [];
        data.forEach(k => {
          // Place loaded knots in a circle
          const idx = knots.length;
          const angle = (idx / Math.max(data.length, 1)) * Math.PI * 2;
          const radius = Math.min(canvas.width, canvas.height) * 0.28;
          const cx = canvas.width / 2 + Math.cos(angle) * radius;
          const cy = canvas.height / 2 - 80 + Math.sin(angle) * radius;
          knots.push({ ...k, x: cx, y: cy });
          createKnotNode(knots[knots.length-1]);
        });
        totalLinks = knots.length;
        updateStats();
      } catch(e) {}
    }

    // === Animation loop ===
    let lastAmbient = 0;
    function animate(ts) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw connections
      if (knots.length > 1) drawConnections();

      // Update ripples
      ripples = ripples.filter(r => r.life > 0);
      ripples.forEach(r => { r.update(); r.draw(); });

      // Ambient particles
      if (ts - lastAmbient > 200) {
        spawnAmbientParticle();
        lastAmbient = ts;
      }

      // Update particles
      particles = particles.filter(p => p.life > 0);
      particles.forEach(p => { p.update(); p.draw(); });

      requestAnimationFrame(animate);
    }

    // === Init ===
    loadKnots();
    animate(0);

    // Auto-set datetime to now
    function setNow() {
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      document.getElementById('momentTime').value = now.toISOString().slice(0,16);
    }
    setNow();
  </script>
</body>
</html>
